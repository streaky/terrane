[workspace]
members = [
    "crates/terrane-cli",
    "crates/terrane-compiler",
    "crates/terrane-int-support",
    "crates/terrane-collection-support",
    "crates/terrane-scalar-support",
    "crates/terrane-language-server",
    "crates/terrane-string-support",
    "crates/terrane-document-support",
    "crates/terrane-stream-abi",
    "crates/terrane-platform-support",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98.1"

[workspace.dependencies]
rustdoc-types = "=0.57.0"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
