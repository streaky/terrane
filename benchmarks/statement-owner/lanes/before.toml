id = "before"
name = "Actual before compiler"
implementation = "terrane/main.trn"
prepare = ["python", "${suite}/prepare.py", "${implementation}", "before"]
prepare-output = "executable-path"
run = ["${suite}/.trn/launch", "${prepared}"]
environment = [["rustc", "+1.100.0", "--version"], ["cargo", "+1.100.0", "--version"]]
[metadata]
implementation = "Unmodified Rust emitted by the selected compiler revision"
native-build-profile = "Stable Rust 1.100.0; opt-level 3, fat LTO, one codegen unit"
