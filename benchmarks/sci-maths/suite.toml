format = 2
name = "Terrane scientific mathematics and data workloads"

[measurement]
warmups = 2
runs = 7
setup-timeout-seconds = 300
runtime-timeout-seconds = 60

[[lanes]]
path = "lanes/terrane.toml"

[[lanes]]
path = "lanes/python.toml"

[[lanes]]
path = "lanes/rust.toml"

[[lanes]]
path = "lanes/go.toml"

[[lanes]]
path = "lanes/python-scipy.toml"

[[lanes]]
path = "lanes/terrane-numr.toml"

[[groups]]
id = "language-baseline"
name = "Language baseline"
lanes = ["terrane", "python", "rust", "go"]

[[groups.problems]]
path = "problems/scalar-reduction"

[[groups.problems]]
path = "problems/elementwise-materialized"

[[groups.problems]]
path = "problems/fused-transform-reduction"

[[groups.problems]]
path = "problems/collatz-branching"

[[groups.problems]]
path = "problems/standard-score-outliers"

[[groups]]
id = "scientific-stack"
name = "Scientific stack"
lanes = ["python-scipy", "terrane", "terrane-numr"]

[[groups.problems]]
path = "problems/bessel-kernel-energy"

[[groups.problems]]
path = "problems/gamma-survival-calibration"
