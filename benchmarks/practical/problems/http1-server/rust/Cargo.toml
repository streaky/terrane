[package]
name = "http-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "=1.0.86"
axum = "=0.6.20"
hyper = { version = "=0.14.30", features = ["full"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
tokio = { version = "=1.38.0", features = ["full"] }
lazy_static = "=1.5.0"

[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
