- id: book.namespaces-imports-and-packages
  title: Namespaces, Imports, and Packages
  summary: 'The strict reporting tool now has several distinct responsibilities: an application chooses
    input and recovery policy,

    reporting code validates and presents a batch, and an error type describes invalid entries. Keeping
    all of that in one

    file makes the complete flow visible, but it also makes every declaration appear equally close to
    every other

    declaration.'
