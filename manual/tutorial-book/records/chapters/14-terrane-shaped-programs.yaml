format: 1
id: book.terrane-shaped-programs
kind: chapter
surface: null
lifecycle:
  status: current
  stability: experimental
  since: "0.1"
  deprecated-since: null
  removed-in: null
  replacement: null
documentation:
  status: complete
  title: Writing Terrane-Shaped Programs
  title-style: text
  summary: |-
    We have now met enough of Terrane to write the same behavior in several technically valid ways. That is where style
    begins to matter.
  tags: []
  blocks:
    - type: markdown
      markdown: |-
        Style is not a contest to use the most distinctive language feature. It is the
        practice of making important decisions visible and leaving ordinary decisions
        ordinary. A good Terrane program should reveal its domain before it reveals its
        machinery.

        The guidelines in this chapter gather the habits developed throughout the book:

        - prefer direct values, calls, branches, and iteration;
        - trust inference until an annotation communicates a contract;
        - distinguish independent values from shared identity;
        - let the layer that can respond own an error;
        - keep concurrent work structurally bounded;
        - write source for readers rather than for a guessed Rust representation.

        We will finish by refactoring the task-list idea from Chapters 9 and 10 into a
        small writing plan. It will not use every feature we have learned. Deliberately
        leaving machinery out is part of the design.
  sections:
    - id: prefer-the-ordinary-operation
      title: Prefer the ordinary operation
      blocks:
        - type: markdown
          markdown: |-
            Terrane gives its most common operations the least ceremony:
        - type: example
          id: legacy-fence-001
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            total = price * quantity
            print; 'Total: ', total
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A name selects a value. A dot selects a member. A semicolon invokes a callable.
            Assignment gives independent value semantics. Indentation carries block
            structure.

            Begin there.

            Do not introduce a class when a few values and functions already describe the
            problem. Do not introduce a reference when independent values are correct. Do
            not make a function asynchronous when the caller immediately needs its result
            and no independent work can progress. Do not catch an error at a layer that has
            no useful recovery policy.

            This principle is not “always choose the shortest source.” The ordinary
            operation is the one whose semantics match the ordinary intent. An explicit
            type, `move`, task scope, or custom error can be clearer than shorter code when
            the underlying decision matters.

            A useful review sequence is:

            1. What behavior does the user need?
            2. What is the most direct Terrane operation expressing it?
            3. Which boundary needs a stronger contract?
            4. Which additional mechanism earns its place by making that contract visible?

            Starting from machinery reverses those priorities. It tends to produce
            abstractions in search of a requirement.
      sections: []
    - id: let-inference-remove-noise
      title: Let inference remove noise
      blocks:
        - type: markdown
          markdown: |-
            Terrane is statically typed even when a declaration omits a written type:
        - type: example
          id: legacy-fence-002
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            name = 'Terrane'
            count = 3
            complete = false
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The compiler still knows the contracts. The source simply avoids repeating facts
            already made obvious by the initializer.

            Prefer inference for local values whose type is clear and stable:
        - type: example
          id: legacy-fence-003
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            total = 0
            for estimate in estimates
              total = total + estimate
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Writing `total int = 0` is also valid, but it should communicate something more
            than “the compiler has a type system.” Perhaps the exact numeric contract
            matters at an interface, the initializer is ambiguous, or a later widening would
            violate an intended invariant.

            Inference is especially valuable during early design. It lets the domain
            vocabulary emerge without requiring every intermediate value to announce
            implementation detail. As the program grows, annotations can be added at the
            boundaries that need them without converting the source into a different
            “serious” dialect.

            Avoid the opposite extreme as well. If understanding a public function requires
            reconstructing its return possibilities from several branches, write the return
            contract. If a field's allowed absence is central to the model, write `T|none`.
            If a fixed width controls a file format or foreign boundary, say so.

            The style rule is:

            > Infer what is obvious; annotate what is contractual.
      sections: []
    - id: use-types-to-state-real-contracts
      title: Use types to state real contracts
      blocks:
        - type: markdown
          markdown: |-
            A type annotation earns its place when it restricts or explains behavior another
            part of the program may depend on.

            This function communicates a useful boundary:
        - type: example
          id: legacy-fence-004
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function estimate-units int; title string
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The names help a reader; the contracts help both reader and compiler. The
            function promises an integer result for a string input.

            Optional and union contracts should likewise describe real domain possibilities:
        - type: example
          id: legacy-fence-005
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            estimate int8|none = none
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            That is appropriate when “not estimated” is meaningful. It is not appropriate
            merely because an implementation has not yet decided how to obtain the estimate.

            Fixed-width integers are useful for external formats, bounded fields, or exact
            interoperability. Ordinary `int` is usually better for counts and arithmetic
            that should not acquire machine overflow merely because the program grew.

            Interfaces state behavioral boundaries shared by different concrete values:
        - type: example
          id: legacy-fence-006
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            interface plan-item
              function render string;
              function estimate-units int;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Use one when consumers genuinely need multiple implementations through one
            contract. Do not create an interface for every class in anticipation of
            hypothetical alternatives. An unused abstraction is not future-proofing; it is
            another concept every reader must carry now.

            Types should make invalid states difficult to express, but they should not
            encode incidental implementation choices as public promises.
      sections: []
    - id: pass-values-unless-identity-matters
      title: Pass values unless identity matters
      blocks:
        - type: markdown
          markdown: |-
            Chapter 11 gave us a strong default:
        - type: example
          id: legacy-fence-007
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            local = incoming
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The two bindings denote independent logical values. The compiler may preserve
            that behavior with cheap copy-on-write storage or copy elision.

            Pass a value to a function when the callee needs information or an independent
            result. Use `ref` only when the callee must observe or mutate one identity owned
            elsewhere:
        - type: example
          id: legacy-fence-008
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function inspect int; values ref list of int
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Use `shared ref` only when the recipient must also extend the identity's
            lifetime. Use `move` when ownership leaves the caller.

            The same distinction survives inside collections. A list remains identity-less
            even if its elements are references, while copied `ref` or `shared ref` values
            still denote the same referent and therefore compare true with `is`.
            Copy-on-write separation preserves the unmutated collection without creating
            shared identity. A collection replacement releases the displaced logical item
            before returning once no other owner retains it. Removal returns the item and
            transfers its remaining lifetime to the caller; list clearing and ordered
            collection destruction release items in iteration order. Use
            `value.type.inherently-identity-bearing` when reflective code needs to ask
            whether a type carries identity by contract rather than by compiler
            representation. Built-in descriptor identities are namespace-qualified too: an
            `int` reports `/core/types::int`, and a `list of int` reports
            `/core/collections::list of int`. Source-declared classes report their qualified
            class identity; a declared field or method named `type` remains that member
            rather than being silently replaced by reflection.

            A reference introduced “for efficiency” often makes the program harder to reason
            about while constraining the compiler. It changes lifetime and mutation
            semantics even if the current function merely reads. Start with a value, measure
            the real program, and preserve clear semantics when optimizing.

            This question catches many accidental reference designs:

            > If the callee changes the value tomorrow, should the caller observe that
            > change?

            If the answer is no, an ordinary value is probably the right contract.
      sections: []
    - id: give-errors-an-appropriate-owner
      title: Give errors an appropriate owner
      blocks:
        - type: markdown
          markdown: |-
            Errors are part of a function's behavior, but not every caller is the right
            place to handle them.

            A low-level parser can identify malformed input. It usually cannot decide
            whether an application should skip the record, ask the user to retry, log the
            event, or terminate. Let the error travel to the layer that owns that policy.

            Likewise, do not catch an error merely to print its message and throw it again
            unchanged. Such a catch adds indentation without adding a decision. Catch when
            the current layer can:

            - repair or substitute a value;
            - add useful domain context;
            - retry under a bounded policy;
            - convert a technical failure into an application outcome;
            - guarantee cleanup while preserving or deliberately replacing the error.

            Keep error types near the domain contract that defines the failure. A reporting
            package may own `invalid-report-entry`; an application package owns the choice
            to reject the whole report or continue with valid entries.

            Use `finally` for unconditional cleanup, not as a second catch block. Remember
            that a `return` or `throw` inside `finally` deliberately replaces the pending
            outcome. Powerful control flow deserves visible intent.

            Errors also interact with abstraction size. If one function validates, performs
            work, catches every possible failure, formats user output, and chooses process
            policy, it likely owns too many decisions. Smaller functions let errors travel
            through layers with recognizable responsibilities.
      sections: []
    - id: use-iteration-rather-than-managing-indexes
      title: Use iteration rather than managing indexes
      blocks:
        - type: markdown
          markdown: |-
            When the program means “for every value,” write that:
        - type: example
          id: legacy-fence-009
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            for item in items
              print; (item.render;)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            An index-controlled loop introduces extra state and extra failure possibilities:
        - type: example
          id: legacy-fence-010
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            index = 0
            while index < items.length
              print; items[index]
              index++
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The second form may be necessary when the index itself matters, when traversing
            several aligned collections, or when the algorithm changes position
            non-sequentially. It should not be the default spelling for ordinary iteration.

            Direct iteration gives the compiler a clearer semantic region. It can often
            reason about bounds, collection mutation, and lowering more effectively than
            when traversal is encoded through manually coordinated counters.

            Use `range` when the numbers are the values the algorithm needs:
        - type: example
          id: legacy-fence-011
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /core/collections import range

            for number in range; 1, 5
              print; number
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Use collection iteration when numbers would merely be machinery for reaching
            elements.

            The same principle applies to collection operations. Prefer a named operation
            such as `append`, `contains`, or `get; checked` over reproducing its internals
            with loops—unless the algorithm genuinely needs different semantics.

            Your own class can participate without extending a collection base class. Give
            it a non-throwing, non-async, zero-argument `iterator` method. That method
            returns either a built-in `iterator of Item` or an object whose zero-argument
            `next` method returns `iteration-step of Item`:
        - type: example
          id: legacy-fence-012
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /core/collections import iteration-step

            function next iteration-step of row;
              if this.finished
                return iteration-step.end;
              item row = this.read-next;
              return iteration-step; item
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The `end` alternative is distinct from `none`, so an iterator may yield `none`
            as an ordinary item. Once `next` returns `end`, retain that state and return
            `end` on later calls without reading the source again. Iterator objects are
            linear state machines: passing a named iterator to `for` transfers it, and the
            binding cannot be reused afterward. A `for` loop uses the authored `iterator`
            and `next` methods directly.
      sections: []
    - id: keep-concurrency-within-a-scope
      title: Keep concurrency within a scope
      blocks:
        - type: markdown
          markdown: |-
            Chapter 12's style rule is structural:
        - type: example
          id: legacy-fence-013
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            scope = task-scope;
            first = scope.spawn; first-work
            second = scope.spawn; second-work

            first-outcome = await scope.join; first
            second-outcome = await scope.join; second
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The scope owns the concurrent work. Every child has a handle. Every handle is
            consumed exactly once. `spawn` accepts an async callable, or a statically
            non-copyable task that transfers into the scope automatically. The latter is
            useful for a socket listener or stream whose ownership must enter the child
            rather than remain borrowed by its parent. Cancellation changes how work
            completes, not whether the program must account for it.

            Compiler-owned async socket and TLS operations suspend on readiness through the
            selected runtime. Operations that must use a blocking operating-system
            interface, such as the current standard-input and resolver paths, are delegated
            away from executor workers. One pending input or socket operation therefore does
            not stop unrelated tasks. Do not wrap these operations in another task merely to
            imitate non-blocking behavior; await their language-level task normally.

            Do not make ordinary functions asynchronous “in case we need concurrency later.”
            Async callable types and task ownership are real contracts. Introduce them when
            work may suspend or make independent progress.

            Do not encode executor timing assumptions into application logic. A threaded
            profile and a cooperative profile preserve the same task-scope semantics while
            scheduling differently. Correctness should follow from explicit ordering and
            outcomes, not from one observed interleaving.

            The style question is:

            > What longer-lived structure owns this work, and where are all outcomes
            > observed?

            If the source cannot answer that, it is not yet a structured concurrent design.
      sections: []
    - id: favor-readable-generated-behavior-over-clever-source-tricks
      title: Favor readable generated behavior over clever source tricks
      blocks:
        - type: markdown
          markdown: |-
            Chapter 13 made generated Rust inspectable, but Terrane source should still
            describe the domain rather than imitate a backend.

            Avoid obscure rewrites based on assumptions such as:

            - every class becomes a heap object;
            - every interface call becomes dynamic dispatch;
            - every assignment performs an eager copy;
            - every helper call survives release optimization;
            - every reference becomes a particular Rust pointer type.

            Those assumptions may be false for the current program and may change as
            compiler analysis improves.

            Prefer clear source:
        - type: example
          id: legacy-fence-014
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            for value in values
              total = total + value
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Then measure the release artifact. If it is slow, inspect the generated loop,
            runtime support, profile, and machine behavior. The fix may belong in the
            algorithm, but it may also be a reusable compiler or runtime improvement.

            Generated Rust should remain readable enough to make that investigation
            possible. “Readable” does not mean “looks exactly like handwritten Rust.”
            Support calls may be necessary to preserve exact arithmetic, throwing,
            copy-on-write, task outcomes, or source mapping. The relevant question is
            whether a reader can connect the generated operation to the Terrane contract it
            implements.

            Do not contort source to make one unoptimized generated file prettier. Preserve
            clear semantics, use canonical-Rust validation when investigating lowering, and
            treat surprising generated behavior as evidence to understand rather than a
            prompt for folklore.
      sections: []
    - id: refactoring-the-book-s-project-as-a-whole
      title: Refactoring the book's project as a whole
      blocks:
        - type: markdown
          markdown: |-
            Our task-list examples accumulated features as the book introduced them. That
            made each lesson visible, but a finished program deserves a fresh design pass.
            We should keep the contracts that serve the application and remove machinery
            that existed only to demonstrate itself.

            Suppose the current requirement is:

            > Track writing tasks of different concrete kinds, display them uniformly, and
            > total their estimates.

            That requirement earns an interface because the plan stores values through
            common behavior:
        - type: example
          id: legacy-fence-015
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            interface plan-item
              function render string;
              function estimate-units int;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            It earns a class because each task keeps related state and behavior:
        - type: example
          id: legacy-fence-016
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class chapter-task implements plan-item
              title string = ''
              estimate int = 0
              complete bool = false
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            It does not yet earn references. The plan can own independent task values. It
            does not earn asynchronous functions because totaling and displaying an
            in-memory list are sequential operations. It does not earn optional estimates
            because this version requires an estimate at construction.

            Here is the complete refactored program:
        - type: example
          id: legacy-fence-017
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            namespace book-plan

            from /core/collections import list

            interface plan-item
              function render string;
              function estimate-units int;

            class chapter-task implements plan-item
              title string = ''
              estimate int = 0
              complete bool = false

              function construct; title string, estimate int
                this.title = title
                this.estimate = estimate

              function mark-complete;
                this.complete = true

              function render string;
                if this.complete
                  return '[done] '.concat; this.title
                return '[todo] '.concat; this.title

              function estimate-units int;
                return this.estimate

            class writing-plan
              items list of plan-item = list

              function add; item plan-item
                this.items = this.items.append; item

              function total-estimate int;
                total = 0
                for item in this.items
                  total = total + (item.estimate-units;)
                return total

              function show;
                for item in this.items
                  print; (item.render;)
                print; 'Estimated units: ', (this.total-estimate;)

            function main;
              ownership = instance chapter-task; 'Values and movement', 5
              concurrency = instance chapter-task; 'Structured concurrency', 8
              ownership.mark-complete;

              plan = instance writing-plan;
              plan.add; ownership
              plan.add; concurrency
              plan.show;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            It prints:
        - type: example
          id: legacy-fence-018
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            [done] Values and movement
            [todo] Structured concurrency
            Estimated units: 13
          response: null
          diagnostic: null
          markdown: null
      sections:
        - id: refactoring-the-book-s-project-as-a-whole-review-the-ordinary-choices
          title: Review the ordinary choices
          blocks:
            - type: markdown
              markdown: |-
                The local variables `ownership`, `concurrency`, `plan`, and `total` use
                inference. Their initializers make the contracts clear.

                Fields, parameters, interface methods, and public method results carry written
                types. Those are boundaries other code must understand.

                The plan receives and stores ordinary `plan-item` values. Calling
                `ownership.mark-complete;` before `plan.add; ownership` makes the intended
                snapshot explicit. Later mutation of the local `ownership` binding would not
                quietly alter the stored item.

                `total-estimate` iterates directly over items. It has no manually maintained
                index and no unchecked lookup.

                `show` handles presentation; `total-estimate` handles calculation. Neither
                function catches errors it cannot resolve.

                The program is synchronous because all current work is in memory and sequential.
                If a later version obtains estimates from independent remote services, a task
                scope can be introduced around that real concurrent boundary rather than
                threaded through every method in advance.
          sections: []
        - id: refactoring-the-book-s-project-as-a-whole-review-what-we-removed
          title: Review what we removed
          blocks:
            - type: markdown
              markdown: |-
                A demonstration trait is absent because this version has no reused
                implementation shared across otherwise unrelated classes. Adding one would make
                the object model larger without reducing meaningful duplication.

                A priority union and checked coercion are absent because the current requirement
                does not contain optional or externally supplied priority data. Those features
                remain available when the domain earns them.

                References are absent because the plan does not need shared mutable identity.
                Ordinary values make snapshots and tests easier to reason about.

                Custom throwable classes are absent because the current constructor accepts
                already validated in-memory values. A real input layer should add validation and
                let its domain error travel to the application policy layer.

                This is not a retreat from advanced features. It is evidence that we understand
                what each feature means well enough not to use it decoratively.
          sections: []
    - id: a-practical-review-checklist
      title: A practical review checklist
      blocks:
        - type: markdown
          markdown: |-
            When revising a Terrane program, ask:
      sections:
        - id: a-practical-review-checklist-values-and-types
          title: Values and types
          blocks:
            - type: markdown
              markdown: |-
                - Are local types obvious enough to infer?
                - Do written annotations describe stable contracts?
                - Are optional and union arms genuine domain states?
                - Is `int` preferable to an incidental machine width?
          sections: []
        - id: a-practical-review-checklist-ownership
          title: Ownership
          blocks:
            - type: markdown
              markdown: |-
                - Should assignment create independent logical values?
                - Does each `ref` represent intentional shared identity?
                - Does each `shared ref` genuinely need to extend lifetime?
                - Is every move followed by source code that treats the old binding as
                  unavailable?
          sections: []
        - id: a-practical-review-checklist-structure
          title: Structure
          blocks:
            - type: markdown
              markdown: |-
                - Does each class keep related state and behavior?
                - Does each interface have more than hypothetical value?
                - Does each trait remove meaningful implementation duplication without creating
                  conflict?
                - Can a function be split along calculation, policy, and presentation
                  boundaries?
          sections: []
        - id: a-practical-review-checklist-control-and-errors
          title: Control and errors
          blocks:
            - type: markdown
              markdown: |-
                - Does branch order express the intended precedence?
                - Can direct iteration replace index management?
                - Is each error caught where useful recovery becomes possible?
                - Does `finally` preserve or deliberately replace the pending outcome?
          sections: []
        - id: a-practical-review-checklist-concurrency
          title: Concurrency
          blocks:
            - type: markdown
              markdown: |-
                - Is asynchronous work actually independent or suspendable?
                - What scope owns every child?
                - Is every child joined exactly once?
                - Does correctness avoid relying on observed scheduling order?
          sections: []
        - id: a-practical-review-checklist-native-behavior
          title: Native behavior
          blocks:
            - type: markdown
              markdown: |-
                - Has performance been measured in a release build?
                - Can a suspicious source operation be found in generated Rust?
                - Is a workaround compensating for a compiler defect that should instead be
                  fixed centrally?
                - Does the source remain readable without assuming one backend representation?
          sections: []
    - id: exercises
      title: Exercises
      blocks:
        - type: markdown
          markdown: |-
            1. Remove every inferable local annotation from a small program, then restore
               only the ones that communicate a real boundary. Explain each restored
               annotation.
            2. Find a function that manually indexes through a list and rewrite it with
               direct iteration. Keep the index version only if the index is part of the
               result.
            3. Take a class used in only one simple place and rewrite it as ordinary values
               and functions. Decide which form makes the domain clearer.
            4. Review every `ref`, `shared ref`, and `move` in a program. For each, write
               one sentence describing its ownership consequence.
            5. Move a catch block outward to the first layer that can choose a useful
               recovery policy. Confirm that lower layers retain precise throwable
               contracts.
            6. Take two immediately awaited asynchronous calls. If they are independent,
               spawn both in one task scope before joining. If they are not, restore the
               sequential version and explain why.
            7. Emit release-oriented generated Rust for one clear loop. Record observed
               operations before attempting any source rewrite.
            8. Extend the writing-plan project with a second `plan-item` class whose
               behavior genuinely differs. Confirm that the existing interface earns its
               place without changing `writing-plan`.
            9. Add input validation to the project. Keep the error type near the invalid
               domain contract and catch it only where the application can decide what to
               show the user.
      sections: []
    - id: chapter-summary
      title: Chapter summary
      blocks:
        - type: markdown
          markdown: |-
            - Prefer the ordinary operation that directly matches the program's intent.
            - Let inference remove obvious local type repetition.
            - Write types where they state real boundaries, invariants, or domain
              alternatives.
            - Pass ordinary values unless shared identity or ownership transfer is part of
              the model.
            - Catch errors at the layer that can make a useful policy decision.
            - Use direct iteration unless positions themselves matter.
            - Put independent asynchronous work inside a scope and consume every child.
            - Keep source readable rather than optimizing for a guessed Rust representation.
            - Inspect generated Rust and measure release artifacts when behavior or cost is
              surprising.
            - Remove educational or speculative machinery when refactoring a finished
              design.

            The first fourteen chapters have introduced the language one capability at a
            time. Chapter 15 will now build a larger application as a vertical slice:
            behavior first, package structure when it earns its place, then errors, objects,
            ownership, concurrency, tests, and generated-Rust inspection around one coherent
            result.
