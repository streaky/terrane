documentation:
  status: complete
  title: Building a Complete Program
  title-style: text
  summary: |-
    Individual language features become useful when they cooperate in a program with a purpose. We have already written
    complete source files, but most were arranged to demonstrate one idea at a time. This chapter starts somewhere
    different: with a person who needs an answer.
  tags: []
  blocks:
    - type: markdown
      markdown: |-
        We will turn that need into a small in-memory reporting tool. The program will
        receive named work entries, reject entries that do not satisfy its rules,
        calculate a summary, and present the result. Strings, maps, loops, conditions,
        and functions will all retain the meanings established in earlier chapters. The
        new skill is deciding where each meaning belongs.

        The program deliberately stays in one source file. Chapter 8 will split it into
        namespaces and imports. For now, keeping the whole design visible makes its
        shape easier to examine.
  sections:
    - id: starting-from-a-user-story
      title: Starting from a user story
      blocks:
        - type: markdown
          markdown: |-
            Suppose a team lead asks for this:

            > Given a week's named work entries, show every valid entry, the accepted and
            > rejected counts, the total and average work units, and whether the team met
            > its target.

            That sentence is more useful than a list of desired functions because it names
            the program's observable behavior. It also leaves questions we must settle.

            - What makes an entry valid?
            - May two entries have the same name?
            - Is an average rounded, fractional, or exact?
            - What happens when no entry is accepted?
            - Is meeting the target different from exceeding it?
            - In what order should entries appear?

            For this first version, we will make explicit decisions:

            - an entry name must not be empty;
            - work units must be greater than zero;
            - a map holds one current value for each name;
            - insertion order is reporting order;
            - the average uses Terrane's integer division because units are whole numbers;
            - an empty accepted set reports no average;
            - meeting or exceeding the target has one label: `target met`.

            These are domain choices, not facts imposed by the language. A different
            reporting tool might retain duplicate entries in a list, calculate a
            floating-point average, or distinguish exact completion from over-delivery.
            Writing the choices down prevents an implementation accident from quietly
            becoming the contract.

            A user story should normally become a few examples before it becomes a large
            body of code. For our data:
        - type: example
          id: legacy-fence-001
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            design: 6
            implementation: 9
            review: 5
            cleanup: -2
            <empty name>: 3
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            we expect three accepted entries, two rejected entries, a total of 20, an
            integer average of 6, and a met target of 18.

            That expectation is already a useful test. We can compare every later
            refactoring with it.
      sections: []
    - id: dividing-the-program-into-functions
      title: Dividing the program into functions
      blocks:
        - type: markdown
          markdown: |-
            A complete program is easier to reason about when each function answers one
            question. Begin with the smallest domain decision:
        - type: example
          id: legacy-fence-002
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function valid-entry bool; name string, units int
              return name != '' and units > 0
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The function does not print a warning, edit a collection, or decide whether the
            whole report succeeds. It answers exactly one question about one proposed entry.

            Two aggregation functions can use that decision:
        - type: example
          id: legacy-fence-003
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function accepted-count int; entries map of string, int
              count = 0
              for name, units in entries
                if valid-entry; name, units
                  count++
              return count

            function accepted-total int; entries map of string, int
              total = 0
              for name, units in entries
                if valid-entry; name, units
                  total = total + units
              return total
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            There is some visible similarity between these loops. That does not
            automatically make it harmful duplication. One loop counts; the other sums. Each
            remains short, direct, and independently testable. Combining them prematurely
            would require a compound result or mutation shared through another abstraction
            before the program needs either.

            A third function owns the target decision:
        - type: example
          id: legacy-fence-004
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function progress-label string; total int, target int
              if total >= target
                return 'target met'
              return 'target not met'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The functions now form a small vocabulary:

            - `valid-entry` decides whether one entry belongs in the report;
            - `accepted-count` counts accepted entries;
            - `accepted-total` sums their units;
            - `progress-label` classifies the total against a target.

            `main` will supply concrete data and ask a reporting function to orchestrate
            them. It should not need to know how every calculation is performed.
      sections: []
    - id: modeling-the-program-s-data
      title: Modeling the program's data
      blocks:
        - type: markdown
          markdown: |-
            Our input associates each entry name with one integer number of work units. A
            map states that relationship directly:
        - type: example
          id: legacy-fence-005
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            entries map of string, int = map; design = 6, implementation = 9, review = 5
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The key type is `string`; the value type is `int`. Because maps preserve
            insertion order, the order in which these entries were constructed is also the
            order in which the report will present them.

            This model makes duplicate names an update rather than a second record. That is
            appropriate only because our user story says each name identifies one current
            category. If every submitted event mattered independently, a list of records
            would be the honest model instead. Chapter 9 will give us classes for records
            that combine differently typed fields.

            We can add values after construction:
        - type: example
          id: legacy-fence-006
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            entries.set; 'cleanup', -2
            entries.set; '', 3
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Those values are deliberately malformed according to our policy, but they are
            still valid values for the map's declared types. A type answers whether a value
            has the right structural kind. Domain validation answers whether that
            structurally valid value makes sense for this program.

            That distinction is important. `-2` is a perfectly valid `int`; it is not a
            valid number of completed work units. The compiler should not pretend every
            business rule is a primitive type rule.

            The map is in memory and local to this run. There is no file format, database,
            or network boundary yet. That keeps the chapter focused on program structure.
            Later facilities can replace the source of `entries` without changing the
            functions that consume a `map of string, int`.
      sections: []
    - id: validating-values
      title: Validating values
      blocks:
        - type: markdown
          markdown: |-
            Validation belongs near the decision it expresses:
        - type: example
          id: legacy-fence-007
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            name != '' and units > 0
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Using one shared predicate prevents the count and total from adopting slightly
            different definitions of valid data. Consider the defect in this version:
        - type: example
          id: legacy-fence-008
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function accepted-count int; entries map of string, int
              count = 0
              for name, units in entries
                if name != '' and units >= 0
                  count++
              return count
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Now zero-unit entries contribute to the count but not necessarily to the
            intended notion of completed work. The report could display a total and average
            calculated over different populations. A named predicate makes that disagreement
            less likely and gives us one place to test the rule.

            Validation is not always exceptional. In this chapter, invalid entries are
            ordinary input data. The report skips them and tells the user how many were
            rejected. That policy lets one malformed row coexist with useful rows.
        - type: example
          id: legacy-fence-009
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            rejected = entries.length - (accepted-count; entries)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Another application might require the entire batch to be correct. A payroll
            import, for example, should not silently omit a malformed payment. Chapter 7
            will change the reporting tool to that stricter policy and represent failure as
            part of its control flow.

            Validation should also occur before a dangerous operation. The average has a
            denominator only when at least one entry was accepted:
        - type: example
          id: legacy-fence-010
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            if count > 0
              print; 'Average units: ', total / count
            else
              print; 'Average units: none'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This branch is not merely suppressing a division error. It expresses the domain
            truth that an average of no entries is absent. The display uses the word `none`;
            a later version could return an `int|none` from an `average` function if another
            part of the program needed to consume that result.
      sections: []
    - id: reporting-useful-output
      title: Reporting useful output
      blocks:
        - type: markdown
          markdown: |-
            Useful output answers the user's questions in a stable order. Begin with a small
            presentation function:
        - type: example
          id: legacy-fence-011
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function print-entry; name string, units int
              print; '- ', name, ': ', units
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Then let `print-report` arrange the sections:
        - type: example
          id: legacy-fence-012
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function print-report; title string, target int, entries map of string, int
              total = accepted-total; entries
              count = accepted-count; entries
              rejected = entries.length - count

              print; title
              print; 'Accepted work:'
              for name, units in entries
                if name != '' and units > 0
                  print-entry; name, units

              print; 'Entries accepted: ', count
              print; 'Entries rejected: ', rejected
              print; 'Total units: ', total
              if count > 0
                print; 'Average units: ', total / count
              else
                print; 'Average units: none'
              print; 'Progress: ', (progress-label; total, target)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The title comes first, followed by detail rows and then the summary. A reader
            can scan the total without losing the evidence from which it came.

            Canonical scalar display is sufficient here: names are strings and quantities
            are integers. A financial report would need an explicit formatting policy for
            currency, decimal precision, and locale rather than asking `print` to guess.

            Stable output is more than decoration. It can be reviewed, compared in a test,
            redirected to a file, or consumed by a person following an incident.
            Deterministic map iteration means the report need not sort defensively merely to
            produce the same order on every run.
      sections: []
    - id: keeping-decisions-separate-from-presentation
      title: Keeping decisions separate from presentation
      blocks:
        - type: markdown
          markdown: |-
            Two functions in the program return decisions:
        - type: example
          id: legacy-fence-013
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            valid-entry; name, units
            progress-label; total, target
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Neither prints. That separation gives the caller choices. A terminal program may
            print the result; a later web handler may place it in a response; a test may
            compare it directly.

            Conversely, `print-entry` and `print-report` own presentation. They decide
            punctuation, labels, line order, and headings. They do not invent a second
            validation policy.

            A less useful design mixes the two:
        - type: example
          id: legacy-fence-014
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function check-entry; name string, units int
              if name == '' or units <= 0
                print; 'invalid'
              else
                print; name, ': ', units
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            That function can neither answer a caller asking for a boolean nor render a
            report in another format without repeating the rule. It also makes counting
            invalid values awkward because the decision disappears into output.

            Separation does not mean constructing a framework. Four short calculation
            functions and two presentation functions are enough. The goal is to keep
            independent reasons for change apart:

            - a policy change affects decision functions;
            - a new calculation affects aggregation;
            - a wording change affects presentation;
            - a new input source affects orchestration.

            When one function has only one of those reasons to change, the program can grow
            without every modification disturbing every layer.
      sections: []
    - id: checking-and-testing-behavior
      title: Checking and testing behavior
      blocks:
        - type: markdown
          markdown: |-
            A compiler check answers whether the source is accepted:
        - type: example
          id: legacy-fence-015
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane check work-report.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Running the program checks more:
        - type: example
          id: legacy-fence-016
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane run work-report.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            For our example data, the observable result should be:
        - type: example
          id: legacy-fence-017
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            Weekly work report
            Accepted work:
            - design: 6
            - implementation: 9
            - review: 5
            Entries accepted: 3
            Entries rejected: 2
            Total units: 20
            Average units: 6
            Progress: target met
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            One successful example is not the whole behavioral boundary. Before changing the
            design, list cases that could expose a defect:
        - type: table
          id: null
          title: null
          show-header: true
          columns:
            - id: case
              title: Case
              cell: markdown
            - id: expected-behavior
              title: Expected behavior
              cell: markdown
          rows:
            - case: all entries valid
              expected-behavior: every entry is shown
            - case: empty name
              expected-behavior: entry is rejected
            - case: zero units
              expected-behavior: entry is rejected
            - case: negative units
              expected-behavior: entry is rejected
            - case: no accepted entries
              expected-behavior: no division is attempted
            - case: total below target
              expected-behavior: "`target not met`"
            - case: total exactly at target
              expected-behavior: "`target met`"
            - case: total above target
              expected-behavior: "`target met`"
        - type: markdown
          markdown: |-
            We can exercise pure decisions directly with a tiny check function:
        - type: example
          id: legacy-fence-018
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function check; description string, actual bool, expected bool
              if actual == expected
                print; 'pass: ', description
              else
                print; 'FAIL: ', description

            function run-checks;
              check; 'ordinary entry', (valid-entry; 'design', 6), true
              check; 'empty name', (valid-entry; '', 6), false
              check; 'zero units', (valid-entry; 'design', 0), false
              check; 'target equality', (progress-label; 18, 18) == 'target met', true
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This is not a substitute for a later testing facility, but it demonstrates the
            essential habit: state an expected observable result, run the decision, and make
            disagreement visible. The functions were kept free of printing precisely so
            these checks remain straightforward.

            Tests should defend boundaries where plausible mistakes live. A test that merely
            repeats `6 + 9 + 5 == 20` tells us little about our program. Tests around empty
            names, nonpositive units, empty reports, and target equality protect decisions
            we actually made.
      sections: []
    - id: growing-the-program-without-losing-its-shape
      title: Growing the program without losing its shape
      blocks:
        - type: markdown
          markdown: |-
            The in-memory tool is intentionally small, but its boundaries suggest natural
            extensions.

            To read entries from a file, change the orchestration that constructs `entries`;
            keep validation and summary functions. To produce JSON, add another presentation
            path; keep the decisions. To support duplicate events, replace the map model
            with a list of records and adjust aggregations deliberately. To add a second
            target, extend the progress decision rather than scattering comparisons through
            output code.

            Growth becomes dangerous when a new requirement is squeezed into the nearest
            line instead of the function whose responsibility it changes. Suppose the team
            now wants names normalized to lowercase. We should decide whether normalization
            changes identity before map construction or merely changes presentation.
            Applying `.lower;` wherever a name happens to be printed would leave lookup and
            duplicate behavior unchanged while making distinct stored names look identical.

            Likewise, persistence is not merely “write these lines to a file.” It introduces
            failure, resource lifetime, encoding, and perhaps a data format. Those concerns
            deserve visible boundaries rather than being hidden inside `print-report`.

            A useful maintenance question is:

            > Can I name the one program decision this change modifies?

            If the answer is yes, the source should usually reveal where that decision
            lives. If the answer is “almost every function,” the program may have lost its
            shape.
      sections: []
    - id: project-a-small-in-memory-reporting-tool
      title: "Project: a small in-memory reporting tool"
      blocks:
        - type: markdown
          markdown: |-
            Create `work-report.trn`:
        - type: example
          id: legacy-fence-019
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            namespace work-report

            from /core/collections import map

            function valid-entry bool; name string, units int
              return name != '' and units > 0

            function accepted-count int; entries map of string, int
              count = 0
              for name, units in entries
                if valid-entry; name, units
                  count++
              return count

            function accepted-total int; entries map of string, int
              total = 0
              for name, units in entries
                if valid-entry; name, units
                  total = total + units
              return total

            function progress-label string; total int, target int
              if total >= target
                return 'target met'
              return 'target not met'

            function print-entry; name string, units int
              print; '- ', name, ': ', units

            function print-report; title string, target int, entries map of string, int
              total = accepted-total; entries
              count = accepted-count; entries
              rejected = entries.length - count

              print; title
              print; 'Accepted work:'
              for name, units in entries
                if name != '' and units > 0
                  print-entry; name, units

              print; 'Entries accepted: ', count
              print; 'Entries rejected: ', rejected
              print; 'Total units: ', total
              if count > 0
                print; 'Average units: ', total / count
              else
                print; 'Average units: none'
              print; 'Progress: ', (progress-label; total, target)

            function main;
              entries map of string, int = map; design = 6, implementation = 9, review = 5, cleanup = -2
              entries.set; '', 3
              print-report; 'Weekly work report', 18, entries
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Run it:
        - type: example
          id: legacy-fence-020
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane run work-report.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The output matches the example above. Trace the complete flow:

            1. `main` constructs an insertion-ordered map.
            2. `print-report` asks the calculation functions for accepted totals.
            3. Every calculation applies the same validation rule.
            4. Presentation walks the original map in stable order but displays only
               accepted entries.
            5. The summary reports rejected input rather than hiding it.
            6. The average guard prevents an absent population from becoming arithmetic.
            7. `progress-label` makes the target policy reusable independently of output.

            The complete program is still ordinary Terrane. It has not acquired classes,
            packages, exceptions, or a framework merely because it has more than one
            concern. Its structure comes from well-named values and functions.
      sections: []
    - id: terrane-style-let-the-program-read-like-its-decisions
      title: "Terrane style: let the program read like its decisions"
      blocks:
        - type: markdown
          markdown: |-
            The most informative lines in the program are not its mechanics. They are its
            decisions:
        - type: example
          id: legacy-fence-021
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            return name != '' and units > 0
          response: null
          diagnostic: null
          markdown: null

        - type: example
          id: legacy-fence-022
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            if count > 0
          response: null
          diagnostic: null
          markdown: null

        - type: example
          id: legacy-fence-023
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            if total >= target
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A reader can inspect those lines and understand the validation, average, and
            progress policies. The loops then perform direct, unsurprising work over those
            policies.

            Prefer this arrangement to clever compression. A single expression could
            calculate and print more of the report, but it would make the domain boundaries
            harder to name and test. Likewise, avoid creating generic “processor,”
            “manager,” or “helper” layers that do not correspond to a question in the user
            story.

            A complete program does not need to be architecturally grand. It needs to make
            its important choices visible, keep unrelated choices from tangling, and produce
            evidence that it behaves as promised.
      sections: []
    - id: exercises
      title: Exercises
      blocks:
        - type: markdown
          markdown: |-
            1. Change the target to 21. Predict the progress label before running the
               program.

            2. Add zero-unit and negative-unit entries. Confirm that both affect the
               rejected count but neither affects the total or average.

            3. Add a `highest-units int; entries map of string, int` function. Define what
               it returns when no entry is accepted before writing its body.

            4. Change the validation rule so names containing only spaces are invalid.
               Decide whether `.trim;` belongs in validation, normalization before
               insertion, or presentation, and explain the effect of your choice.

            5. Add a `minimum-entry` parameter to `print-report` and show only accepted
               entries at or above it. Decide whether the accepted count should follow
               validation alone or the display filter.

            6. Write checks for an empty map, a total exactly equal to the target, and a
               report containing only invalid entries.

            7. Change the model so two submissions for the same category can both remain
               visible. Choose a collection that tells the truth about that requirement; do
               not simulate duplicates with invented map keys.
      sections: []
    - id: what-we-learned
      title: What we learned
      blocks:
        - type: markdown
          markdown: |-
            A complete program begins with observable needs and explicit domain decisions. A
            user story identifies what the program must answer; examples turn those answers
            into behavior that can be checked.

            Functions divide the work by responsibility. Validation determines whether data
            belongs, aggregation calculates summaries, presentation decides what a person
            sees, and orchestration supplies data and connects the stages. Separating
            decisions from output makes both reuse and testing easier without requiring an
            elaborate architecture.

            Types describe structural boundaries, while validation expresses domain policy.
            A `map of string, int` can contain an integer that is invalid as a work-unit
            count. Invalid input may be ordinary data to report or an exceptional condition
            that stops an operation; the application must choose honestly.

            Stable map order, direct loops, guarded arithmetic, and explicit expected output
            make the reporting tool inspectable. As requirements grow, preserving named
            decision boundaries lets the program gain capabilities without losing the shape
            that made its first version understandable.

            In the next chapter, we will adopt a stricter reporting policy. Instead of
            skipping malformed entries, the program will throw a typed error, let that
            failure travel through calculation code, handle it at the layer that can
            respond, and guarantee cleanup with `finally`.
      sections: []
  see-also: []
