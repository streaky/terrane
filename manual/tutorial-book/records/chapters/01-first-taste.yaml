    - id: where-terrane-fits-between-scripting-and-systems-programming
      title: Where Terrane fits between scripting and systems programming
      blocks:
        - type: markdown
          markdown: |-
            The source we have written has the lightness often associated with a scripting
            language:
        - type: example
          id: legacy-fence-038
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            travellers = 3
            total-bottles = travellers * 2 + 1
            print; total-bottles
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            There are no mandatory type annotations on obvious local values, no manual
            allocation, and no build configuration in the source file. `terrane run`
            provides a direct edit-and-run experience.

            Underneath, Terrane takes a native build path. It checks the source, emits
            deterministic Rust, and uses Cargo and rustc to produce an executable. The
            generated Rust is not intended to be a secret implementation artifact. It is a
            receipt that can later be inspected for debugging, profiling, integration, or
            learning.

            This combination does not mean that Terrane is a scripting language translated
            mechanically into Rust syntax. Terrane has its own source semantics. Its
            compiler may choose whichever Rust representation preserves those semantics, and
            one Terrane idea need not correspond to one Rust object or statement.

            It also does not mean that every programmer must become a systems programmer.
            The layers are available progressively:

            1. write ordinary Terrane and run it;
            2. add contracts when the application needs them;
            3. inspect generated Rust when it answers a useful question;
            4. cross into native facilities when the problem requires it.

            You may spend an entire project at the first two layers. The lower layers are an
            escape route and an investigation path, not homework imposed on every source
            file.
      sections:
        - id: where-terrane-fits-between-scripting-and-systems-programming-development-convenience-without-an-execution-time-compiler
          title: Development convenience without an execution-time compiler
          blocks:
            - type: markdown
              markdown: |-
                `terrane run` can feel like running a script, but compilation happens before
                execution. A deployed executable does not need to parse the Terrane source each
                time it starts.

                That distinction has practical consequences:

                - many mistakes are rejected before the program runs;
                - native compilation time is paid when the program changes;
                - unchanged generated work can be cached;
                - deployment can use an ordinary native executable;
                - the Rust and native layers remain available to standard tooling.

                None of this guarantees that every Terrane program is automatically fast or
                small. Performance still depends on the program, the libraries it uses, the
                selected build profile, and the compiler's current lowering quality. What
                Terrane provides is a visible native route rather than a promise that source
                convenience erases engineering tradeoffs.
          sections: []
    - id: exercises
      title: Exercises
      blocks:
        - type: markdown
          markdown: |-
            1. Change the greeting so that it prints your name or the name of a project.
               Check the file before running it.

            2. Add a second `print` call to `hello.trn`. Predict exactly where the newline
               appears, then run the program.

            3. In `packing-list.trn`, change the number of travellers, bottles per
               traveller, and spares. Calculate the result yourself before running the
               source.

            4. Misspell `total-bottles` at its use in `print`. Read the resulting file
               position, diagnostic code, and message. Correct only that mistake and check
               again.

            5. Replace one integer in the packing calculation with quoted text. Read the
               compiler's response before restoring the integer. You do not need to
               understand every type term yet; identify which expression the compiler could
               not accept.

            6. Run `terrane check packing-list.trn` and confirm that it produces no program
               output. Then run `terrane run packing-list.trn` and compare the two commands'
               roles.
      sections: []
    - id: what-we-learned
      title: What we learned
      blocks:
        - type: markdown
          markdown: |-
            A complete Terrane program can be small. It declares a namespace, defines
            `main`, and performs work in an indented function body. Calls use an explicit
            semicolon, and `print` is available to ordinary programs without an import.

            The command-line development loop is equally small:
        - type: example
          id: legacy-fence-039
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            edit → terrane check → terrane run → observe
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `check` validates the Terrane program and its generated Rust without executing
            `main`. `run` follows the same pipeline through native compilation and then
            starts the resulting executable. When source is invalid, diagnostics identify a
            location, severity, stable code, and explanation rather than silently changing
            the program.

            Terrane aims to preserve the approachable top of that workflow as applications
            grow, while leaving a visible path into types, ownership, generated Rust, and
            native integration. You can begin with ordinary values and inferred contracts;
            deeper machinery appears when it earns its place.

            In the next chapter, we will slow down and examine the vocabulary already hiding
            inside these first programs: numbers, truth values, text, names, assignment,
            arithmetic, member access, and the explicit call marker.
      sections: []
