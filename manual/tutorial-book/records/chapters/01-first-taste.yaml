              markdown: |-
                Terrane permits both, but descriptive names usually repay their extra
                characters. Kebab-case names such as `total-bottles` are the language and
                standard-library convention.

                Names should still be proportional to their scope. A two-line mathematical
                formula may be clearest with `x` and `y`; a value used throughout a packing
                program deserves a name that survives distance.
