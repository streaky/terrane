    - id: project-split-the-reporting-tool-across-files
      title: "Project: split the reporting tool across files"
      blocks:
        - type: markdown
          markdown: |-
            Create the directory tree shown at the start of the chapter.
      sections:
        - id: project-split-the-reporting-tool-across-files-package-toml
          title: "`package.toml`"
          blocks:
            - type: example
              id: legacy-fence-036
              title: null
              language: toml
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                package = "work-report.tutorial"
                prelude = true

                [namespaces]
                "work-report/app" = "app"
                "work-report/errors" = "errors"
                "work-report/reporting" = "reporting"
              response: null
              diagnostic: null
              markdown: null
          sections: []
        - id: project-split-the-reporting-tool-across-files-errors-invalid-report-entry-trn
          title: "`errors/invalid-report-entry.trn`"
          blocks:
            - type: example
              id: legacy-fence-037
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                namespace work-report/errors

                from /core/errors import throwable

                class invalid-report-entry implements throwable
                  message string = ''
                  entry-name string = ''
                  units int = 0

                  function construct; entry-name string, units int
                    if entry-name == ''
                      this.message = 'entry name must not be empty'
                    else
                      this.message = 'work units must be greater than zero'
                    this.entry-name = entry-name
                    this.units = units

                  function render string;
                    return 'invalid report entry: '.concat; this.message
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The namespace exports the error class. It imports only the `throwable` contract
                needed to define that class.
          sections: []
        - id: project-split-the-reporting-tool-across-files-reporting-report-trn
          title: "`reporting/report.trn`"
          blocks:
            - type: example
              id: legacy-fence-038
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                namespace work-report/reporting

                from /core/collections import map
                from /work-report/errors import invalid-report-entry

                private function require-entry throws invalid-report-entry; entry-name string, units int
                  if entry-name == '' or units <= 0
                    throw instance invalid-report-entry; entry-name, units

                private function strict-total int throws invalid-report-entry; entries map of string, int
                  total = 0
                  for entry-name, units in entries
                    require-entry; entry-name, units
                    total = total + units
                  return total

                function progress-label string; total int, target int
                  if total >= target
                    return 'target met'
                  return 'target not met'

                function print-report; title string, target int, entries map of string, int
                  total = strict-total; entries
                  print; title
                  for entry-name, units in entries
                    print; '- ', entry-name, ': ', units
                  print; 'Total units: ', total
                  print; 'Progress: ', (progress-label; total, target)
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Only `progress-label` and `print-report` are public. The validation and
                aggregation helpers remain implementation details of the reporting namespace.
          sections: []
        - id: project-split-the-reporting-tool-across-files-app-main-trn
          title: "`app/main.trn`"
          blocks:
            - type: example
              id: legacy-fence-039
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                namespace work-report/app

                from /core/collections import map
                from /work-report/errors import invalid-report-entry
                from /work-report/reporting import print-report as show-report

                function main;
                  unchecked map of string, int = map; design = 6, implementation = 9, cleanup = -2
                  try
                    show-report; 'Unchecked report', 18, unchecked
                  catch invalid-report-entry
                    print; 'Report rejected: correct the input and try again'
                  finally
                    print; 'Unchecked report attempt finished'

                  corrected map of string, int = map; design = 6, implementation = 9, review = 5
                  show-report; 'Corrected report', 18, corrected
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The application imports the throwable type because its catch clause names that
                contract. It aliases `print-report` to the locally natural imperative
                `show-report`. The alias is optional; it demonstrates that local spelling and
                semantic identity are distinct.

                Run the package:
            - type: example
              id: legacy-fence-040
              title: null
              language: console
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                terrane run .
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                It produces the same behavior as Chapter 7:
            - type: example
              id: legacy-fence-041
              title: null
              language: text
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                Report rejected: correct the input and try again
                Unchecked report attempt finished
                Corrected report
                - design: 6
                - implementation: 9
                - review: 5
                Total units: 20
                Progress: target met
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The output is unchanged because organization is not behavior. What has improved
                is the visible dependency graph:
            - type: example
              id: legacy-fence-042
              title: null
              language: text
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                work-report/app
                ├── work-report/errors
                └── work-report/reporting
                    └── work-report/errors
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The application chooses recovery. Reporting owns validation and presentation.
                The error namespace owns the failure contract. Private helpers prevent the
                application from reaching through that design and coupling itself to
                `strict-total`.
          sections: []
    - id: terrane-style-let-namespace-boundaries-follow-responsibility
      title: "Terrane style: let namespace boundaries follow responsibility"
      blocks:
        - type: markdown
          markdown: |-
            A namespace should name a coherent part of the program, not become a
            miscellaneous drawer. `work-report/reporting` makes a meaningful promise. Names
            such as `work-report/helpers`, `work-report/common`, or `work-report/misc`
            postpone the design question rather than answer it.

            Prefer selective imports when they make dependencies legible. Use aliases to
            resolve a genuine collision or make a foreign name fit the local sentence—not to
            give every imported object a second decorative spelling.

            Keep manifests explicit and source trees unsurprising. A reader should be able
            to move from namespace path to mapped directory without searching the entire
            repository. The compiler enforces that correspondence because project
            organization is part of reproducible program identity.

            Most importantly, do not let file boundaries invent abstractions the program
            does not possess. We split the reporting tool along responsibilities already
            present in its one-file design. The package structure reveals those contracts;
            it does not manufacture them.
      sections: []
    - id: exercises
      title: Exercises
      blocks:
        - type: markdown
          markdown: |-
            1. Import `progress-label` into `app/main.trn` and call it directly. Then decide
               whether the application genuinely needs that public surface or whether
               reporting should keep the decision internal.

            2. Attempt to import `strict-total` from `work-report/reporting`. Read the
               visibility diagnostic, then restore the private boundary rather than making
               the helper public merely to silence it.

            3. Replace the `show-report` alias with the original `print-report` spelling.
               Confirm that behavior and imported identity do not change.

            4. Add `reporting/format/summary.trn`. Declare the namespace implied by its
               location and export one formatting function. Deliberately give it the wrong
               namespace first and inspect the package diagnostic.

            5. Replace the three mappings with one mapping from `work-report` to a
               reorganized root directory. Preserve the namespace-to-directory
               correspondence beneath that root and rerun the package.

            6. Disable the prelude. Add only the explicit imports required to make the
               package compile, and note which familiar constructs are descriptors rather
               than ordinary imported values.

            7. Run `terrane rust package.toml` and locate the generated units corresponding
               to the three source namespaces. Observe the mapping without editing generated
               output.
      sections: []
    - id: what-we-learned
      title: What we learned
      blocks:
        - type: markdown
          markdown: |-
            Namespaces give declarations stable, exact, slash-separated identities. Imports
            bind public objects into a lexical scope, selective aliases change local
            spelling without changing identity, and namespace-wide imports deliberately
            expose a broader public vocabulary.

            A package manifest bounds source discovery and maps namespace roots to relative
            directory roots. The compiler verifies that source declarations match their
            locations, discovers mapped `.trn` files deterministically, and rejects
            undeclared or ambiguous structure. Direct source files remain implicit
            single-file packages using the same pipeline.

            Visibility controls source-level access. Public declarations form the importable
            boundary; private helpers let a namespace change its implementation without
            inviting callers to depend on it. Dependency versions, features, capabilities,
            targets, and locks remain explicit build inputs rather than hidden runtime
            accidents.

            The reporting tool now spans three files without changing behavior. Its
            application, domain error, and reporting responsibilities have become visible at
            package scale. In the next chapter, we will move from package organization to
            stateful domain modeling and distinguish classes, interfaces, traits, and
            protocols by the job each one performs.
      sections: []
