format: 1
id: book.namespaces-imports-and-packages
kind: chapter
surface: null
lifecycle:
  status: current
  stability: experimental
  since: "0.1"
  deprecated-since: null
  removed-in: null
  replacement: null
documentation:
  status: complete
  title: Namespaces, Imports, and Packages
  title-style: text
  summary: |-
    The strict reporting tool now has several distinct responsibilities: an application chooses input and recovery policy,
    reporting code validates and presents a batch, and an error type describes invalid entries. Keeping all of that in one
    file makes the complete flow visible, but it also makes every declaration appear equally close to every other
    declaration.
  tags: []
  blocks:
    - type: markdown
      markdown: |-
        A project needs a larger form of the boundaries we already created with
        functions. Terrane uses namespaces to give declarations stable identities,
        imports to bring selected names into a scope, and a package manifest to tell the
        compiler which source tree belongs to the build.

        Splitting files should not alter the program's behavior. This chapter will move
        Chapter 7's reporting tool into three namespaces and run it through the same
        compiler pipeline.
  sections:
    - id: from-one-file-to-a-project
      title: From one file to a project
      blocks:
        - type: markdown
          markdown: |-
            The single source currently contains three conceptual regions:
        - type: example
          id: legacy-fence-001
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            invalid-report-entry
            require-entry, strict-total, progress-label, print-report
            main
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Those regions have different reasons to change:

            - error contracts change when the domain distinguishes failures differently;
            - reporting changes when validation, calculation, or presentation changes;
            - the application changes when inputs and recovery policy change.

            That gives us a useful project shape:
        - type: example
          id: legacy-fence-002
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            work-report/
            ├── package.toml
            ├── app/
            │   └── main.trn
            ├── errors/
            │   └── invalid-report-entry.trn
            └── reporting/
                └── report.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Files are not the program's semantic identity. The declarations inside them
            belong to namespaces. The manifest maps namespace roots to directory roots so
            source discovery is bounded and reproducible.

            A split is worthwhile when it reveals a boundary, not merely when a file reaches
            an arbitrary length. Three files named `part-one.trn`, `part-two.trn`, and
            `part-three.trn` would reduce line counts without explaining the program. `app`,
            `errors`, and `reporting` tell a reader why each part exists.
      sections: []
    - id: namespaces-and-paths
      title: Namespaces and paths
      blocks:
        - type: markdown
          markdown: |-
            Every manifest-backed Terrane source unit begins by declaring its namespace:
        - type: example
          id: legacy-fence-003
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            namespace work-report/reporting
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A small executable script has one deliberate exception. Put a shebang at byte
            zero and the single-file compiler supplies an implementation-owned namespace, so
            the declaration may be omitted:
        - type: example
          id: legacy-fence-004
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            #!/usr/bin/env terrane
            function main;
              print; >hello
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            With `terrane` available on `PATH`:
        - type: example
          id: legacy-fence-005
          title: null
          language: sh
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            chmod +x thing.trn
            ./thing.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This invokes the same compiler, generated-Rust, Cargo-cache, and execution
            pipeline as `terrane run thing.trn`; it is not a separate interpreter. Arguments
            after the filename are passed to the program, and a leading `--` is optional in
            this direct form. The script still needs a parameterless top-level `main`, which
            remains the clear execution entrypoint.

            The namespace omission is intentionally limited to a shebang-bearing direct
            source file. Files discovered through `package.toml` must still declare the
            namespace their directory mapping requires.

            Namespace segments use lowercase ASCII letters, digits, and internal hyphens.
            `/` separates every namespace boundary:
        - type: example
          id: legacy-fence-006
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            work-report
            work-report/reporting
            work-report/reporting/renderers
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A leading slash anchors a lookup at the namespace root:
        - type: example
          id: legacy-fence-007
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /work-report/errors import invalid-report-entry
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The slash is a namespace separator, not a host filesystem root and not an
            identifier character. `/work-report/errors` means the root namespace path
            `work-report/errors`; it does not mean `/work-report/errors` on Linux.

            Relative namespace paths are also available. From `work-report/reporting`, this
            names the sibling namespace `work-report/errors`:
        - type: example
          id: legacy-fence-008
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from ../errors import invalid-report-entry
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Absolute paths are useful when an example should be readable without first
            calculating its current location. Relative paths can make a tightly related
            subtree easier to move. Choose deliberately and remain consistent within a local
            part of the project.

            Namespace identity is exact. The compiler does not silently lowercase
            `Work-Report`, reinterpret dots as separators, or scan the entire filesystem for
            something with a similar name. A misspelling should produce a source diagnostic
            rather than a surprising nearby import.
      sections: []
    - id: imports
      title: Imports
      blocks:
        - type: markdown
          markdown: |-
            An import binds an object from another namespace into the scope containing the
            import. The reporting source needs the map constructor and the domain error:
        - type: example
          id: legacy-fence-009
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /core/collections import map
            from /work-report/errors import invalid-report-entry
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            These are selective imports. Only the named objects enter the scope.

            An alias changes the local spelling without changing the imported object's
            identity:
        - type: example
          id: legacy-fence-010
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /work-report/reporting import print-report as show-report
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The application can now write:
        - type: example
          id: legacy-fence-011
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            show-report; 'Corrected report', 18, corrected
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The function remains `/work-report/reporting::print-report`. `show-report` is
            the name by which this scope refers to it; the alias does not create a wrapper
            or a second function.

            A namespace-wide import binds every public function-body object exported by that
            namespace:
        - type: example
          id: legacy-fence-012
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            import /work-report/reporting
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Selective imports are usually clearer when a module needs only one or two
            objects. Namespace-wide imports are useful when the imported namespace
            deliberately presents a small, coherent vocabulary. They should not be used to
            avoid learning where a name comes from.

            Imports are structural compile-time declarations. They are not ordinary function
            calls and do not perform runtime initialization merely because the source
            mentions them. The compiler resolves them before ordinary expression evaluation.

            The default prelude still applies. `print`, task-scope constructs, UTF
            descriptors, and the ordinary scalar type constructs listed earlier do not need
            imports. Operational facilities such as collections remain explicit:
        - type: example
          id: legacy-fence-013
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /core/collections import map

            function main;
              values map of string, int = map
              print; values.length
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Importing `print` in an ordinary prelude-enabled project is redundant. Importing
            `map` communicates a real dependency on the collection facility.
      sections: []
    - id: organizing-the-source-tree
      title: Organizing the source tree
      blocks:
        - type: markdown
          markdown: |-
            Our manifest will map three namespace roots directly to three directories:
        - type: example
          id: legacy-fence-014
          title: null
          language: toml
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            [namespaces]
            "work-report/app" = "app"
            "work-report/errors" = "errors"
            "work-report/reporting" = "reporting"
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A file immediately inside `reporting/` therefore declares:
        - type: example
          id: legacy-fence-015
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            namespace work-report/reporting
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            If that directory contained `format/text.trn`, its namespace would be
            `work-report/reporting/format`. The namespace tree and directory tree continue
            together beneath the mapped root.

            The compiler checks that declared namespaces agree with their mapped locations.
            Moving `report.trn` into `errors/` without changing its namespace is not a
            harmless organizational choice: the file would claim one identity while
            occupying the source root assigned to another. Terrane rejects that
            disagreement.

            The manifest discovers `.trn` files recursively beneath declared roots. A source
            file outside every mapping is not quietly added because it happens to be nearby.
            Conversely, compilation is not driven by following imports until no more files
            happen to appear. The declared roots bound the source set, and the compiler
            assembles that complete set deterministically.

            This matters for reproducibility. Two machines should not build different
            programs because one has an extra scratch file in an unrelated directory or
            because filesystem iteration returns a different order.

            Organize by stable responsibility rather than by compiler phase. The application
            should not need folders named `parser-input`, `typed`, or `generated-rust`;
            those are compiler concerns. Our project folders name concepts in the reporting
            application.
      sections: []
    - id: visibility
      title: Visibility
      blocks:
        - type: markdown
          markdown: |-
            Declarations are public by default. A public object may be imported from another
            namespace:
        - type: example
          id: legacy-fence-016
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function print-report; title string, target int, entries map of string, int
              # ...
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Not every implementation detail should become part of that boundary. The
            reporting namespace has two helpers:
        - type: example
          id: legacy-fence-017
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            private function require-entry throws invalid-report-entry; entry-name string, units int
              # ...

            private function strict-total int throws invalid-report-entry; entries map of string, int
              # ...
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `print-report` may call them because all three belong to the same namespace. The
            application may import `print-report`, but an attempt to import `strict-total`
            is rejected.

            Visibility answers who may name a declaration; it is not a request for runtime
            secrecy. Marking a function `private` does not encrypt its behavior or hide
            generated machine code. It keeps the source-level contract honest by preventing
            other namespaces from depending on an implementation detail.

            Use `public` explicitly when a strict visibility policy or API-focused source
            benefits from the emphasis. Under the ordinary default, omitting `public` still
            exports the declaration. `private` is therefore the important marker in our
            small package.

            `protected` supports deliberate inheritance and parent-to-child composition
            boundaries. It becomes relevant when a subclass needs a member unavailable to
            unrelated callers. Do not use it as a vague middle setting between public and
            private; choose it only when the inheritance relationship is part of the
            contract.

            A useful package surface is usually smaller than its implementation. Every
            public name can become something another source file expects to remain stable.
            Begin with the operations callers need, not every helper that happens to exist
            today.
      sections: []
    - id: the-package-manifest
      title: The package manifest
      blocks:
        - type: markdown
          markdown: |-
            At the project root, create `package.toml`:
        - type: example
          id: legacy-fence-018
          title: null
          language: toml
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            package = "work-report.tutorial"
            prelude = true

            [namespaces]
            "work-report/app" = "app"
            "work-report/errors" = "errors"
            "work-report/reporting" = "reporting"
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `package` gives the build graph a non-empty package identity. It is not a
            namespace declaration and does not force source namespaces to repeat its
            punctuation.

            `prelude = true` enables the ordinary default prelude. It is optional because
            `true` is the default, but retaining it in a tutorial manifest makes the choice
            visible. A specialized environment may disable it and import every required
            object explicitly.

            `[namespaces]` is required and non-empty. Each key is a canonical namespace
            root; each value is a distinct relative directory root. Absolute paths and
            parent traversal are rejected because a package should not acquire undeclared
            source by reaching outside its root.

            The manifest is authored TOML, not Terrane source. Unknown fields are errors
            rather than ignored guesses. This strictness catches misspelled build settings
            before they become machine-dependent behavior.

            A direct `.trn` command from earlier chapters still works because the compiler
            creates an implicit single-file package around it. Moving to `package.toml`
            makes the source set, namespace mapping, profile, and dependencies explicit
            without introducing a second compiler path.
      sections: []
    - id: dependencies
      title: Dependencies
      blocks:
        - type: markdown
          markdown: |-
            A package may depend on Terrane packages, projected Rust crates, and system
            libraries. Dependency declaration and name import are separate questions:

            - the manifest and lock data determine which package or crate version exists in
              the build;
            - source imports bind particular exported objects into a scope;
            - a source `use` declaration records a build dependency where that dependency
              form applies; it does not itself bind every supplied API name.

            Our project uses compiler-bundled core facilities, so it needs no third-party
            dependency entry. It imports `map` and `throwable` through their `/core`
            namespaces.

            Terrane libraries use the same source language and namespace system as the
            application. Their manifest selects `artifact = "library"`, their namespace
            roots equal or descend from the package identity, and they do not define `main`.
            Each library keeps its own `prelude` choice, while final artifact policy such as
            the executor and capability profile belongs to the application. The compiler
            otherwise analyzes and lowers library source together with the application, so
            importing a library declaration is an ordinary namespace import rather than a
            runtime plug-in boundary.

            During local development, install a sibling library from the application
            directory:
        - type: example
          id: legacy-fence-019
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane package install ../work-report-formatters
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The command requires this application's `package.toml`, validates the target
            library, and adds an unpinned dependency table:
        - type: example
          id: legacy-fence-020
          title: null
          language: toml
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            [terrane-dependencies."work-report/formatters"]
            path = "../work-report-formatters"
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The table declares which library source enters the build; source still imports
            selected names explicitly:
        - type: example
          id: legacy-fence-021
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /work-report/formatters import progress-label
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A published package can be consumed directly from an exact Git tag:
        - type: example
          id: legacy-fence-022
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane package install --git https://example.invalid/work-report-formatters.git --tag v1.2.3
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Terrane verifies that the checkout is exactly that tag and records a full
            SHA-256 source-tree hash. This hash is not a Git commit ID and is never
            abbreviated. `terrane package hash <directory>` and
            `terrane package hash --git <url> --tag <tag>` print the same value without
            changing the application manifest. The local command hashes every file outside
            `.git` and `.trn`, including README files or stray build output, so use a clean
            tree when comparing it with a Git tag.

            Rust dependencies are declared in `package.toml`, never smuggled into source
            through an undeclared path. A later package might contain:
        - type: example
          id: legacy-fence-023
          title: null
          language: toml
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            [rust-dependencies.codec]
            package = "base64"
            version = "=0.22.1"
            default-features = false
            features = ["alloc"]
            effects = ["build"]
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `codec` is the Terrane-facing dependency alias. Its admitted source objects live
            beneath `/deps/codec`; declaring the dependency does not import those names into
            the application. The exact resolved version, features, target, stable build
            toolchain, pinned rustdoc toolchain, and projection schema are part of the
            actual interface.

            Projection uses the crate's substantive canonical public path, preferring it
            over a convenience `prelude` re-export and then choosing the shortest path with
            lexical tie-breaking. Rust associated functions remain attached to their
            projected class and use static-member syntax:
        - type: example
          id: legacy-fence-024
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /deps/bytes import BytesMut

            buffer = BytesMut::with_capacity; 4096
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The same `with_capacity` function is not also exposed as an independent
            `/deps/bytes` member.

            Projection crosses `Option<T>` and representable Rust sequences, maps, sets, and
            homogeneous tuples into matching Terrane values. Map keys and set items must be
            scalars rather than optionals, collections, tuples, or foreign objects. Required
            collection crossings can cost time proportional to their size, but
            identity-element vectors reuse backing storage and tuple arguments move uniquely
            owned elements rather than cloning them. A shared tuple fails at the dependency
            boundary instead of panicking. `Vec<u8>` remains the direct `bytes` shape.
            Unsupported aggregate components decline the whole member rather than producing
            a partly typed value.

            Sometimes one crate's public signature exposes a type owned by another crate.
            Terrane does not invent a memberless copy of that transitive type. The member
            remains unavailable until the owning crate is declared directly at a version
            that unifies with the lock graph; receiving a value through another crate does
            not declare its owner. The diagnostic names that owner and resolved version.
            After Cargo resolves the lock graph, projection validation rejects conflicting
            owner versions before semantic import resolution or Rust lowering. This keeps
            type identity and the owner's methods attached to one reviewable dependency
            declaration. A multi-file package can keep `/deps` imports in the narrow
            namespace that owns the foreign boundary, then export Terrane-shaped functions
            to the application namespace. This is ordinary namespace composition, not a
            second dependency-specific module system, and it keeps projection details out of
            callers that do not need them.

            An admitted Rust `async fn` remains asynchronous after projection. Calling it
            constructs the same linear task used by a Terrane `async function`, and `await`
            consumes that task inside an async callable. Argument and result conversion do
            not change merely because the dependency suspends; returned Rust errors still
            enter the `dependency-error` path, and an unwinding panic still follows the
            selected profile's dependency-panic policy.

            A projected Rust API may also accept a concrete callback:
        - type: example
          id: legacy-fence-025
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            offset int = 10
            adjust = async function int; value int
              return value + offset

            result int = await apply_async_concurrently; 20, adjust
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The Rust `Fn`, `FnMut`, or `FnOnce` bound must reveal one complete monomorphic
            parameter and result contract. A future-returning callback becomes an
            `async function` value. Each invocation receives its own future and its own
            captured `offset`; the generated shim performs ordinary Terrane/Rust value
            conversion at that boundary. `FnMut` means the dependency may invoke the
            callback repeatedly with mutable Rust access; it does not add a mutable Terrane
            capture cell. Version-one anonymous functions still capture ordinary values by
            value, so coordinate changing shared state through an explicit owner task and
            typed channels. Retention and concurrency do not relax ownership: a retained
            callback cannot capture a borrowed local, and a callback required to cross
            workers may capture only transferable values. Open or lifetime-dependent
            callback signatures remain unavailable rather than being dynamically erased.

            A dependency may also expose a concrete owned asynchronous producer:
        - type: example
          id: legacy-fence-026
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            sequence = make_event_sequence;
            step = await sequence.next;
            print; step.item, step.end
            closed = await sequence.close;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `next` returns an `async-iteration-step` rather than using one value to mean
            several things. `step.item` marks a delivered item, `step.end` marks ordinary
            exhaustion, and `step.value` contains the typed item only in the first state. A
            Rust protocol error still enters `dependency-error`; cancellation is still
            reported by the enclosing task outcome. These are separate outcomes rather than
            sentinel values.

            The producer is linear. Each `next` must be awaited directly and temporarily
            borrows it across one suspension, while `close` consumes it and makes later use
            a compile-time ownership error. Letting the endpoint drop releases the Rust
            value, but it does not claim that a graceful protocol close occurred. Projection
            therefore admits only concrete owned item shapes; borrowed and open-associated
            item types remain unavailable.

            A dependency can project the outgoing side as a linear asynchronous sink:
        - type: example
          id: legacy-fence-027
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            sink = make_event_sink;
            outcome = await sink.send; event
            print; outcome.accepted, outcome.closed
            flushed = await sink.flush;
            closed = await sink.close;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `send` must be awaited directly because it mutably borrows the sink for one
            suspension. `outcome.accepted` reports that the dependency accepted the item;
            `outcome.closed` reports that the receiver has gone away. A dependency error,
            enclosing-task cancellation, or deadline is not folded into either boolean.
            `flush` preserves the dependency's own failure contract, and `close` consumes
            the endpoint as an explicit graceful shutdown. Dropping it still releases the
            Rust resource but does not claim a graceful close.

            A duplex dependency may expose a consuming `split` operation. Splitting
            transfers the whole value and returns independently owned incoming and outgoing
            halves; using the whole afterward is the same source ownership error as using a
            task or stream after transfer.

            A lifetime-bearing dependency builder can be projected without turning its
            intermediate into a general Terrane value when the whole operation is one nested
            expression:
        - type: example
          id: legacy-fence-028
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            database = await memory_database;
            answer int = await ((query_scalar; database, 'select ?1').bind; 42).fetch_one;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The concrete adapter returned by `query_scalar` borrows the named `database`
            input and continues through `bind`; it is **chain-only**. It may be used only as
            the receiver of the next member in that same expression. It cannot be assigned
            to a binding, returned, captured by a function, passed to Terrane code, or held
            across an `await`. Finish the chain with an operation such as `fetch_one` that
            returns an owned projected value. The adapter runs SQLx's generic query
            internally; open `sqlx::Query` itself remains unavailable rather than being
            dynamically erased.

            This is a containment rule, not hidden dynamic lifetime machinery. Lowering
            preserves one Rust expression and applies conversion, dependency failure, panic
            containment, and asynchronous execution at the terminal boundary. Editor details
            mark chain-only roots so the restriction is visible before you write the chain.

            Application tasks use the same explicit endpoint model with compiler-owned typed
            channels:
        - type: example
          id: legacy-fence-029
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /core/concurrency import channel, channel-block

            pair = channel; string, 16, channel-block
            sender = pair.sender
            receiver = pair.receiver

            sent = await sender.send; 'ready'
            received = await receiver.receive;
            sender.close;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The item descriptor fixes both endpoint types, so sending another type is a
            compile-time error. Capacity is a compile-time constant and bounds storage. A
            zero-capacity `channel-block` is a rendezvous: send remains pending until
            receive accepts that exact value. At that acceptance the send is complete. If
            its task resumes with both completion and cancellation ready, the accepted
            result wins rather than being relabeled cancelled. Positive capacities also
            support `channel-fail-send`, `channel-drop-newest`, and `channel-drop-oldest`;
            those policies are invalid at capacity zero because there is no buffered
            position to reject or evict against. Send outcomes separate `accepted`,
            `closed`, and `dropped`; `rejected-value` returns an item refused by fail-send
            or closure, while `dropped-value` returns the submitted or evicted item selected
            by a drop policy. Receive outcomes separate `available`, `closed`, and the
            optional typed `value`.

            Send and receive are local tasks, so a blocked operation participates in its
            enclosing scope's cancellation and deadline. Closing the sender lets buffered
            items drain before the receiver sees closure. Closing the receiver wakes blocked
            sends with closed outcomes and returns a list containing every already-accepted
            buffered value. Drop remains emergency cleanup and may destroy retained values.
            Both endpoints are linear: close consumes one, and duplicate ownership or later
            use is rejected before Rust lowering. When a pair and its endpoints are declared
            inside a loop body, each iteration initializes new owned values, so consuming
            one iteration's endpoints does not poison the next iteration. An endpoint
            declared outside the loop remains consumed across the back-edge until explicitly
            rebound.

            Projection resolution records each exact-cache, published, bundled, and local
            attempt together with its outcome and fallback reason. Trusted HTTPS artifacts
            must match the complete dependency, target, toolchain, schema, and SHA-256
            content identity before entering the ordinary offline cache. Bundled artifacts
            remain explicitly deferred until Terrane has a release artifact channel.

            Capabilities are likewise explicit. Filesystem, networking, process, entropy,
            threading, and TLS facilities may require permission from the selected package
            profile. Importing a gated facility without the required capability is a
            diagnostic, not a request for the compiler to weaken policy silently.

            A reproducible lock graph prevents “the same” package from changing beneath the
            source. Generated Cargo files remain compiler output; the Terrane package
            manifest is the authored contract.
      sections: []
    - id: building-and-running-a-package
      title: Building and running a package
      blocks:
        - type: markdown
          markdown: |-
            From the directory containing `package.toml`, check the complete package:
        - type: example
          id: legacy-fence-030
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane check .
          response: null
          diagnostic: null
