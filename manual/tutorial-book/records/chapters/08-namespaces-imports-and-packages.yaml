        - type: markdown
          markdown: |-
            The manifest path is also accepted explicitly:
        - type: example
          id: legacy-fence-031
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane check package.toml
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Both forms load the mapped source set and run the shared compiler pipeline.
            `check` does not mean “parse only”; it carries the package through
            generated-Rust validation so a source program is not declared healthy while its
            lowering fails.

            Inspect generated Rust with:
        - type: example
          id: legacy-fence-032
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane rust package.toml
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Build an executable with:
        - type: example
          id: legacy-fence-033
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane build package.toml
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            For an optimized executable:
        - type: example
          id: legacy-fence-034
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane build --release package.toml
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Run the package directly:
        - type: example
          id: legacy-fence-035
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane run package.toml
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `check`, `rust`, `build`, and `run` use one source, resolution, semantic, and
            lowering pipeline. The command chooses how far to take the same compilation
            result; it does not select a different interpretation of the language.

            The package's entry point is still the real `main` function. Splitting the
            project does not replace language-level entry with a manifest script.
