format: 1
id: book.decisions-and-repetition
kind: chapter
surface: null
lifecycle:
  status: current
  stability: experimental
  since: "0.1"
  deprecated-since: null
  removed-in: null
  replacement: null
documentation:
  status: complete
  title: Making Decisions and Repeating Work
  title-style: text
  summary: |-
    A useful program rarely performs every operation exactly once. It chooses work according to current values, and it
    repeats work over changing state or a sequence of items.
  tags: []
  blocks:
    - type: markdown
      markdown: |-
        Terrane expresses those ideas with a small family of indentation-based
        statements:
    - type: example
      id: legacy-fence-001
      title: null
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |2
        if condition
          work

        while condition
          work

        for item in things
          work
      response: null
      diagnostic: null
      markdown: null

    - type: markdown
      markdown: |-
        The surface is compact, but the choices matter. An `if` selects among
        alternatives. A `while` repeats while a condition remains true. A `for` asks an
        object for its sequence of items. `break` and `continue` alter the current loop
        without disguising that change inside an expression.

        By the end of this chapter, you will be able to:

        - choose between branches with `if`, `else if`, and `else`;
        - combine conditions with `and`, `or`, and `not`;
        - repeat state-driven work with `while`;
        - iterate over strings and ranges with `for`;
        - leave or skip within a loop;
        - reason about names created by loop bodies;
        - choose the loop that communicates the program's intent;
        - classify a range of numbers in a complete program.
  sections:
    - id: choosing-with-if-and-else
      title: Choosing with `if` and `else`
      blocks:
        - type: markdown
          markdown: |-
            An `if` evaluates a condition and runs its indented body when that condition is
            true:
        - type: example
          id: legacy-fence-002
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            if total <= budget
              print; 'Purchase approved'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            When the comparison is false, the body is skipped.

            Add `else` for the alternative:
        - type: example
          id: legacy-fence-003
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            if total <= budget
              print; 'Purchase approved'
            else
              print; 'Over budget'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `else` aligns with its `if`. The two indented bodies are distinct blocks, and
            exactly one runs.

            A complete program might look like this:
        - type: example
          id: legacy-fence-004
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            namespace budget-decision

            function main;
              total = 22
              budget = 20

              if total <= budget
                print; 'Purchase approved'
              else
                print; 'Over budget'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            It prints:
        - type: example
          id: legacy-fence-005
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            Over budget
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The condition is an ordinary expression. Here, `<=` compares two integers and
            produces a boolean. Terrane evaluates that value before choosing a branch.
      sections:
        - id: choosing-with-if-and-else-more-than-two-alternatives
          title: More than two alternatives
          blocks:
            - type: markdown
              markdown: |-
                Use `else if` when alternatives are tested in order:
            - type: example
              id: legacy-fence-006
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                if temperature < 0
                  print; 'freezing'
                else if temperature < 15
                  print; 'cold'
                else if temperature < 25
                  print; 'mild'
                else
                  print; 'warm'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The conditions are considered from top to bottom. The first true condition wins,
                and later alternatives are not evaluated. The final `else` handles everything
                not accepted earlier.

                Order therefore carries meaning. This arrangement works because each later
                branch receives values excluded by earlier ones. If `temperature < 25` appeared
                first, both freezing and cold temperatures would be reported as mild enough for
                that broad condition.
          sections: []
        - id: choosing-with-if-and-else-indentation-is-the-block
          title: Indentation is the block
          blocks:
            - type: markdown
              markdown: |-
                There are no braces around a branch. Statements belong to it because they are
                indented:
            - type: example
              id: legacy-fence-007
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                if ready
                  print; 'starting'
                  started = true
                print; 'decision finished'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The first two statements are conditional. The final `print` aligns with `if`, so
                it runs after the decision whichever branch was taken.

                Readable indentation is therefore part of correctness, not decoration supplied
                after parsing.
          sections: []
    - id: combining-conditions
      title: Combining conditions
      blocks:
        - type: markdown
          markdown: |-
            Boolean operators let one decision depend on several facts:
        - type: table
          id: null
          title: null
          show-header: true
          columns:
            - id: operator
              title: Operator
              cell: markdown
            - id: meaning
              title: Meaning
              cell: markdown
          rows:
            - operator: "`and`"
              meaning: both conditions must be true
            - operator: "`or`"
              meaning: at least one condition must be true
            - operator: "`not`"
              meaning: reverse one condition
        - type: markdown
          markdown: |-
            Examples:
        - type: example
          id: legacy-fence-008
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            if has-ticket and door-open
              print; 'enter'

            if is-admin or owns-document
              print; 'editing allowed'

            if not finished
              print; 'work remains'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `not` applies to the expression immediately following it. Parentheses can make a
            larger intended unit explicit:
        - type: example
          id: legacy-fence-009
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            if not (is-admin or owns-document)
              print; 'read only'
          response: null
          diagnostic: null
          markdown: null
      sections:
        - id: combining-conditions-short-circuit-evaluation
          title: Short-circuit evaluation
          blocks:
            - type: markdown
              markdown: |-
                `and` and `or` evaluate from left to right and short-circuit.

                For `and`, a false left side already decides the result, so the right side is
                not evaluated:
            - type: example
              id: legacy-fence-010
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                available and permitted
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                For `or`, a true left side already decides the result:
            - type: example
              id: legacy-fence-011
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                cached or available
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                This is useful both for efficiency and safety. A later expression can rely on a
                condition established earlier:
            - type: example
              id: legacy-fence-012
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                if count != 0 and total / count > 10
                  print; 'average is high'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                When `count` is zero, the division is never evaluated.

                Short-circuiting should support a clear condition, not hide a sequence of
                unrelated side effects. If several operations must visibly happen, write
                statements.
          sections: []
        - id: combining-conditions-write-each-comparison
          title: Write each comparison
          blocks:
            - type: markdown
              markdown: |-
                Comparisons do not chain in Terrane. To check a range, combine two complete
                comparisons:
            - type: example
              id: legacy-fence-013
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                if minimum <= value and value <= maximum
                  print; 'inside range'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                This is rejected:
            - type: example
              id: legacy-fence-014
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                if minimum <= value <= maximum
                  print; 'inside range'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The explicit form makes both relationships and the shared value visible.
          sections: []
        - id: combining-conditions-conditions-are-object-behavior
          title: Conditions are object behavior
          blocks:
            - type: markdown
              markdown: |-
                A condition is not defined as “anything nonzero” or “anything nonempty.”
                Booleans and comparison results are the clearest everyday inputs:
            - type: example
              id: legacy-fence-015
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                if ready
                  print; 'ready'

                if count > 0
                  print; 'items available'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                A class can deliberately join the structural truth protocol by declaring a
                synchronous, non-throwing, non-mutating, parameterless `truth bool` method:
            - type: example
              id: legacy-fence-016
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                class gate
                  open bool = false

                  function truth bool;
                    return this.open
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Instances of `gate` may then be used directly by `if` and `while`. No interface
                declaration is needed: the compiler checks the descriptor's member shape. A
                missing method or a `truth` method with another signature is rejected. This
                remains explicit object behavior, not accidental truthiness borrowed from
                another language.
          sections: []
    - id: repeating-with-while
      title: Repeating with `while`
      blocks:
        - type: markdown
          markdown: |-
            A `while` loop repeats its body while its condition remains true:
        - type: example
          id: legacy-fence-017
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            countdown = 3
            while countdown > 0
              print; countdown
              countdown--
            print; 'go'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The loop proceeds as follows:

            1. evaluate `countdown > 0`;
            2. if false, leave the loop;
            3. if true, run the indented body;
            4. return to the condition.

            The output is:
        - type: example
          id: legacy-fence-018
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            3
            2
            1
            go
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The body changes `countdown`, eventually making the condition false. Without
            that update, the loop would continue indefinitely:
        - type: example
          id: legacy-fence-019
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            while countdown > 0
              print; countdown          # countdown never changes
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            An infinite loop may occasionally be intentional, but it should be a deliberate
            property of the program rather than a missing state transition.
      sections:
        - id: repeating-with-while-use-while-for-state-driven-repetition
          title: Use `while` for state-driven repetition
          blocks:
            - type: markdown
              markdown: |-
                `while` is a natural fit when continuation depends on evolving state:
            - type: example
              id: legacy-fence-020
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                attempts = 0
                connected = false

                while attempts < 3 and not connected
                  attempts++
                  # Try one connection operation here.
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The program cannot describe the loop merely as “visit every item in this
                collection.” It must reconsider a condition after each attempt.

                Keep the variables controlling that condition easy to find. A `while` body that
                changes its own exit state in many distant places is difficult to reason about.
          sections: []
    - id: iterating-with-for
      title: Iterating with `for`
      blocks:
        - type: markdown
          markdown: |-
            A `for` loop visits the items produced by an iterable object:
        - type: example
          id: legacy-fence-021
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            for character in 'Terrane'
              print; character
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            On each iteration, `character` is bound to the next item. Strings iterate as
            Unicode grapheme clusters, so a user-perceived character remains one item even
            when its encoding contains several code points.

            A `for` loop says two things directly:

            - which object supplies the sequence;
            - which name denotes the current item.

            It does not require a manual index, an explicit length check, or an update
            statement.
      sections:
        - id: iterating-with-for-iteration-uses-a-protocol
          title: Iteration uses a protocol
          blocks:
            - type: markdown
              markdown: |-
                `for` is not limited to one built-in storage type. It asks the object on its
                right to provide ordinary iteration behavior.

                That distinction becomes useful as the language grows. Strings, ranges, lists,
                maps, and user-defined iterable objects can participate through one loop form
                without pretending they have the same representation.

                The loop consumes the sequence of yielded items until the iterator reports its
                distinct end state. End-of-iteration is not represented by `none`, because
                `none` may itself be a valid item.

                You do not need to invoke the iteration protocol manually for ordinary loops.
                The `for` statement is its direct language surface.
          sections: []
    - id: ranges-and-ordinary-iteration
      title: Ranges and ordinary iteration
      blocks:
        - type: markdown
          markdown: |-
            A range represents a numeric progression. It is an ordinary object supplied by
            `/core/collections`, so import it explicitly:
        - type: example
          id: legacy-fence-022
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /core/collections import range
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Construct a half-open range with a start and an end:
        - type: example
          id: legacy-fence-023
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            numbers = range; 1, 5
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Iterating it yields:
        - type: example
          id: legacy-fence-024
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            1
            2
            3
            4
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The end value, `5`, is excluded. Use it with `for`:
        - type: example
          id: legacy-fence-025
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            numbers = range; 1, 5
            for number in numbers
              print; number
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Half-open ranges work naturally with counts and boundaries. A range from zero to
            a collection length contains exactly the valid forward indices when that
            collection uses zero-based indexing.
      sections:
        - id: ranges-and-ordinary-iteration-steps-and-direction
          title: Steps and direction
          blocks:
            - type: markdown
              markdown: |-
                A third argument supplies the step:
            - type: example
              id: legacy-fence-026
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                even-numbers = range; 0, 10, 2
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                This yields `0`, `2`, `4`, `6`, and `8`.

                A negative step counts downward:
            - type: example
              id: legacy-fence-027
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                countdown = range; 5, 0, -1
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                This yields `5`, `4`, `3`, `2`, and `1`.

                A step may not be zero. A step whose direction cannot approach the endpoint
                produces an empty range rather than silently reversing direction:
            - type: example
              id: legacy-fence-028
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                empty = range; 0, 5, -1
              response: null
              diagnostic: null
              markdown: null
          sections: []
        - id: ranges-and-ordinary-iteration-inclusive-ranges-are-explicit
          title: Inclusive ranges are explicit
          blocks:
            - type: markdown
              markdown: |-
                When the endpoint should be included, use the `through` member:
            - type: example
              id: legacy-fence-029
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                numbers = range.through; 1, 5
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                This yields `1` through `5`.

                The separate spelling keeps the boundary choice visible. A reader need not
                remember whether one particular loop context quietly includes an endpoint.
          sections: []
        - id: ranges-and-ordinary-iteration-prefer-items-over-indices
          title: Prefer items over indices
          blocks:
            - type: markdown
              markdown: |-
                If the program needs each item, iterate the items:
            - type: example
              id: legacy-fence-030
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                for character in text
                  print; character
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Do not introduce a range and index merely because another language taught
                iteration that way. Use indices when the index itself has meaning or when the
                operation genuinely requires positional lookup.
          sections: []
    - id: break-and-continue
      title: "`break` and `continue`"
      blocks:
        - type: markdown
          markdown: |-
            `break` leaves the nearest enclosing loop immediately:
        - type: example
          id: legacy-fence-031
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            number = 1
            while number <= 10
              if number == 4
                break
              print; number
              number++
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This prints `1`, `2`, and `3`. When `number` reaches `4`, execution continues
            after the loop.

            `continue` skips the remainder of the current iteration and begins the next one:
        - type: example
          id: legacy-fence-032
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            numbers = range; 1, 6
            for number in numbers
              if number == 3
                continue
              print; number
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This prints `1`, `2`, `4`, and `5`.

            Neither statement produces a value. They are visible control-flow operations.
      sections:
        - id: break-and-continue-order-updates-carefully-in-while
          title: Order updates carefully in `while`
          blocks:
            - type: markdown
              markdown: |-
                A `continue` in a `while` loop can accidentally skip the update that would make
                progress:
            - type: example
              id: legacy-fence-033
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                number = 0
                while number < 5
                  if number == 2
                    continue                 # number never advances beyond 2
                  number++
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Move the update before the possible `continue`, or restructure the condition:
            - type: example
              id: legacy-fence-034
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                number = 0
                while number < 5
                  number++
                  if number == 2
                    continue
                  print; number
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                A `for` loop advances its iterator as part of the loop machinery, so `continue`
                naturally requests the next item.
          sections: []
        - id: break-and-continue-use-early-loop-control-to-flatten-code
          title: Use early loop control to flatten code
          blocks:
            - type: markdown
              markdown: |-
                `continue` can keep the main work from becoming deeply nested:
            - type: example
              id: legacy-fence-035
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                for number in numbers
                  if number < 0
                    continue

                  print; 'nonnegative: ', number
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Similarly, `break` can state that a search is complete:
            - type: example
              id: legacy-fence-036
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                for character in text
                  if character == ':'
                    break
                  print; character
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Use these statements when they reveal the loop's control decision. Too many
                exits scattered through a large body make the same loop harder to understand.
          sections: []
    - id: loop-local-names
      title: Loop-local names
      blocks:
        - type: markdown
          markdown: |-
            A `for` target belongs to the loop body:
        - type: example
          id: legacy-fence-037
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            for number in numbers
              print; number
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            After the loop, `number` is no longer available. The name describes the current
            item, and there is no current item once iteration ends.

            Names first created inside the body are local to that body too:
        - type: example
          id: legacy-fence-038
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            for number in numbers
              doubled = number * 2
              print; doubled

            print; doubled               # rejected: doubled is out of scope
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This prevents a value from accidentally leaking out of a loop where it may never
            have been initialized. An empty iterable would run the body zero times, so there
            would be no reliable final `doubled` value.
      sections:
        - id: loop-local-names-updating-an-outer-binding
          title: Updating an outer binding
          blocks:
            - type: markdown
              markdown: |-
                A name declared before the loop remains visible inside it. Assigning to that
                existing binding updates it:
            - type: example
              id: legacy-fence-039
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                total = 0
                numbers = range; 1, 4

                for number in numbers
                  total = total + number

                print; total
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The result is `6`.

                This pattern is appropriate for an accumulated result. The loop target `number`
                remains local, while `total` was deliberately established as state that survives
                the loop.
          sections: []
        - id: loop-local-names-each-target-is-an-ordinary-local-value
          title: Each target is an ordinary local value
          blocks:
            - type: markdown
              markdown: |-
                Changing the loop target does not rewrite the iterated object:
            - type: example
              id: legacy-fence-040
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                for character in 'abc'
                  character = 'changed'
                  print; character
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The target is a local binding for the current item. Terrane's ordinary value
                semantics do not turn it into a hidden reference to the source collection.

                When a program intends to mutate collection elements in place, it should use the
                collection's explicit mutation operations rather than relying on loop-variable
                aliasing. Chapter 5 develops that distinction.
          sections: []
    - id: choosing-the-clearest-loop
      title: Choosing the clearest loop
      blocks:
        - type: markdown
          markdown: |-
            Terrane offers more than one way to express some repetitions. Choose the one
            that tells the reader why repetition continues.

            Use `for` when the program visits items from an iterable:
        - type: example
          id: legacy-fence-041
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            for character in text
              print; character
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Use `while` when repetition depends on changing state:
        - type: example
          id: legacy-fence-042
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            while attempts < limit and not connected
              attempts++
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Use `break` when the loop's purpose may finish before its natural end:
        - type: example
          id: legacy-fence-043
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            for character in text
              if character == ':'
                break
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Use `continue` when one item should be skipped and the main path should remain
            visually clear:
        - type: example
          id: legacy-fence-044
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            for number in numbers
              if number < 0
                continue
              print; number
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Terrane also supports a three-clause `for` for genuinely index-driven work:
        - type: example
          id: legacy-fence-045
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            for index = 0; index < 3; index++
              print; index
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The semicolons in this form delimit the loop's clauses; they are not call
            markers. Calls used inside those clauses must be grouped. Prefer ordinary
            `for item in items` when it states the job directly.
      sections:
        - id: choosing-the-clearest-loop-avoid-clever-equivalence
          title: Avoid clever equivalence
          blocks:
            - type: markdown
              markdown: |-
                A `while` loop can imitate a `for`, and a `for` can carry enough state to
                imitate many `while` loops. Syntactic possibility is not a reason to choose the
                less direct form.

                This:
            - type: example
              id: legacy-fence-046
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                numbers = range; 0, 5
                for number in numbers
                  print; number
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                states its finite sequence more clearly than manually maintaining the same
                counter in a `while` loop.

                Conversely, retrying until success is state-driven behavior. Hiding it inside a
                fabricated range of possible attempts can obscure the condition that actually
                matters.
          sections: []
    - id: project-classify-a-range-of-numbers
      title: "Project: classify a range of numbers"
      blocks:
        - type: markdown
          markdown: |-
            We will finish with a small program that combines ranges, iteration, ordered
            decisions, arithmetic, and boolean conditions.

            Create `number-classifier.trn`:
        - type: example
          id: legacy-fence-047
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            namespace number-classifier

            from /core/collections import range

            function main;
              numbers = range; -3, 5

              for number in numbers
                if number == 0
                  print; number, ': zero'
                else if number % 2 == 0 and number < 0
                  print; number, ': negative even'
                else if number < 0
                  print; number, ': negative odd'
                else if number % 2 == 0
                  print; number, ': positive even'
                else
                  print; number, ': positive odd'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Run it:
        - type: example
          id: legacy-fence-048
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane run number-classifier.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The output is:
        - type: example
          id: legacy-fence-049
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            -3: negative odd
            -2: negative even
            -1: negative odd
            0: zero
            1: positive odd
            2: positive even
            3: positive odd
            4: positive even
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The range is half-open, so `-3` is included and `5` is not.

            Within the loop, the branch order narrows the remaining possibilities:

            1. zero is handled first because it is neither positive nor negative;
            2. a negative number divisible by two is negative and even;
            3. any remaining negative number is odd;
            4. a remaining number divisible by two is positive and even;
            5. every remaining number is positive and odd.

            The condition:
        - type: example
          id: legacy-fence-050
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            number % 2 == 0
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            asks whether division by two leaves no remainder. Combining it with `number < 0`
            distinguishes the negative-even branch.

            We could repeat the even test in every branch, but the ordered structure lets
            each later condition rely on what earlier conditions have excluded. The program
            remains readable because every branch prints one complete classification.
      sections:
        - id: project-classify-a-range-of-numbers-try-a-different-interval
          title: Try a different interval
          blocks:
            - type: markdown
              markdown: |-
                Change the range:
            - type: example
              id: legacy-fence-051
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                numbers = range; -5, 8
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The branch logic needs no modification. Input selection and classification are
                separate decisions.

                For an inclusive upper endpoint, use:
            - type: example
              id: legacy-fence-052
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                numbers = range.through; -5, 8
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The changed constructor makes the boundary choice visible at the value's
                creation.

                Chapter 4 will move the classification work into a function. That refactoring
                will let us reuse and test the decision independently of the loop that supplies
                numbers.
          sections: []
    - id: exercises
      title: Exercises
      blocks:
        - type: markdown
          markdown: |-
            1. Change the budget-decision example so it has three outcomes: under budget,
               exactly on budget, and over budget. Put the equality branch where it can
               still be reached.

            2. Write a countdown from five to one using `while`, then print `'lift off'`.
               Confirm that the loop changes the binding used by its condition.

            3. Import `range` and print the even numbers from `2` through `10`. Use an
               inclusive range or choose the correct half-open endpoint deliberately.

            4. Iterate over a short string and skip one character with `continue`. Predict
               the exact output before running it.

            5. Sum the values in `range; 1, 6` using an outer `total` binding. Try to use
               the loop target after the loop and read the resulting diagnostic, then remove
               the invalid line.

            6. Extend the number classifier with a special branch for values divisible by
               both `3` and `2`. Place the most specific condition before the broader even
               condition.

            7. Rewrite one `for` example as a `while` loop. Compare them and keep the
               version that makes the continuation rule clearest.
      sections: []
    - id: what-we-learned
      title: What we learned
      blocks:
        - type: markdown
          markdown: |-
            `if`, `else if`, and `else` choose among ordered alternatives. Conditions use
            truth behavior; comparisons provide clear booleans, and `and`, `or`, and `not`
            combine them. `and` and `or` short-circuit from left to right.

            A `while` loop repeats according to changing state. A `for` loop visits the
            items supplied by an iterable object. Ranges are ordinary imported collection
            objects: `range; start, end` is half-open, `range.through; start, end` includes
            the endpoint, and an optional nonzero step determines progression.

            `break` leaves the nearest loop, while `continue` skips to its next iteration.
            Loop targets and names introduced in a loop body do not escape that body.
            Bindings deliberately created before a loop can accumulate results that survive
            it.

            The clearest loop advertises why repetition continues: items suggest `for`,
            evolving state suggests `while`, completed searches suggest `break`, and
            excluded items may suggest `continue`.

            In the next chapter, we will give reusable work a name. The number classifier's
            decision will become a function with parameters and a result, and we will learn
            how small function contracts let larger programs compose.
      sections: []
