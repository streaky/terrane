format: 1
id: book.values-and-names
kind: chapter
surface: null
lifecycle:
  status: current
  stability: experimental
  since: "0.1"
  deprecated-since: null
  removed-in: null
  replacement: null
documentation:
  status: complete
  title: Values, Names, and Everyday Expressions
  title-style: text
  summary: |-
    The first chapter gave us a working rhythm: edit a source file, check it, run it, and compare the result with what we
    expected. We can now slow down and examine the pieces inside those first programs.
  tags: []
  blocks:
    - type: markdown
      markdown: |-
        Most everyday computation begins with a small vocabulary:

        - values such as numbers, truth values, and text;
        - names that let us use those values again;
        - operators that combine and compare them;
        - members that expose information or behavior;
        - calls that ask an object to do something.

        Terrane keeps those pieces regular. A name by itself refers to an object. A dot
        selects one of the object's members. A semicolon invokes an object. Parentheses
        say exactly where a nested expression belongs.

        By the end of this chapter, you will be able to read and write expressions such
        as:
    - type: example
      id: legacy-fence-001
      title: null
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |2
        within-budget = total <= budget
        summary = 'Item: '.concat; item, ', total: ', total
        print; ('Characters: '.concat; item.length)
      response: null
      diagnostic: null
      markdown: null

    - type: markdown
      markdown: |-
        We will use inferred types throughout. Chapter 10 develops explicit type
        contracts; here, we want to see how much ordinary code can say without
        annotation ceremony.
  sections:
    - id: numbers-truth-values-and-text
      title: Numbers, truth values, and text
      blocks:
        - type: markdown
          markdown: |-
            A value is a piece of information a Terrane program can compute, store, pass,
            compare, or display.

            Three kinds appear constantly in small programs:
        - type: example
          id: legacy-fence-002
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            42
            true
            'Terrane'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            These are an integer, a truth value, and a string.
      sections:
        - id: numbers-truth-values-and-text-whole-numbers
          title: Whole numbers
          blocks:
            - type: markdown
              markdown: |-
                A whole-number literal is written with decimal digits:
            - type: example
              id: legacy-fence-003
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                0
                7
                1200
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                A leading minus sign negates a number:
            - type: example
              id: legacy-fence-004
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                -4
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Underscores may separate digits when they improve readability:
            - type: example
              id: legacy-fence-005
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                1_000
                2_500_000
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The underscores do not change the value.

                Terrane's ordinary `int` represents exact signed integers. Its meaning does not
                change because a value grows beyond a machine register. The compiler may use
                progressively larger representations, but source arithmetic continues to
                describe mathematical integers rather than silently wrapping at a hidden
                boundary.

                That is a valuable default, but not a promise that enormous numbers cost the
                same as small ones. Larger representations require more work and storage. Later
                chapters introduce fixed-width integer types for formats and native boundaries
                that require them.
          sections: []
        - id: numbers-truth-values-and-text-decimal-numbers
          title: Decimal numbers
          blocks:
            - type: markdown
              markdown: |-
                A literal with a fractional part denotes a decimal numeric constant:
            - type: example
              id: legacy-fence-006
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                3.5
                0.25
                -12.75
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Without another numeric context, Terrane uses its default `float`, currently the
                same canonical type as `float64`.

                Integer and floating values are distinct. Terrane does not silently guess how to
                combine unrelated numeric value types:
            - type: example
              id: legacy-fence-007
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                price = 7.5
                quantity = 3
                total = price * quantity       # rejected: float64 and int differ
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                You can keep an expression consistently floating when that is its intended
                model:
            - type: example
              id: legacy-fence-008
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                start = 7.5
                increase = 2.0
                result = start + increase
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Chapter 10 explains numeric destinations and conversions. For now, the useful
                rule is: choose values that belong to one numeric model instead of relying on an
                invisible coercion.
          sections: []
        - id: numbers-truth-values-and-text-truth-values
          title: Truth values
          blocks:
            - type: markdown
              markdown: |-
                A `bool` has exactly two values:
            - type: example
              id: legacy-fence-009
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                true
                false
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Comparisons produce truth values:
            - type: example
              id: legacy-fence-010
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                7 < 10
                4 == 4
                'name' != 'other'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                We can also give a comparison a name:
            - type: example
              id: legacy-fence-011
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                within-budget = total <= budget
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Chapter 3 uses these values to choose and repeat work.
          sections: []
        - id: numbers-truth-values-and-text-text
          title: Text
          blocks:
            - type: markdown
              markdown: |-
                Single-quoted text creates a `string`:
            - type: example
              id: legacy-fence-012
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                'Hello'
                'Terrane source is UTF-8 text.'
                ''
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The final example is an empty string. A string represents Unicode text; it is
                not an interchangeable bag of arbitrary bytes. Terrane uses UTF-8 as its
                standard string representation—the dominant encoding of the modern web and a
                common default in contemporary terminals and development tools.

                For the moment, we will compose short strings with `concat` and display them
                with `print`. Chapter 5 explores text, multiline literals, searching, splitting,
                encoding, and explicit text views in detail.
          sections: []
    - id: giving-a-value-a-name
      title: Giving a value a name
      blocks:
        - type: markdown
          markdown: |-
            A bare assignment gives a value a name when that name does not already resolve
            in the current scope:
        - type: example
          id: legacy-fence-013
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            travellers = 3
            message = 'Ready'
            finished = false
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Read these as bindings:

            - `travellers` is bound to the integer value `3`;
            - `message` is bound to the string value `'Ready'`;
            - `finished` is bound to the boolean value `false`.

            The compiler infers each value's type. The values remain typed even though the
            source does not repeat an obvious annotation.

            A useful name communicates meaning rather than only representation:
        - type: example
          id: legacy-fence-014
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            subtotal = 24
            discount = 2
            total = subtotal - discount
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The calculation is easy to recover because the names describe its roles.

            Terrane's library and documentation convention is kebab-case:
        - type: example
          id: legacy-fence-015
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            items-ready = 12
            maximum-retries = 3
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Uppercase and underscores are legal for user declarations, but consistent
            kebab-case makes examples and ordinary Terrane code easier to scan.

            Terrane names are governed by Terrane's grammar, not by the implementation
            language used by the compiler. Words such as `box`, `final`, and `override`
            remain legal ordinary names even though Rust reserves them. Generated Rust
            safely encodes those spellings rather than imposing an extra source restriction.
            Prefer names that communicate the program's domain; legality alone does not make
            a general word descriptive.
      sections:
        - id: giving-a-value-a-name-names-are-read-from-their-scope
          title: Names are read from their scope
          blocks:
            - type: markdown
              markdown: |-
                Inside `main`, a name becomes available after its declaration:
            - type: example
              id: legacy-fence-016
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                function main;
                  first = 10
                  second = first + 5
                  print; second
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The initializer for `second` can use `first` because `first` is already bound in
                the surrounding function body.

                A name is not text. Writing `second` asks the current scope which object that
                name denotes; writing `'second'` creates a string containing six letters:
            - type: example
              id: legacy-fence-017
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                print; second       # displays 15
                print; 'second'     # displays the word second
              response: null
              diagnostic: null
              markdown: null
          sections: []
        - id: giving-a-value-a-name-discarding-or-retaining-a-result
          title: Discarding or retaining a result intentionally
          blocks:
            - type: markdown
              markdown: |-
                Use the bare name `_` when an operation matters but its result does not:
            - type: example
              id: legacy-fence-018
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                _ = record-metric; sample
                _ list of bytes = await query-bytes; database, query
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The expression is evaluated exactly once. A type may follow `_` when the
                operation needs a destination type, as in the second example. No binding is
                created, so `_` cannot be read later and does not produce an unused-binding
                warning. The discarded value has only statement lifetime and is released before
                the next statement.

                A name that merely starts with an underscore is different:
            - type: example
              id: legacy-fence-019
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                _guard = acquire-lock; resource
                perform-update; resource
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                `_guard` is an ordinary lexical binding. It retains ownership until its normal
                scope endpoint, but `W4001` is suppressed because the leading underscore marks
                the binding as intentionally unused. If code later reads `_guard`, the compiler
                reports `W4006` because the name no longer describes its use; rename it without
                the leading underscore. Use this form for lifetime guards, subscriptions,
                registrations, and similar values whose continued ownership matters even when
                their contents are never read.
          sections: []
    - id: changing-a-binding
      title: Changing a binding
      blocks:
        - type: markdown
          markdown: |-
            When a bare assignment finds an existing mutable binding, it changes that
            binding:
        - type: example
          id: legacy-fence-020
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            remaining = 10
            remaining = remaining - 3
            print; remaining
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The output is:
        - type: example
          id: legacy-fence-021
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            7
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The right side is evaluated using the current value of `remaining`. The
            resulting value is then assigned back to the existing binding.

            This distinction between a **binding** and its **value** is useful:
        - type: example
          id: legacy-fence-022
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            score = 10
            score = score + 5
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The integer value `10` did not mutate into `15`. The name `score` now refers to
            the result of a new expression.

            Terrane's compiler tracks which storage genuinely changes. You do not need to
            decorate every local binding with a mutability keyword before using ordinary
            reassignment.

            Numeric bindings also support update statements:
        - type: example
          id: legacy-fence-023
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            count = 1
            count++
            count--
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `++` and `--` are complete statements. They do not produce expression values:
        - type: example
          id: legacy-fence-024
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            next = count++       # rejected
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This avoids the sequencing puzzles created when one expression both observes and
            updates a value. Write the two operations when both are needed:
        - type: example
          id: legacy-fence-025
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            current = count
            count++
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Ordinary assignment has broader value-semantics consequences for collections and
            objects. Chapters 5 and 11 introduce those consequences when we have values
            substantial enough to make them visible.
      sections: []
    - id: arithmetic-and-comparisons
      title: Arithmetic and comparisons
      blocks:
        - type: markdown
          markdown: |-
            Terrane provides the familiar everyday arithmetic operators:
        - type: table
          id: null
          title: null
          show-header: true
          columns:
            - id: operator
              title: Operator
              cell: markdown
            - id: meaning
              title: Meaning
              cell: markdown
          rows:
            - operator: "`+`"
              meaning: addition
            - operator: "`-`"
              meaning: subtraction
            - operator: "`*`"
              meaning: multiplication
            - operator: "`/`"
              meaning: division
            - operator: "`%`"
              meaning: remainder
        - type: markdown
          markdown: |-
            For example:
        - type: example
          id: legacy-fence-026
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            width = 8
            height = 5
            area = width * height
            perimeter = width * 2 + height * 2
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Multiplication, division, and remainder bind more tightly than addition and
            subtraction:
        - type: example
          id: legacy-fence-027
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            result = 2 + 3 * 4       # 14
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Use parentheses when you want another grouping or when they make intent easier
            to see:
        - type: example
          id: legacy-fence-028
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            result = (2 + 3) * 4     # 20
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Integer division produces an integer quotient:
        - type: example
          id: legacy-fence-029
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; 7 / 3             # 2
            print; 7 % 3             # 1
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Terrane defines signed integer division consistently using Euclidean quotient
            and remainder. In particular, a nonzero divisor produces a nonnegative
            remainder:
        - type: example
          id: legacy-fence-030
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; -7 / 3            # -3
            print; -7 % 3            # 2
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            You do not need these negative cases every day, but the result is a language
            contract rather than whatever the target machine happens to do.
      sections:
        - id: arithmetic-and-comparisons-comparisons
          title: Comparisons
          blocks:
            - type: markdown
              markdown: |-
                Comparisons produce booleans:
            - type: table
              id: null
              title: null
              show-header: true
              columns:
                - id: operator
                  title: Operator
                  cell: markdown
                - id: meaning
                  title: Meaning
                  cell: markdown
              rows:
                - operator: "`==`"
                  meaning: equal in value
                - operator: "`!=`"
                  meaning: not equal in value
                - operator: "`<`"
                  meaning: less than
                - operator: "`<=`"
                  meaning: less than or equal
                - operator: "`>`"
                  meaning: greater than
                - operator: "`>=`"
                  meaning: greater than or equal
            - type: markdown
              markdown: |-
                Examples:
            - type: example
              id: legacy-fence-031
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                same = 12 == 12
                has-room = used < capacity
                over-limit = total > maximum
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Comparisons do not chain:
            - type: example
              id: legacy-fence-032
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                minimum < value < maximum       # rejected
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Write each relationship explicitly:
            - type: example
              id: legacy-fence-033
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                minimum < value and value < maximum
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Chapter 3 develops `and`, `or`, and `not` while building decisions.
          sections: []
        - id: arithmetic-and-comparisons-precedence-is-a-tool-not-a-puzzle
          title: Precedence is a tool, not a puzzle
          blocks:
            - type: markdown
              markdown: |-
                The compiler has precise precedence rules, but readable code should not make a
                reader reconstruct a long operator table. This is easy to follow:
            - type: example
              id: legacy-fence-034
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                total = unit-price * quantity - discount
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                When several kinds of comparison, boolean, and arithmetic operators meet,
                parentheses can communicate the intended stages:
            - type: example
              id: legacy-fence-035
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                acceptable = (total <= budget) and (quantity > 0)
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Use grouping to reveal meaning, not to surround every literal mechanically.
          sections: []
    - id: member-access-with
      title: Member access with `.`
      blocks:
        - type: markdown
          markdown: |-
            Values expose members. A dot selects one of them:
        - type: example
          id: legacy-fence-036
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            item.length
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Here, `item` is the receiver and `length` is the selected member. For a string,
            `length` reports the number of user-perceived characters, or grapheme clusters.
        - type: example
          id: legacy-fence-037
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            item = 'notebook'
            print; item.length
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The output is:
        - type: example
          id: legacy-fence-038
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            8
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Member access has no whitespace before the dot:
        - type: example
          id: legacy-fence-039
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            item.length       # member selection
            item .length      # not the member form
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The dot has one job in Terrane: it appears between a receiver and an instance
            member. It is not used as a namespace prefix or general punctuation for
            unrelated language features.
      sections:
        - id: member-access-with-properties-and-methods
          title: Properties and methods
          blocks:
            - type: markdown
              markdown: |-
                Some members are properties. Selecting one directly observes state, metadata, or
                classification:
            - type: example
              id: legacy-fence-040
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                item.length
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Other members are methods. Selecting a method produces a callable object;
                invoking it requires `;`:
            - type: example
              id: legacy-fence-041
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                item.concat; ' case'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Parameter count does not decide the distinction. A zero-argument property needs
                no semicolon, while a zero-argument method still does:
            - type: example
              id: legacy-fence-042
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                measurement.finite          # property
                measurement.absolute;       # method call
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                This may feel precise for a first encounter, but it gives member syntax a
                dependable reading rule: dot selects; semicolon invokes.
          sections: []
    - id: calling-with-semicolon
      title: Calling with `;`
      blocks:
        - type: markdown
          markdown: |-
            A semicolon invokes an object's default behavior:
        - type: example
          id: legacy-fence-043
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; 'Hello'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            In this case, `print` names a function object. The semicolon invokes it, and the
            string is its argument.

            Calls may take several comma-separated arguments:
        - type: example
          id: legacy-fence-044
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; 'Total: ', total, ' credits'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `print` displays them from left to right, then appends a newline.

            A zero-argument call still includes the marker:
        - type: example
          id: legacy-fence-045
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            refresh;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The semicolon is not a statement terminator. Newlines normally end statements.
            It specifically says **invoke the object on the left**.

            The distinction is visible with methods too:
        - type: example
          id: legacy-fence-046
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            result = text.trim;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The dot selects `trim`; the semicolon invokes it.
      sections:
        - id: calling-with-semicolon-the-call-owns-the-remaining-expression
          title: The call owns the remaining expression
          blocks:
            - type: markdown
              markdown: |-
                An unwrapped call extends through the rest of its logical expression:
            - type: example
              id: legacy-fence-047
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                message = 'Item: '.concat; item, ', total: ', total
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The call to `concat` receives three arguments: `item`, the middle string, and
                `total`. Its result is assigned to `message`.

                Likewise:
            - type: example
              id: legacy-fence-048
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                print; 2 + 3, ' is the result'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                passes two arguments to `print`: the result of `2 + 3`, and the string.

                This trailing form keeps common calls light. It also makes nested calls
                something we must delimit explicitly.
          sections: []
    - id: nested-calls-and-parentheses
      title: Nested calls and parentheses
      blocks:
        - type: markdown
          markdown: |-
            Suppose we want to compose a message and pass the result directly to `print`.
            This contains one call inside another:
        - type: example
          id: legacy-fence-049
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; ('Hello, '.concat; name, '!')
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The parentheses delimit the inner call. Read from the inside out:

            1. select `concat` from `'Hello, '`;
            2. invoke it with `name` and `'!'`;
            3. pass the resulting string to `print`.

            Without grouping, an unwrapped call owns the remainder of its logical
            expression. Terrane therefore rejects ambiguous ungrouped nested invocation
            rather than guessing where one argument list ends.

            Parentheses can also make a member call's result one operand in a larger
            expression:
        - type: example
          id: legacy-fence-050
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            long-enough = (prefix.concat; suffix).length >= 8
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Or one argument among several:
        - type: example
          id: legacy-fence-051
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; 'Message: ', (prefix.concat; suffix), ' ready'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Grouping does not itself invoke anything. The semicolon remains the call marker
            inside the parentheses.
      sections:
        - id: nested-calls-and-parentheses-passing-a-callable-is-not-calling-it
          title: Passing a callable is not calling it
          blocks:
            - type: markdown
              markdown: |-
                A bare name refers to its object and never invokes through adjacency:
            - type: example
              id: legacy-fence-052
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                handler = render
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Here, `render` is passed or stored as an object. To invoke it, write:
            - type: example
              id: legacy-fence-053
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                result = render; report
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                To invoke it inside another call, group it:
            - type: example
              id: legacy-fence-054
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                print; (render; report)
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Function values become a practical tool in Chapter 4. For now, notice that the
                source always shows whether a callable is merely selected or actually invoked.
          sections: []
    - id: comments-and-readable-layout
      title: Comments and readable layout
      blocks:
        - type: markdown
          markdown: |-
            A `#` begins a line comment:
        - type: example
          id: legacy-fence-055
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            # Calculate the remaining budget.
            remaining = budget - total
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A comment may also follow source on the same line:
        - type: example
          id: legacy-fence-056
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            spare-bottles = 1      # One bottle for the guide.
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Terrane also recognizes `//` line comments and `/* ... */` block comments, which
            can be useful around projected or native-adjacent source. Ordinary Terrane
            examples prefer `#` because it is visually light and does not resemble an
            arithmetic operator. Python readers may be relieved to see actual block
            comments. No string literals were harmed in the making of this paragraph.

            Comments should explain information the code cannot state economically. This
            adds useful context:
        - type: example
          id: legacy-fence-057
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            # The venue charges in whole credits; no fractional currency is used.
            unit-price = 8
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This merely repeats the expression:
        - type: example
          id: legacy-fence-058
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            unit-price = 8         # Set unit-price to 8.
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Names and layout should carry most local meaning.
      sections:
        - id: comments-and-readable-layout-indentation-and-blank-lines
          title: Indentation and blank lines
          blocks:
            - type: markdown
              markdown: |-
                Indentation defines blocks. Within one block, align sibling statements:
            - type: example
              id: legacy-fence-059
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                function main;
                  subtotal = 24
                  discount = 2
                  total = subtotal - discount
                  print; total
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Blank lines do not create scope. They separate conceptual stages for readers:
            - type: example
              id: legacy-fence-060
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                subtotal = unit-price * quantity
                total = subtotal - discount

                within-budget = total <= budget

                print; 'Total: ', total
                print; 'Within budget: ', within-budget
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Use compact groups where statements belong together and one blank line where the
                program changes subject. Excess vertical space can obscure relationships just as
                surely as a wall of uninterrupted source.
          sections: []
    - id: everything-is-an-object-semantically
      title: Everything is an object—semantically
      blocks:
        - type: markdown
          markdown: |-
            Numbers, booleans, strings, functions, methods, classes, namespaces,
            collections, errors, and tasks are all objects in Terrane's source-language
            model.

            That statement explains why the same surface ideas recur:

            - a name resolves to an object;
            - `.` selects an object's member;
            - `;` invokes an object's default behavior;
            - objects participate in typed protocols.

            An integer can therefore expose arithmetic behavior, a string can expose
            `length` and `concat`, and a function can be selected, passed, or invoked.

            “Everything is an object” does **not** mean every value is heap allocated, boxed
            into one universal representation, or dispatched through a runtime method table.
            The compiler may lower:
        - type: example
          id: legacy-fence-061
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            answer = 42
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            to an ordinary native integer representation when that preserves all observable
            behavior.

            The object model describes what source code can observe. Runtime representation
            is an optimization and lowering decision. Keeping those levels separate lets
            Terrane provide a uniform language without charging every value for machinery it
            does not need.

            Chapter 9 uses this model to introduce user-defined classes, interfaces, and
            traits. The everyday lesson is simpler: built-in values are not second-class
            exceptions to member and call syntax.
      sections: []
    - id: why-terrane-why-calls-use-semicolon
      title: "Why Terrane: why calls use `;`"
      blocks:
        - type: markdown
          markdown: |-
            Many languages call a function with parentheses:
        - type: example
          id: legacy-fence-062
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print(message)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Others use whitespace or juxtaposition in some contexts. Terrane gives
            invocation its own marker:
        - type: example
          id: legacy-fence-063
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; message
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This choice serves three related goals.

            First, it separates **referring to an object** from **invoking it**:
        - type: example
          id: legacy-fence-064
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            operation = render          # keep the callable object
            result = render; report     # invoke it
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            There is no special exception for zero arguments. `refresh` selects an object;
            `refresh;` invokes it.

            Second, it leaves the common argument list visually open:
        - type: example
          id: legacy-fence-065
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; 'Total: ', total, ' credits'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Most calls need no enclosing punctuation around the whole list.

            Third, it composes with member selection using one stable reading order:
        - type: example
          id: legacy-fence-066
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            text.trim;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Dot selects `trim`; semicolon invokes the selected object.

            The tradeoff is also explicit. Because a trailing call owns the rest of its
            logical expression, nested calls require parentheses:
        - type: example
          id: legacy-fence-067
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; (render; report)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            That is not accidental ceremony. It marks the boundary that an outer pair of
            mandatory call parentheses would have supplied in another language.

            The aim is not to make Terrane look unusual for its own sake. It is to keep
            selection, passing, and invocation distinct while allowing frequent calls to
            remain light. A good Terrane expression should be readable with one mechanical
            rule:

            > Names and dots select objects; semicolons invoke them; parentheses delimit
            > nesting.

            We will keep testing that rule as calls grow more capable in later chapters.
      sections: []
    - id: project-calculate-a-small-purchase
      title: "Project: calculate a small purchase"
      blocks:
        - type: markdown
          markdown: |-
            We can now revisit the packing-style arithmetic from Chapter 1 with a slightly
            richer program. Create `everyday-expressions.trn`:
        - type: example
          id: legacy-fence-068
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            namespace everyday-expressions

            function main;
              item = 'notebook'
              unit-price = 8
              quantity = 3
              subtotal = unit-price * quantity
              discount = 2
              total = subtotal - discount
              budget = 25
              within-budget = total <= budget

              summary = 'Item: '.concat; item, ', total: ', total
              print; summary
              print; 'Within budget: ', within-budget
              print; 'Characters in item: ', item.length

              remaining = budget
              remaining = remaining - total
              print; 'Budget remaining: ', remaining
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Run it:
        - type: example
          id: legacy-fence-069
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane run everyday-expressions.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            It prints:
        - type: example
          id: legacy-fence-070
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            Item: notebook, total: 22
            Within budget: true
            Characters in item: 8
            Budget remaining: 3
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The program separates its work into three stages.

            First, it binds the inputs and computes derived values:
        - type: example
          id: legacy-fence-071
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            subtotal = unit-price * quantity
            discount = 2
            total = subtotal - discount
            budget = 25
            within-budget = total <= budget
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Second, it selects the string's `concat` method and calls it to build a summary:
        - type: example
          id: legacy-fence-072
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            summary = 'Item: '.concat; item, ', total: ', total
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Third, it selects properties, calls `print`, and updates a binding:
        - type: example
          id: legacy-fence-073
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; 'Characters in item: ', item.length
            remaining = budget
            remaining = remaining - total
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            No explicit type annotation was needed, but every operation was checked against
            the inferred value types. The code also contains no import lines: `print` and
            type construction vocabulary are available without them, while this program does
            not yet use an operational collection facility.
      sections: []
    - id: exercises
      title: Exercises
      blocks:
        - type: markdown
          markdown: |-
            1. Change `item`, `unit-price`, `quantity`, `discount`, and `budget`. Predict
               every output line before running the program.

            2. Add `tax = 2` and include it in `total`. Use parentheses if they make the
               calculation's stages clearer.

            3. Add `exact-budget = total == budget` and print it. Then change the budget so
               the result flips.

            4. Build the summary directly inside `print` instead of assigning it to
               `summary`. Remember to delimit the nested `concat` call.

            5. Print the length of a different Unicode string. Chapter 5 will explain
               grapheme-aware length in detail; for now, compare your expectation with the
               observed result.

            6. Introduce the mixed expression `7.5 * 3` and read the diagnostic. Replace it
               with a consistently typed calculation rather than trying to silence the
               error.

            7. Add comments explaining one genuine domain decision. Remove any comment that
               only repeats the source beside it.
      sections: []
    - id: what-we-learned
      title: What we learned
      blocks:
        - type: markdown
          markdown: |-
            Terrane programs compute with typed values even when local annotations are
            inferred. Whole numbers use exact `int` semantics, decimal values use the
            default floating type without another context, booleans are `true` or `false`,
            and strings hold Unicode text.

            A bare assignment introduces a binding when its name is unresolved and updates
            an existing mutable binding when one is already visible. Arithmetic combines
            compatible numeric values; comparisons produce booleans. Parentheses override
            precedence and communicate grouping.

            Member access and invocation remain separate:
        - type: example
          id: legacy-fence-074
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            item.length                  # select a property
            item.concat; ' case'         # select and invoke a method
            print; item                  # invoke a function object
            print; (render; report)      # delimit a nested call
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Everything participates in one semantic object model, but the compiler remains
            free to use specialized native representations. The explicit semicolon keeps
            object selection, callable passing, and invocation visibly distinct.

            In the next chapter, we will use boolean expressions to choose work with `if`,
            repeat work with `while` and `for`, control loops with `break` and `continue`,
            and build a complete number classifier.
      sections: []
