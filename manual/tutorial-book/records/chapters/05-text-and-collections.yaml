format: 1
id: book.text-and-collections
kind: chapter
surface: null
lifecycle:
  status: current
  stability: experimental
  since: "0.1"
  deprecated-since: null
  removed-in: null
  replacement: null
documentation:
  status: complete
  title: Text and Collections
  title-style: text
  summary: |-
    Programs become useful when they can work with more than one isolated value. Text contains characters and words. A list
    preserves a sequence. A map associates keys with values. Iteration lets functions process those structures without
    knowing their runtime representation.
  tags: []
  blocks:
    - type: markdown
      markdown: |-
        Terrane treats these as ordinary typed objects with value semantics. Assignment
        gives the destination an independent logical value, while the compiler and
        runtime may share backing storage until a mutation requires separation. The
        programmer gets predictable behavior without demanding an eager deep copy after
        every assignment.

        In this chapter, we will:

        - write quoted, tail, and block text;
        - use common string operations;
        - understand bytes, Unicode scalars, and grapheme clusters;
        - create, index, append to, and iterate over lists;
        - create, update, look up, and iterate over maps;
        - build collections from existing values;
        - choose a collection that matches the program's question;
        - observe ordinary copy-on-write value behavior;
        - build a small word-frequency program.

        The examples use `string`, `list`, and `map`. Chapter 10 will examine their type
        relationships more formally; here, we will use their everyday behavior.
  sections:
    - id: quoted-tail-and-block-text
      title: Quoted, tail, and block text
      blocks:
        - type: markdown
          markdown: |-
            The quoted strings used so far are ideal for short text:
        - type: example
          id: legacy-fence-001
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            greeting = 'Hello, Terrane!'
            empty = ''
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A quoted string begins and ends with `'`. Escape sequences represent characters
            that would otherwise interfere with the literal:
        - type: example
          id: legacy-fence-002
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            apostrophe = 'It\'s ready.'
            path = 'one\\two'
            lines = 'first\nsecond'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The source spelling and resulting text are not always identical. `\'`
            contributes one apostrophe, `\\` contributes one backslash, and `\n` contributes
            a newline.

            Terrane also provides text forms that avoid escape punctuation when the source
            already has the shape we want.
      sections:
        - id: quoted-tail-and-block-text-tail-text
          title: Tail text
          blocks:
            - type: markdown
              markdown: |-
                `>` captures the rest of the logical line as text:
            - type: example
              id: legacy-fence-003
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                message = >This text continues to the end of the line.
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The literal needs no closing delimiter. Its content begins immediately after `>`
                and ends at the logical newline. Because `return` begins a result expression,
                `return >ready` returns tail text directly.

                Tail text is useful for shell fragments, regular expressions, templates, or
                punctuation-heavy examples:
            - type: example
              id: legacy-fence-004
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                pattern = >^[a-z][a-z0-9-]*$
                example = >Call with: render; report
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Backslashes and quotes are ordinary content in tail text. Because the rest of
                the line belongs to the literal, nothing after it is parsed as Terrane source.

                Use quoted text when the closing boundary helps a larger expression:
            - type: example
              id: legacy-fence-005
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                message = 'Hello'.concat; ', ', name
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Use tail text when the remainder of one line is simply the text itself.
          sections: []
        - id: quoted-tail-and-block-text-block-text
          title: Block text
          blocks:
            - type: markdown
              markdown: |-
                `>>` introduces an indented block of literal text:
            - type: example
              id: legacy-fence-006
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                message = >>
                  First line
                  Second line
                  Third line
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The common structural indentation is removed. The content is therefore:
            - type: example
              id: legacy-fence-007
              title: null
              language: text
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                First line
                Second line
                Third line
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                No implicit final newline is added. A blank content line remains a blank line,
                while dedenting to the surrounding source indentation ends the block.

                Inside a function, the source structure remains visible:
            - type: example
              id: legacy-fence-008
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                function main;
                  message = >>
                    Packing report
                    --------------
                    Ready to leave
                  print; message
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The content lines are indented farther than the assignment because they belong
                to the block literal. The same rule permits `return >>` followed by an indented
                text block. `print` returns to the function body's indentation and is therefore
                ordinary Terrane source again.

                Block text is useful for messages, test inputs, generated configuration, and
                small templates. It should not become a hiding place for another language when a
                structured Terrane representation would be clearer.
          sections: []
        - id: quoted-tail-and-block-text-choose-the-form-that-removes-noise
          title: Choose the form that removes noise
          blocks:
            - type: markdown
              markdown: |-
                These forms produce text through different source boundaries:
            - type: table
              id: null
              title: null
              show-header: true
              columns:
                - id: form
                  title: Form
                  cell: markdown
                - id: best-fit
                  title: Best fit
                  cell: markdown
              rows:
                - form: "`'quoted text'`"
                  best-fit: short text embedded in an expression
                - form: "`>tail text`"
                  best-fit: punctuation-heavy remainder of one line
                - form: "`>>` block"
                  best-fit: multiline text whose layout matters
            - type: markdown
              markdown: |-
                Choose the form that lets the reader see the content rather than the escaping
                mechanism.
          sections: []
    - id: common-string-operations
      title: Common string operations
      blocks:
        - type: markdown
          markdown: |-
            A `string` is a Unicode text value. Its members provide common transformations
            and questions.
      sections:
        - id: common-string-operations-concatenation-and-joining
          title: Concatenation and joining
          blocks:
            - type: markdown
              markdown: |-
                `concat` appends the canonical display of each argument to the receiver:
            - type: example
              id: legacy-fence-009
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                name = 'Ada'
                message = 'Hello, '.concat; name, '!'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The result is:
            - type: example
              id: legacy-fence-010
              title: null
              language: text
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                Hello, Ada!
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                `join` places the receiver between supplied values:
            - type: example
              id: legacy-fence-011
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                line = ', '.join; 'red', 'green', 'blue'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The result is:
            - type: example
              id: legacy-fence-012
              title: null
              language: text
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                red, green, blue
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Use `concat` when one string grows around adjoining pieces. Use `join` when one
                separator belongs between a sequence of values.

                Both operations produce new strings. They do not mutate the receiver:
            - type: example
              id: legacy-fence-013
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                prefix = 'Hello'
                message = prefix.concat; ', world'
                print; prefix
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                `prefix` still contains `Hello`.
          sections: []
        - id: common-string-operations-case-trimming-searching-and-replacing
          title: Case, trimming, searching, and replacing
          blocks:
            - type: markdown
              markdown: |-
                Common method families include:
            - type: example
              id: legacy-fence-014
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                lower = text.lower;
                upper = text.upper;
                trimmed = text.trim;
                has-word = text.contains; 'Terrane'
                changed = text.replace; 'old', 'new'
                parts = text.split; ','
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Case conversion follows Unicode-aware behavior. `trim` removes the text
                operation's defined surrounding whitespace. `contains` answers a boolean
                question. `replace` and `split` produce new values. The read-only list returned
                by `split` preserves source order and can be traversed directly:
            - type: example
              id: legacy-fence-015
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                for part in parts
                  print; part
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Method families may later expose policy variants as child members. The ordinary
                spelling chooses the family's default behavior:
            - type: example
              id: legacy-fence-016
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                text.lower;
                text.trim;
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Later chapters examine member families and protocol contracts directly. For now,
                use the default operation whose name states the intended text transformation.
          sections: []
        - id: common-string-operations-length
          title: Length
          blocks:
            - type: markdown
              markdown: |-
                A string's default `length` counts grapheme clusters:
            - type: example
              id: legacy-fence-017
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                print; 'notebook'.length       # 8
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                A grapheme cluster corresponds closely to what a user perceives as one
                character. That default makes text length useful for interfaces, labels, and
                human-facing limits rather than exposing an encoding detail accidentally.

                When bytes or Unicode scalar values are the real subject, request those views
                explicitly.
          sections: []
    - id: bytes-unicode-scalars-and-grapheme-clusters
      title: Bytes, Unicode scalars, and grapheme clusters
      blocks:
        - type: markdown
          markdown: |-
            The word “character” can mean several different things in software.

            Consider `é`. It may be represented as one precomposed Unicode scalar, or as the
            scalar `e` followed by a combining acute accent. Those spellings can look
            identical to a person while containing different scalar sequences and byte
            sequences.

            Terrane therefore gives text three explicit views:
        - type: example
          id: legacy-fence-018
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            text.bytes
            text.scalars
            text.graphemes
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            - `bytes` exposes the UTF-8 encoded bytes;
            - `scalars` exposes Unicode scalar values;
            - `graphemes` exposes user-perceived text elements.

            The default string operations are grapheme-oriented where a character boundary
            matters. Iterating a string follows its grapheme view:
        - type: example
          id: legacy-fence-019
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            for character in text
              print; character
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This keeps a combining sequence together as one item.
      sections:
        - id: bytes-unicode-scalars-and-grapheme-clusters-ask-the-question-at-the-right-level
          title: Ask the question at the right level
          blocks:
            - type: markdown
              markdown: |-
                Use bytes when implementing an encoded format, checksum, transport, or native
                boundary:
            - type: example
              id: legacy-fence-020
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                encoded = text.bytes
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Use scalars when the algorithm is defined in Unicode code points:
            - type: example
              id: legacy-fence-021
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                for scalar in text.scalars
                  print; scalar
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Use graphemes for user-facing editing and iteration:
            - type: example
              id: legacy-fence-022
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                for character in text.graphemes
                  print; character
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                And use the string directly when its default grapheme iteration is what you
                mean:
            - type: example
              id: legacy-fence-023
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                for character in text
                  print; character
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The explicit views prevent byte length, scalar count, and visible-character
                count from being mistaken for interchangeable answers.
          sections: []
        - id: bytes-unicode-scalars-and-grapheme-clusters-indexing-binary-data
          title: Indexing binary data
          blocks:
            - type: markdown
              markdown: |-
                Index a byte sequence with an integer when you need one octet. The result is a
                `uint8`, not a one-character string:
            - type: example
              id: legacy-fence-024
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                first-byte uint8 = encoded[0]
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Use a range object to select bytes. The result remains `bytes`, and the range's
                step and half-open or inclusive end are honored:
            - type: example
              id: legacy-fence-025
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                from /core/collections import range

                header bytes = encoded[range; 0, 4]
                alternating bytes = encoded[range; 0, encoded.length, 2]
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                An invalid selected index throws `index-error`. A range with equal start and end
                at a valid boundary produces empty bytes. Neither operation guesses text
                boundaries; decode explicitly when the selected bytes are meant to be text.
          sections: []
        - id: bytes-unicode-scalars-and-grapheme-clusters-encoding-is-a-boundary
          title: Encoding is a boundary
          blocks:
            - type: markdown
              markdown: |-
                A string is Unicode text, while `bytes` is binary data. Crossing between them
                requires an encoding policy:
            - type: example
              id: legacy-fence-026
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                encoded = text.encode; utf8
                decoded = encoded.decode; utf8
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                `utf8` is available from the default prelude. Decoding validates the bytes
                rather than silently manufacturing text from invalid input.

                This separation is why strings are not arbitrary byte bags. Text algorithms can
                operate on text guarantees, while binary protocols remain free to contain any
                byte values.
          sections: []
    - id: creating-lists
      title: Creating lists
      blocks:
        - type: markdown
          markdown: |-
            A list stores an ordered sequence of values. Import its constructor from
            `/core/collections`:
        - type: example
          id: legacy-fence-027
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /core/collections import list
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Create a populated list by calling `list`:
        - type: example
          id: legacy-fence-028
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            colours = list; 'red', 'green', 'blue'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The compiler infers `list of string` because every supplied item is a string.

            An empty list needs an annotation to say what it will contain:
        - type: example
          id: legacy-fence-029
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            colours list of string = list
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Without an item, the constructor alone cannot infer the intended element type.

            Lists preserve order and allow duplicates:
        - type: example
          id: legacy-fence-030
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            votes = list; 'red', 'blue', 'red'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Their `length` property reports the number of elements:
        - type: example
          id: legacy-fence-031
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; votes.length       # 3
          response: null
          diagnostic: null
          markdown: null
      sections:
        - id: creating-lists-indexing
          title: Indexing
          blocks:
            - type: markdown
              markdown: |-
                List indices begin at zero:
            - type: example
              id: legacy-fence-032
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                colours = list; 'red', 'green', 'blue'
                print; colours[0]         # red
                print; colours[2]         # blue
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Ordinary indexing requires a valid index. An invalid index raises an
                `index-error`; it does not return a fabricated default value.

                When absence is expected, use the checked lookup family:
            - type: example
              id: legacy-fence-033
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                possible = colours.get.checked; 10
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The result is the item or `none`. Chapter 10 develops unions and narrowing, and
                Chapter 7 develops the error path of required lookups.
          sections: []
        - id: creating-lists-appending-and-replacing
          title: Appending and replacing
          blocks:
            - type: markdown
              markdown: |-
                Append a value with:
            - type: example
              id: legacy-fence-034
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                colours.append; 'yellow'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Replace an element through indexed assignment:
            - type: example
              id: legacy-fence-035
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                colours[1] = 'emerald'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                or through the explicit method:
            - type: example
              id: legacy-fence-036
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                colours.set; 1, 'emerald'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                All inserted values must satisfy the list's element type. A `list of string`
                cannot accept an integer simply because one call attempts it.

                These operations are observable mutations of the list binding, but they retain
                Terrane's ordinary value semantics when the list has previously been assigned
                elsewhere. We will examine that shortly.
          sections: []
    - id: iterating-over-lists
      title: Iterating over lists
      blocks:
        - type: markdown
          markdown: |-
            A list is iterable:
        - type: example
          id: legacy-fence-037
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            for colour in colours
              print; colour
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Items arrive in list order. The loop target is an ordinary local value;
            assigning to it does not replace the corresponding list element.

            To build a transformed list, make the destination explicit:
        - type: example
          id: legacy-fence-038
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            names = list; 'ada', 'grace', 'barbara'
            upper-names list of string = list

            for name in names
              upper-names.append; (name.upper;)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Now `upper-names` contains the uppercase strings while `names` remains
            unchanged.

            This is intentionally direct. The source identifies:

            - the input collection;
            - the operation applied to each item;
            - the destination collection;
            - the order in which results are appended.

            Later library abstractions may package common transforms, but an ordinary loop
            is not a second-class or inherently interpreted fallback. It lowers through the
            native compiler pipeline.
      sections:
        - id: iterating-over-lists-iteration-observes-a-snapshot
          title: Iteration observes a snapshot
          blocks:
            - type: markdown
              markdown: |-
                A collection loop iterates a snapshot taken when the loop begins. Mutating the
                original binding inside the body does not alter the sequence already being
                visited:
            - type: example
              id: legacy-fence-039
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                values = list; 1, 2, 3
                for value in values
                  values.append; value + 10
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The loop visits the original three items, then ends. `values` contains six items
                afterward. It does not chase the newly appended tail forever.

                Snapshot iteration makes mutation during traversal deterministic, though
                building a separate result list is often clearer when transformation is the
                goal.
          sections: []
        - id: iterating-over-lists-sorting-a-list
          title: Sorting a list
          blocks:
            - type: markdown
              markdown: |-
                For integer, floating, or string lists, `sort` changes the list into stable
                ascending order:
            - type: example
              id: legacy-fence-040
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                priorities = list; 3, 1, 2
                priorities.sort;
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Use the explicit child spelling for descending order:
            - type: example
              id: legacy-fence-041
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                priorities.sort.descending;
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Both forms return the resulting list as well as mutating the receiver, so a
                sorted view can be captured in an expression. Equal values retain their input
                order. Floating NaNs remain after every non-NaN value in either direction, and
                signed zeros retain their relative order.
          sections: []
    - id: creating-and-updating-maps
      title: Creating and updating maps
      blocks:
        - type: markdown
          markdown: |-
            A map associates unique keys with values and preserves insertion order. Import
            its constructor:
        - type: example
          id: legacy-fence-042
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            from /core/collections import map
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A convenient constructor form uses identifier-like string keys:
        - type: example
          id: legacy-fence-043
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            counts = map; red = 2, blue = 3
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This creates the string keys `'red'` and `'blue'`.

            For an empty map, state both key and value types:
        - type: example
          id: legacy-fence-044
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            counts map of string, int = map
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Insert or replace a value with `set`:
        - type: example
          id: legacy-fence-045
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            counts.set; 'red', 2
            counts.set; 'blue-green', 1
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `set` accepts arbitrary values satisfying the map's key and value types, so it
            is not limited to identifier-like text keys.
      sections:
        - id: creating-and-updating-maps-looking-up-a-value
          title: Looking up a value
          blocks:
            - type: markdown
              markdown: |-
                Index with a key when the key is required to exist:
            - type: example
              id: legacy-fence-046
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                print; counts['red']
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                A missing required key raises `missing-key` rather than returning an unrelated
                default.

                Use checked lookup when absence is an expected outcome:
            - type: example
              id: legacy-fence-047
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                possible = counts.get.checked; 'violet'
                if possible == none
                  print; 'No violet count'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                This makes the policy visible at the call site: ordinary indexing requires the
                item, while `get.checked` admits absence as data.
          sections: []
        - id: creating-and-updating-maps-removing-a-key
          title: Removing a key
          blocks:
            - type: markdown
              markdown: |-
                Default removal requires the key and returns its former value:
            - type: example
              id: legacy-fence-048
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                removed-count = counts.remove; 'red'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                If the key is absent, this spelling raises `missing-key`. Use checked removal
                when absence is an ordinary outcome:
            - type: example
              id: legacy-fence-049
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                removed-count = counts.remove.checked; 'violet'
                if removed-count == none
                  print; 'Nothing removed'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Removing a key from `map` preserves the relative insertion order of every
                remaining entry. Reinserting the removed key later places it at the end.
          sections: []
        - id: creating-and-updating-maps-iterating-over-a-map
          title: Iterating over a map
          blocks:
            - type: markdown
              markdown: |-
                A map yields key and value pairs in insertion order:
            - type: example
              id: legacy-fence-050
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                for colour, count in counts
                  print; colour, ': ', count
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Updating an existing key changes its value without moving it to a new insertion
                position. Adding a new key places it at the end.

                Maps also expose ordered views:
            - type: example
              id: legacy-fence-051
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                keys = counts.keys;
                values = counts.values;
                entries = counts.entries;
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                An entry exposes `.key` and `.value` properties. The paired loop form is usually
                clearest when both are needed immediately.

                Insertion order is a semantic guarantee of `map`, not an accident of one runtime
                hash table. An explicitly unordered map exists for programs whose contract does
                not require order.
          sections: []
    - id: building-collections-from-existing-values
      title: Building collections from existing values
      blocks:
        - type: markdown
          markdown: |-
            Collections often arise from a loop rather than one constructor call.

            We can collect the nonempty words from a string by iterating its graphemes and
            appending completed words:
        - type: example
          id: legacy-fence-052
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            words list of string = list
            current-word = ''

            for character in text
              if character == ' '
                if current-word != ''
                  words.append; current-word
                  current-word = ''
              else
                current-word = current-word.concat; character

            if current-word != ''
              words.append; current-word
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The final `if` handles a word not followed by a space.

            The example deliberately states a small tokenization policy:

            - spaces separate words;
            - repeated spaces do not create empty words;
            - punctuation remains part of a word;
            - Unicode graphemes stay intact.

            A production tokenizer may need richer rules, but those rules should be explicit
            rather than concealed behind the vague instruction “split into words.”
      sections:
        - id: building-collections-from-existing-values-building-ordered-unique-values
          title: Building ordered unique values
          blocks:
            - type: markdown
              markdown: |-
                A list preserves duplicates. To construct a small ordered list of unique words,
                compare each candidate with the values already retained:
            - type: example
              id: legacy-fence-053
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                unique-words list of string = list

                for word in words
                  seen = false
                  for known-word in unique-words
                    if known-word == word
                      seen = true
                  if not seen
                    unique-words.append; word
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                This simple nested loop is not the most efficient uniqueness algorithm for a
                large input, but it makes the policy and insertion order obvious. A `set` is the
                natural scalable collection when membership is the central operation.
          sections: []
        - id: building-collections-from-existing-values-building-a-map-from-calculated-pairs
          title: Building a map from calculated pairs
          blocks:
            - type: markdown
              markdown: |-
                Once we have unique words, we can count each one and store the result:
            - type: example
              id: legacy-fence-054
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                counts map of string, int = map

                for unique-word in unique-words
                  count = 0
                  for word in words
                    if word == unique-word
                      count++
                  counts.set; unique-word, count
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The outer loop determines insertion order. The inner loop calculates the value
                associated with each key. The map then provides keyed lookup and ordered
                reporting.

                This version favors visible steps over an optimized counting strategy. The
                project at the end of the chapter uses it because every operation has already
                been introduced. The next section shows how checked lookup can reduce repeated
                work while preserving the same observable result.
          sections: []
        - id: building-collections-from-existing-values-refactoring-to-one-pass-after-measurement
          title: Refactoring to one pass after measurement
          blocks:
            - type: markdown
              markdown: |-
                For a larger input, the repeated scans may become the dominant cost. The map can
                answer the same question while each word is visited:
            - type: example
              id: legacy-fence-055
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                counts map of string, int = map

                for word in words
                  current = counts.get.checked; word
                  if current != none
                    counts.set; word, current + 1
                  else
                    counts.set; word, 1
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                `get.checked` makes a missing first occurrence ordinary: it returns `none`
                rather than throwing. In the first branch, the check has refined `current` to
                `int`, so arithmetic is valid. Updating an existing key retains its insertion
                position, and inserting a new key records its first-seen position. The one-pass
                form therefore preserves the report's order while avoiding the nested counting
                scans.

                This is a refactoring, not an automatic replacement for the transparent version.
                Begin with the form that makes the intended result easy to verify, measure the
                relevant workload, then choose the more direct collection operation when the
                difference matters.
          sections: []
    - id: choosing-the-right-collection
      title: Choosing the right collection
      blocks:
        - type: markdown
          markdown: |-
            Choose a collection according to the question the program asks.
      sections:
        - id: choosing-the-right-collection-list-sequence-and-position
          title: "List: sequence and position"
          blocks:
            - type: markdown
              markdown: |-
                Use a list when order, position, or duplicates matter:
            - type: example
              id: legacy-fence-056
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                steps = list; 'measure', 'cut', 'assemble'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Questions include:

                - What is the next item?
                - What is at index two?
                - In what order should these values be processed?
          sections: []
        - id: choosing-the-right-collection-map-association-by-key
          title: "Map: association by key"
          blocks:
            - type: markdown
              markdown: |-
                Use a map when one value is retrieved or updated by another value:
            - type: example
              id: legacy-fence-057
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                scores map of string, int = map
                scores.set; 'Ada', 10
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Questions include:

                - What score belongs to this name?
                - Has this key received a value?
                - Which key-value pairs should be reported?
          sections: []
        - id: choosing-the-right-collection-set-membership-and-uniqueness
          title: "Set: membership and uniqueness"
          blocks:
            - type: markdown
              markdown: |-
                Use a set when membership is the primary question and duplicates have no
                meaning:
            - type: example
              id: legacy-fence-058
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                from /core/collections import set
                seen set of string = set
                seen.add; 'red'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Questions include:

                - Have we seen this value?
                - Which distinct values occur?
                - Should this value be added or removed?
          sections: []
        - id: choosing-the-right-collection-tuple-fixed-position-and-shape
          title: "Tuple: fixed position and shape"
          blocks:
            - type: markdown
              markdown: |-
                Use a tuple when a small, fixed set of positions forms one value:
            - type: example
              id: legacy-fence-059
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                coordinate = (3, 5)
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                A tuple is not a list whose length happens to remain unchanged. Its fixed
                positional shape is part of its type.
          sections: []
        - id: choosing-the-right-collection-prefer-the-narrowest-honest-meaning
          title: Prefer the narrowest honest meaning
          blocks:
            - type: markdown
              markdown: |-
                A map with integer keys can imitate a list, and a list can be repeatedly scanned
                to imitate a map or set. Choose the collection whose operations state the domain
                directly. Doing so gives both readers and the compiler better information.
          sections: []
    - id: assignment-and-copy-on-write-value-behavior
      title: Assignment and copy-on-write value behavior
      blocks:
        - type: markdown
          markdown: |-
            Terrane assignment gives the destination an independent logical value:
        - type: example
          id: legacy-fence-060
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            original = list; 'red', 'green'
            copy = original
            copy.append; 'blue'

            print; original.length       # 2
            print; copy.length           # 3
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Mutating `copy` does not mutate `original`.

            The same rule applies to maps:
        - type: example
          id: legacy-fence-061
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            original = map; red = 1
            copy = original
            copy.set; 'blue', 2

            print; original.length       # 1
            print; copy.length           # 2
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This is value behavior. It does not require the runtime to eagerly duplicate
            every element at assignment. Terrane may let both values share backing storage
            while neither changes. The first relevant mutation separates the changed value
            through copy-on-write.

            The optimization is intentionally unobservable. Source code can rely on
            independence, not on whether a particular assignment allocated.
      sections:
        - id: assignment-and-copy-on-write-value-behavior-iteration-follows-the-same-model
          title: Iteration follows the same model
          blocks:
            - type: markdown
              markdown: |-
                Because a `for` loop observes a collection snapshot, later mutation of the
                original binding cannot retroactively alter the items already selected for that
                traversal. Value semantics and snapshot iteration reinforce the same principle:
                a local operation should not acquire surprising shared effects merely because
                storage was optimized underneath it.

                When shared changing identity is the actual model, Chapter 11 introduces
                explicit references. Ordinary collections do not smuggle that identity through
                assignment.
          sections: []
    - id: why-terrane-values-without-accidental-aliasing
      title: "Why Terrane: values without accidental aliasing"
      blocks:
        - type: markdown
          markdown: |-
            Mutable collections are convenient. Shared storage is efficient. Combining them
            carelessly creates one of programming's most persistent surprises: changing one
            apparently local value changes another distant value because both names secretly
            refer to the same mutable object.

            Terrane separates the source contract from the storage optimization.

            At the source level:
        - type: example
          id: legacy-fence-062
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            second = first
            second.append; value
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            means that `second` may change while `first` retains its value.

            Underneath, the compiler may use shared backing storage and copy-on-write to
            avoid unnecessary eager duplication. If analysis proves a sequence of mutations
            uniquely owned, it may establish uniqueness once and lower the operations
            directly. The runtime representation is free to become efficient; the visible
            value behavior remains stable.

            This gives ordinary code a useful default:

            - assignment does not create accidental shared mutation;
            - functions receive values rather than hidden aliases;
            - collection traversal observes a stable snapshot;
            - deliberate shared identity remains expressible through explicit reference
              types later.

            The principle is not that mutation is bad. Lists and maps are designed to
            change. The principle is that **mutation should affect the value the source
            visibly names**, unless the program explicitly chooses a shared identity model.

            This is also a performance contract worth inspecting rather than trusting
            blindly. Chapter 13 will show generated Rust, and later performance work will
            follow collection operations through lowering and runtime support. Value
            semantics describe the required behavior; they do not excuse avoidable copies,
            repeated ownership checks, or hidden allocation.
      sections: []
    - id: project-word-frequency
      title: "Project: word frequency"
      blocks:
        - type: markdown
          markdown: |-
            We will combine text iteration, list construction, ordered uniqueness, and a map
            into a small word-frequency program.

            Create `word-frequency.trn`:
        - type: example
          id: legacy-fence-063
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            namespace word-frequency

            from /core/collections import list, map

            function main;
              text = 'Red blue red green blue blue'.lower;
              words list of string = list
              current-word = ''

              for character in text
                if character == ' '
                  if current-word != ''
                    words.append; current-word
                    current-word = ''
                else
                  current-word = current-word.concat; character

              if current-word != ''
                words.append; current-word

              unique-words list of string = list
              for word in words
                seen = false
                for known-word in unique-words
                  if known-word == word
                    seen = true
                if not seen
                  unique-words.append; word

              counts map of string, int = map
              for unique-word in unique-words
                count = 0
                for word in words
                  if word == unique-word
                    count++
                counts.set; unique-word, count

              print; 'words: ', words.length
              for word, count in counts
                print; word, ': ', count
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Run it:
        - type: example
          id: legacy-fence-064
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane run word-frequency.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            It prints:
        - type: example
          id: legacy-fence-065
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            words: 6
            red: 2
            blue: 3
            green: 1
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The program has four visible stages.

            First, it normalizes case:
        - type: example
          id: legacy-fence-066
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            text = 'Red blue red green blue blue'.lower;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Without that step, `'Red'` and `'red'` would be distinct map keys.

            Second, it tokenizes the string into a list. The loop treats spaces as
            separators and appends each completed nonempty word.

            Third, it builds `unique-words` in first-seen order. This determines the later
            map's insertion order.

            Fourth, it counts each unique word and inserts the pair into `counts`. Map
            iteration then reports the entries in deterministic order.

            This is intentionally a transparent first implementation rather than the fastest
            possible frequency counter. Every pass has a clear job, and the program's output
            policy is easy to inspect. If a larger input makes the nested counting
            expensive, measurement can justify a more direct checked-lookup or set-based
            design. The clear implementation remains a useful reference for testing the
            optimized one.
      sections: []
    - id: terrane-style-make-data-shape-visible
      title: "Terrane style: make data shape visible"
      blocks:
        - type: markdown
          markdown: |-
            A collection declaration should tell the truth about the role of its data:
        - type: example
          id: legacy-fence-067
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            words list of string = list
            counts map of string, int = map
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The annotations are necessary for empty constructors and useful to readers: one
            value is an ordered sequence of words; the other associates words with counts.

            Prefer direct operations whose names preserve that shape:
        - type: example
          id: legacy-fence-068
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            words.append; word
            counts.set; word, count
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Avoid encoding association through matching positions in two unrelated lists
            unless positional correspondence is genuinely the domain model.

            Likewise, request the text view the algorithm means. A user-facing loop should
            not iterate bytes merely because UTF-8 is the storage representation. A binary
            protocol should not pretend arbitrary bytes are a string.

            The recurring question is:

            > What structure and boundary does the program actually mean?

            Choosing the honest text view or collection usually makes the code clearer and
            gives the compiler stronger information at the same time.
      sections: []
    - id: exercises
      title: Exercises
      blocks:
        - type: markdown
          markdown: |-
            1. Write one message using quoted text, tail text, and block text. Compare which
               form makes the content easiest to read.

            2. Create a string containing a composed or combining Unicode character. Compare
               `.length`, `.bytes.length`, `.scalars.length`, and `.graphemes.length`.

            3. Build a `list of string`, append two values, replace one by index, and print
               every item with `for`.

            4. Assign a list to a second binding, mutate the second list, and print both
               lengths. Explain the result in terms of value behavior rather than runtime
               storage.

            5. Create a map of names to integer scores. Update one existing key, add one new
               key, and iterate the final entries. Observe that updating does not change
               insertion position.

            6. Extend the word-frequency program so commas and full stops are separators
               rather than parts of words. Keep the tokenization rule visible in source.

            7. Replace the nested uniqueness scan with a `set of string`, while retaining a
               list if first-seen reporting order remains part of the output contract.

            8. Refactor the word-frequency counter to update `counts` during the first
               traversal of `words` with `get.checked`. Compare its output with the
               transparent multi-pass implementation.
      sections: []
    - id: what-we-learned
      title: What we learned
      blocks:
        - type: markdown
          markdown: |-
            Terrane offers quoted text for short expressions, tail text for the remainder of
            one line, and indented block text for multiline content. Strings provide
            Unicode-aware operations such as concatenation, joining, case conversion,
            trimming, searching, splitting, and replacement.

            Text has distinct byte, scalar, and grapheme views. Default string length and
            iteration follow grapheme boundaries, while encoding and decoding make the
            text/binary boundary explicit.

            Lists preserve ordered elements and duplicates. Maps associate unique keys with
            values and preserve insertion order. Both support mutation while retaining
            ordinary value behavior across assignment. The implementation may use
            copy-on-write storage, but one binding's mutation does not accidentally change
            an independent value.

            Iteration visits a snapshot. Building a destination collection with a direct
            loop keeps transformations and ordering visible, while choosing list, map, set,
            or tuple according to the program's actual question prevents representation
            tricks from becoming domain design.

            In the next chapter, we will combine these values with functions and control
            flow in a complete in-memory reporting tool, beginning from a user story and
            keeping validation, calculation, and presentation distinct.
      sections: []
  see-also: []
