documentation:
  status: complete
  title: How Terrane Becomes a Native Program
  title-style: text
  summary: |-
    Chapter 12 ended with a Terrane source file and a running concurrent program. Between those two facts lies a complete
    native compilation pipeline.
  tags: []
  blocks:
    - type: markdown
      markdown: |-
        That pipeline is not intended to be a sealed box. Terrane source is the
        program's contract, but generated Rust is a public debugging surface. You can
        inspect it when behavior is surprising, when a compiler diagnostic needs more
        context, or when measurement says an operation costs more than the source
        suggests.

        In this chapter, we will follow one small program from source to executable. We
        will:

        - identify the stages in the compiler pipeline;
        - distinguish syntax from the resolved semantic model;
        - emit and read generated Rust;
        - connect source operations to generated locations;
        - build development and release artifacts;
        - examine what optimization may erase;
        - debug at the Terrane level first and descend only as far as the question
          requires.

        The goal is not to teach Rust in one chapter. It is to make the path beneath
        Terrane visible and navigable.
  sections:
    - id: from-terrane-source-to-an-executable
      title: From Terrane source to an executable
      blocks:
        - type: markdown
          markdown: |-
            Begin with a deliberately small program:
        - type: example
          id: legacy-fence-001
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            namespace native-path

            function twice int64; value int64
              return value * 2

            function main;
              input int64 = 21
              result int64 = twice; input
              print; 'result: ', result
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Running it produces:
        - type: example
          id: legacy-fence-002
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            result: 42
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            We can summarize the route to that output as:
        - type: example
          id: legacy-fence-003
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            Terrane source
              -> tokens and syntax
              -> resolved semantic model
              -> typed semantic representation
              -> Rust-oriented lowering
              -> generated Rust and Cargo inputs
              -> rustc
              -> native executable
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Each stage answers a different question.

            The lexer and parser determine what the source says structurally: where
            declarations begin, which operands belong to an expression, and whether
            indentation is valid. Namespace and binding resolution determine which object
            each name denotes. Semantic analysis determines types, calls, ownership,
            effects, and control flow. Lowering chooses Rust operations and representations
            that preserve those meanings. Cargo and `rustc` finally produce the machine
            artifact.

            The ordinary commands from Chapter 8 all use this one pipeline:
        - type: example
          id: legacy-fence-004
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane check native-path.trn
            terrane rust native-path.trn
            terrane build native-path.trn
            terrane run native-path.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            They do not invoke four separate interpretations of the language.

            - `check` validates Terrane and compiles the generated Rust without retaining a
              runnable program as its result.
            - `rust` stops after emitting the readable lowered representation.
            - `build` creates a native executable and prints its path.
            - `run` builds as needed and executes the result.

            That shared path matters. A program accepted by `check` is checked against the
            same lowering used by `build`; `run` is not a convenient interpreter with subtly
            different behavior.
      sections: []
    - id: the-semantic-model-between-source-and-rust
      title: The semantic model between source and Rust
      blocks:
        - type: markdown
          markdown: |-
            Generated Rust is not a transliteration of punctuation. Before lowering, the
            compiler has resolved what every meaningful source operation denotes.

            For our expression:
        - type: example
          id: legacy-fence-005
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            result int64 = twice; input
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            the compiler knows at least that:

            - `result` declares a local binding;
            - its contract is `int64`;
            - `twice` resolves to the function in namespace `native-path`;
            - `;` invokes that function's default callable behavior;
            - `input` supplies one `int64` argument;
            - the call returns `int64`;
            - assignment initializes `result` with ordinary value semantics.

            The semantic model also records facts that may leave little visible trace in
            Rust: which imported identity a name resolved to, whether a call may throw,
            whether a value was copied or moved, which branch refined a union, and which
            source span caused a generated operation.

            That intermediate model is compiler machinery, not another language users must
            write. Its purpose is to prevent lowering from guessing from source text. Two
            identical spellings in different scopes may resolve to different declarations.
            Two different source forms may resolve to the same semantic operation. A
            reference, a task handle, and an ordinary value may all be assigned with similar
            punctuation while carrying different ownership consequences.

            This is why compiler errors should usually speak in Terrane terms. If an
            ownership check proves that a binding is unavailable after a move, the useful
            explanation names the moved binding and the consuming source operation—not an
            internal Rust temporary.
      sections: []
    - id: reading-generated-rust
      title: Reading generated Rust
      blocks:
        - type: markdown
          markdown: |-
            Ask the compiler to write the lowered program and its support sidecar:
        - type: example
          id: legacy-fence-006
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane rust --output native-path.rs native-path.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The command writes:
        - type: example
          id: legacy-fence-007
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            native-path.rs
            native-path.support.rs
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The main file for this program is compact:
        - type: example
          id: legacy-fence-008
          title: null
          language: rust
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            // Generated deterministically by Terrane 0.1.0.
            include!("native-path.support.rs");
            // Source: native-path.trn
            // Namespace: native-path
            fn twice(value: i64) -> i64 {
                return __terrane_raised(
                    terrane_int_support::fixed_multiplication(value, 2),
                    0 /* terrane-site: native-path.trn:4:10-4:19 */,
                );
            }
            fn main() {
                let input: i64 = 21;
                let result: i64 = twice(input);
                println!(
                    "{}{}", terrane_scalar_support::scalar_text(&String::from("result: ")),
                    terrane_scalar_support::scalar_text(&result)
                );
            }
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Several correspondences are immediate:

            - Terrane `int64` became Rust `i64`.
            - `twice; input` became the direct Rust call `twice(input)`.
            - The local bindings remain readable as `input` and `result`.
            - `print` became a Rust `println!` using support code that preserves Terrane's
              display behavior.
            - multiplication uses a support operation rather than raw `value * 2`.

            That last choice is important. Lowering to Rust does not mean selecting the
            shortest Rust spelling. Terrane's fixed-width arithmetic has defined failure
            behavior. The support call and `__terrane_raised` path preserve it and associate
            a possible failure with the original multiplication.

            The sidecar contains generated support needed by this unit. Real programs may
            additionally use compiler support crates, generated package crates, projected
            dependency shims, or target-specific facilities. Pay-for-use lowering should
            include what the program needs rather than forcing every binary through one
            universal boxed runtime.

            Generated Rust is read-only from the toolchain's perspective. Do not fix a
            program by editing `native-path.rs`: the next compiler run may overwrite it, and
            the source would no longer explain the executable. Change the Terrane source,
            fix compiler lowering, add a maintained Rust module, or use the language's
            explicit Rust boundary when one of those is genuinely the intended design.
      sections: []
    - id: source-locations-and-diagnostics-across-lowering
      title: Source locations and diagnostics across lowering
      blocks:
        - type: markdown
          markdown: |-
            The multiplication in the emitted Rust contains:
        - type: example
          id: legacy-fence-009
          title: null
          language: rust
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            0 /* terrane-site: native-path.trn:4:10-4:19 */
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            That compact marker associates generated work with the source expression:
        - type: example
          id: legacy-fence-010
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            return value * 2
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A complete source map can connect several identities:
        - type: example
          id: legacy-fence-011
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            Terrane source span
            semantic operation
            resolved object or binding
            generated Rust span
            native symbol
            trace or allocation identity
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The relationship is not always one-to-one. One Terrane expression may become
            several Rust operations. A generated helper may serve many source sites but
            receive the relevant site identity at a call. An optimized operation may
            disappear from machine code while its semantic origin remains available in build
            metadata.

            When `rustc` reports a backend failure, Terrane collects structured diagnostics
            and maps them back to source where possible. The normal user should see the
            Terrane cause first. Raw Rust details remain useful when investigating compiler
            lowering, a direct Rust section, or a projected dependency boundary.

            This ordering prevents an abstraction leak from becoming an educational tax. You
            should not need to know the name of a generated temporary to correct an ordinary
            Terrane type error. Conversely, the mapping ensures that a compiler implementer
            can descend to the precise Rust and native operations when the abstraction
            itself is under investigation.

            A useful debugging habit is:

            1. Read the primary Terrane diagnostic and its labelled spans.
            2. Correct the source contract if the program is invalid.
            3. Emit Rust if the source appears valid but the backend behavior is surprising.
            4. Use the site markers and source map to connect the two representations.
            5. Report or fix lowering when the generated program violates valid Terrane
               semantics.

            Do not work backward from a Rust error and insert arbitrary clones, locks, or
            casts into Terrane. Those might suppress one backend symptom while changing the
            source model.
      sections: []
    - id: debug-and-release-builds
      title: Debug and release builds
      blocks:
        - type: markdown
          markdown: |-
            A development build is the default:
        - type: example
          id: legacy-fence-012
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane build native-path.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The command prints the native executable's path. Development builds favor a
            useful edit, compile, inspect, and debug cycle.

            Request an optimized build explicitly:
        - type: example
          id: legacy-fence-013
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane build --release native-path.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The release selection belongs only to commands that create or run a native
            executable:
        - type: example
          id: legacy-fence-014
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane run --release native-path.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `check` and `rust` do not accept `--release`; they validate source or expose
            lowering rather than selecting a native artifact profile.

            Development and release artifacts are cached separately. They must preserve the
            same source behavior, but their machine representations and performance may
            differ substantially. Release optimization may inline functions, fold constants,
            remove unused branches, eliminate copies, and specialize generic support paths.

            Use development mode for ordinary iteration and source-level debugging. Use
            release mode when measuring production performance. A development benchmark can
            reveal gross algorithmic problems, but it is not evidence of optimized
            throughput.

            The compiler's release profile currently asks Cargo for optimization,
            whole-program link-time optimization, and a single code-generation unit. Those
            are toolchain decisions, not Terrane language semantics. Future compiler
            versions may adjust them while preserving the meaning of `--release`: build an
            optimized native artifact for the selected target and profile.
      sections: []
    - id: what-optimization-may-erase
      title: What optimization may erase
      blocks:
        - type: markdown
          markdown: |-
            The source program contains a function named `twice`. The generated Rust also
            contains one. A release executable, however, need not retain a callable native
            function with that name. The optimizer may inline its body into `main` and then
            compute the result directly.

            Likewise, optimization may erase or transform:

            - a temporary binding whose value can remain in a register;
            - an ordinary value copy proved unnecessary;
            - a copy-on-write uniqueness check hoisted outside a loop;
            - a class descriptor that no reflection boundary observes;
            - an interface dispatch whose concrete receiver is known;
            - a branch whose condition is constant;
            - a helper function used at only one profitable call site.

            What optimization may not erase is observable behavior. It cannot make two
            independently mutable Terrane values share visible mutation. It cannot discard a
            required destructor effect. It cannot turn exact arithmetic into silent
            overflow. It cannot detach a scoped task or convert an ordinary throw into a
            Rust panic merely because either would be convenient.

            This gives us a clean boundary:

            > Source structure guides meaning and debugging; native structure is free to
            > change when the meaning remains identical.

            Generated Rust sits between those worlds. It should remain readable and
            traceable, but it is already a lowered implementation rather than a promise that
            every source object survives as one runtime object.
      sections: []
    - id: why-a-terrane-object-need-not-become-a-rust-object
      title: Why a Terrane object need not become a Rust object
      blocks:
        - type: markdown
          markdown: |-
            Chapter 9 introduced classes, interfaces, and traits as source-language
            contracts. None requires one universal runtime representation.

            A source class may lower to:

            - an ordinary Rust struct;
            - a generated enum alternative;
            - a copy-on-write value wrapper;
            - a reference-backed identity;
            - a uniquely owned native resource;
            - another representation that preserves its fields, methods, ownership, and
              observable behavior.

            An interface call can become a direct function call when semantic analysis knows
            the concrete receiver. It may require a closed enum dispatch when the
            alternatives are finite. Only an actually open runtime boundary needs the
            machinery appropriate to open dynamic dispatch.

            A trait's reused implementation may be flattened or specialized into the
            receiving class. There need not be a runtime “trait object” merely because the
            source used a trait to organize behavior.

            Even “everything is an object semantically” does not imply universal allocation
            or boxing. It means values participate in coherent source behavior: they have
            members, callable contracts, descriptors, and operations. The compiler still
            chooses the narrowest native representation that preserves those contracts.

            This is one reason to avoid source tricks based on a guessed backend. If code
            assumes that every class is heap-allocated or every interface call uses a
            vtable, it may obscure the domain model in pursuit of machinery the compiler
            never needed.
      sections: []
    - id: behavior-is-the-contract-semicolon-representation-is-a-compiler-decision
      title: Behavior is the contract; representation is a compiler decision
      blocks:
        - type: markdown
          markdown: |-
            The source promises what another part of the program may observe. Representation
            is how one compiler version, target, and profile fulfills that promise.

            For example:
        - type: example
          id: legacy-fence-015
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            copy = original
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            promises independent logical values. It does not promise an eager byte-for-byte
            copy.
        - type: example
          id: legacy-fence-016
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            observer = ref value
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            promises a non-owning alias with a checked lifetime. It does not promise a raw
            machine pointer.
        - type: example
          id: legacy-fence-017
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            items.append; value
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            promises the collection's append behavior. It does not promise whether capacity
            is reserved, whether a copy-on-write guard is checked once or repeatedly, or
            whether the call is inlined.

            That division of responsibility is powerful. The source stays stable while the
            compiler learns better representations. It is also demanding: lowering defects
            cannot be excused as “just implementation details” when they change behavior or
            impose avoidable costs inconsistent with clear source.

            Generated Rust makes that responsibility inspectable. It is a receipt for the
            chosen implementation, not a second source of language semantics.
      sections: []
    - id: debugging-at-the-terrane-and-rust-levels
      title: Debugging at the Terrane and Rust levels
      blocks:
        - type: markdown
          markdown: |-
            Most problems should be solved at the highest level that can answer the
            question.
      sections:
        - id: debugging-at-the-terrane-and-rust-levels-start-with-terrane
          title: Start with Terrane
          blocks:
            - type: markdown
              markdown: |-
                For wrong output, first inspect source values, branches, loops, and ownership
                relationships. Use small examples and source-oriented diagnostics. If a task was
                not joined or a moved binding was reused, those are Terrane problems with
                Terrane fixes.
          sections: []
        - id: debugging-at-the-terrane-and-rust-levels-inspect-generated-rust
          title: Inspect generated Rust
          blocks:
            - type: markdown
              markdown: |-
                Descend when valid source behaves unexpectedly, a backend diagnostic escapes
                translation, or performance suggests hidden work. Look for direct calls, support
                operations, cloning, reference wrappers, loops, allocations, and source-site
                markers.
          sections: []
        - id: debugging-at-the-terrane-and-rust-levels-use-native-tools
          title: Use native tools
          blocks:
            - type: markdown
              markdown: |-
                A debugger, profiler, disassembler, or Rust analysis tool can answer still lower
                questions:

                - Which generated function consumed the time?
                - Was a call inlined?
                - Where did an allocation occur?
                - Did a copy-on-write uniqueness check remain inside a hot loop?
                - Which machine instruction dominates a sampled profile?

                The generated Rust and source maps preserve the route back upward. Native
                evidence should lead to an explanation in terms of source behavior and compiler
                choices.

                A performance investigation therefore follows a connected path:
            - type: example
              id: legacy-fence-018
              title: null
              language: text
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                measure the Terrane program
                  -> identify the costly source operation
                  -> inspect generated Rust
                  -> inspect runtime support when needed
                  -> profile or disassemble the native artifact
                  -> improve source, compiler, or runtime at the right layer
                  -> measure again
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Do not begin by rewriting clear Terrane as obscure source. First locate the
                cost. A repeated operation may need a different algorithm, but it may instead
                expose a compiler optimization opportunity or a runtime defect that every
                program deserves to have fixed once.
          sections: []
    - id: the-continuum-of-competence
      title: The continuum of competence
      blocks:
        - type: markdown
          markdown: |-
            A beginner can write:
        - type: example
          id: legacy-fence-019
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            print; 'Hello, world!'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            and receive a real native program. Nothing about that first source is a
            disposable beginner dialect.

            As questions deepen, the same programmer can learn to:

            1. read Terrane diagnostics;
            2. add meaningful type and ownership contracts;
            3. organize a package;
            4. use structured tasks;
            5. emit generated Rust;
            6. connect a source operation to its lowering;
            7. profile a native executable;
            8. inspect runtime support or machine code;
            9. improve a hot path through Terrane, compiler work, a Rust library, or direct
               Rust where justified.

            Each step reveals another layer without invalidating the earlier program or
            mental model. Expertise changes the depth at which the programmer can
            investigate; it does not require abandoning the approachable source layer.

            The same continuum can exist across a team. Most contributors may work entirely
            in Terrane. A compiler contributor can improve lowering. A systems specialist
            can maintain a narrow Rust or native boundary. They still work on one connected
            program with traceable contracts between layers.
      sections: []
    - id: exercises
      title: Exercises
      blocks:
        - type: markdown
          markdown: |-
            1. Run the chapter's `native-path.trn` program, then emit `native-path.rs` with
               `terrane rust --output`.
            2. Match every Terrane binding and function call to its generated Rust
               counterpart. Identify one generated operation with no literal one-token
               source equivalent.
            3. Change `int64` to `int` and compare the generated representation. Explain why
               exact adaptive integers may require more support than fixed-width integers.
            4. Build the program in development and release modes. Record the two artifact
               paths and confirm that both produce the same output.
            5. Add an ordinary list assignment followed by mutation. Inspect the generated
               Rust for the support operation preserving copy-on-write value semantics.
            6. Emit Rust for a small class implementing an interface. Determine whether the
               concrete call in your program requires open dynamic dispatch.
            7. Introduce a valid Terrane operation that can fail, inspect its source-site
               marker, and connect it to the originating source span.
            8. Choose one measurable operation in a larger program. Write down the question
               at the Terrane, generated-Rust, runtime, and machine levels before selecting
               a tool.
      sections: []
    - id: chapter-summary
      title: Chapter summary
      blocks:
        - type: markdown
          markdown: |-
            - `check`, `rust`, `build`, and `run` share one compiler pipeline.
            - The compiler resolves syntax, names, types, calls, ownership, effects, and
              control flow before lowering.
            - The semantic model is compiler machinery; generated Rust is the public lowered
              representation.
            - `terrane rust --output file.rs source.trn` writes readable Rust and a support
              sidecar.
            - Source-site markers and source maps connect Terrane operations to generated
              and native work.
            - Development and release builds preserve behavior but select different native
              optimization profiles.
            - Optimization may inline, specialize, combine, or erase representations when
              observable behavior remains unchanged.
            - A Terrane class, interface, trait, value, or reference does not mandate one
              matching Rust representation.
            - Generated Rust is a receipt and debugging surface, not a file to patch.
            - Debug at the highest layer that answers the question, then descend through
              connected evidence.
            - Terrane's accessible source and inspectable native path form one continuum of
              competence.

            We now know both how to write individual Terrane features and how their behavior
            reaches native code. Chapter 14 turns that knowledge into style: choosing the
            ordinary operation, adding contracts only where they clarify the model, and
            refactoring the book's accumulated examples into recognizably Terrane-shaped
            programs.
      sections: []
