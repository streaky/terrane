            - type: markdown
              markdown: |-
                That ordering avoids implying shared identity. Ordinary assignment and parameter
                passing preserve Terrane's value semantics. Adding `chapter` does not promise
                that later changes to the local binding will mutate the item already stored in
                `tasks`.

                Most programs should begin with that independence. Chapter 11 introduces `ref`
                and `shared ref` for models in which two parts of a program intentionally
                observe one changing identity.
