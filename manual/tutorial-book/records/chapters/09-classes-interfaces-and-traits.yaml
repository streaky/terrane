format: 1
id: book.classes-interfaces-and-traits
kind: chapter
surface: null
lifecycle:
  status: current
  stability: experimental
  since: "0.1"
  deprecated-since: null
  removed-in: null
  replacement: null
documentation:
  status: complete
  title: Classes, Interfaces, and Traits
  title-style: text
  summary: |-
    The programs we have built so far have mostly kept data in ordinary values and collections, with functions performing
    the work. That remains a good default. A class should not be the admission price for writing a useful Terrane program.
  tags: []
  blocks:
    - type: markdown
      markdown: |-
        Chapter 7 briefly used a class implementing `throwable` to define a structured
        domain error. We treated that declaration as one complete pattern before we had
        the vocabulary to examine it. Now we will make the object model explicit: what a
        class promises, how an instance is constructed, and why interfaces and traits
        are separate tools rather than interchangeable varieties of inheritance.

        Some parts of a program do become clearer when state and the operations that
        preserve its rules have one home. A task has a title and a completion state.
        Completing it should be an operation on that task, not a convention repeated by
        every caller. Several kinds of task may need to appear through one common view.
        A small piece of behavior may also be useful to several otherwise unrelated
        classes.

        Terrane provides four related ideas for those jobs:

        - a **class** groups stored state with behavior and may extend one base class;
        - an **interface** is a named nominal behavior contract and dispatch type
          adopted with `implements`;
        - a **trait** composes reusable Terrane fields and method implementations into a
          class with `uses`;
        - a **protocol** is an unnamed structural operation shape, not a declaration or
          nominal type.

        This chapter concentrates on the first three. Protocols usually appear through
        ordinary operations: an object can be iterable, displayable, comparable, or
        callable because its canonical descriptor supplies the required shape. There is
        no protocol declaration to adopt and no protocol hierarchy to design.

        In this chapter, we will:

        - define and construct classes;
        - give instances typed fields and methods;
        - initialize and clean up values through lifecycle methods;
        - control which members callers may use;
        - extend one concrete class;
        - use an interface as a shared behavior boundary;
        - reuse an implementation with a trait;
        - build a small task-list model from those pieces.

        The aim is not to turn every record of data into an object. It is to learn what
        each object-model tool says and to use one only when it makes the program more
        honest.
  sections:
    - id: objects-as-behavior
      title: Objects as behavior
      blocks:
        - type: markdown
          markdown: |-
            Terrane says that everything is an object semantically. An integer, a string, a
            function, a class, and an instance all participate in one language model: they
            have types, may expose members, and may support protocols.

            That does not mean everything is an instance of a user-defined class. Nor does
            it mean every value is a heap allocation carrying a table of methods. The
            statement is about what the program may observe, not about the compiler's
            eventual storage choice.

            For this chapter, the useful consequence is simple:

            > Think first about what a value can do. Choose a class when stored state and
            > the operations that govern it belong together.

            Suppose a program represents work with two unrelated values:
        - type: example
          id: legacy-fence-001
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            title = 'Draft chapter'
            completed = false
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            That is perfectly adequate while the program only stores and prints them. As the
            program grows, every function that changes a task must keep the two values
            together and preserve the same rules. A class lets us give that idea a name:
        - type: example
          id: legacy-fence-002
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task
              title string
              completed bool
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A `task` now describes objects with two fields. More importantly, it gives us a
            place to put operations such as `mark-complete` and `render`.

            This is not automatically a better design merely because it uses a class. It
            becomes useful when the class owns a meaningful rule: for example, how a task is
            initialized, how its state changes, or how callers are allowed to observe it.
      sections: []
    - id: defining-a-class
      title: Defining a class
      blocks:
        - type: markdown
          markdown: |-
            A class declaration begins with `class` and a name. Its body is indented:
        - type: example
          id: legacy-fence-003
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task
              title string
              completed bool
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The declaration creates a class object named `task`. The indented declarations
            create its members.

            Here, both members are instance fields. Each constructed task receives
            independent field state. Because their declared types have canonical defaults:

            - `title` stores a `string` and initially contains `''`;
            - `completed` stores a `bool` and initially contains `false`.

            A typed class field may omit a redundant initializer when its type has a
            canonical default:
        - type: example
          id: legacy-fence-004
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class counter
              value int
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `bool` defaults to `false`; numeric fields receive typed zero; `string` and
            `bytes` receive empty values; optional fields receive `none`; and collection
            fields receive empty collections. This shorthand never guesses the field's type
            or puts hidden `none` into a non-optional field.

            Write an initializer when the field needs a different default:
        - type: example
          id: legacy-fence-005
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class connection-options
              port uint16 = 443
              secure bool = true
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A field whose type has no canonical default, such as another source-declared
            class, still requires an initializer. The compiler therefore never leaves a
            constructed instance with unspecified bits.

            A class may have an empty body when its name alone is useful:
        - type: example
          id: legacy-fence-006
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class marker
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            That is valid Terrane, although a class with neither meaningful state nor
            behavior should prompt the question of whether a simpler value would do.
      sections: []
    - id: constructing-an-instance
      title: Constructing an instance
      blocks:
        - type: markdown
          markdown: |-
            Terrane makes construction visible. Use `instance` followed by the class and a
            call marker:
        - type: example
          id: legacy-fence-007
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            first task = instance task;
            second task = instance task;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The semicolon belongs to the construction operation, just as it belongs to an
            ordinary call. It is required even when there are no arguments.

            Construction is not written as a call to the class name:
        - type: example
          id: legacy-fence-008
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            instance task;              # construct a task
            task;                       # not construction
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This distinction matters because a class is itself an object. Referring to or
            invoking a class object is not silently reinterpreted as creating an instance.

            The word `instance` means _make a fresh semantic instance_. It does not promise
            heap allocation. The compiler may represent a particular instance as a Rust
            struct, a stack value, an enum alternative, or something more specialized.
            Source code receives the same class behavior whichever representation is chosen.

            Every construction starts with independent instance state:
        - type: example
          id: legacy-fence-009
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            first task = instance task;
            second task = instance task;
            first.completed = true
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Changing `first.completed` does not change `second.completed`.
      sections: []
    - id: typed-fields-and-ordinary-methods
      title: Typed fields and ordinary methods
      blocks:
        - type: markdown
          markdown: |-
            Methods are function declarations inside a class. Instance methods receive an
            implicit name, `this`, for the current instance:
        - type: example
          id: legacy-fence-010
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task
              title string = ''
              completed bool = false

              mutable function mark-complete;
                this.completed = true

              function render string;
                if this.completed
                  return '[done] '.concat; this.title
                return '[ ] '.concat; this.title
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The method header follows the same shape as a function header. A result type
            follows the method name:
        - type: example
          id: legacy-fence-011
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function render string;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Parameters follow the semicolon:
        - type: example
          id: legacy-fence-012
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            mutable function rename; title string
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Inside an instance method, fields are selected through `this`:
        - type: example
          id: legacy-fence-013
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            this.completed = true
            return this.title
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Outside the class, select an instance member with `.`:
        - type: example
          id: legacy-fence-014
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            chapter = instance task;
            chapter.title = 'Draft chapter'
            chapter.mark-complete;
            print; (chapter.render;)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The call marker is still explicit. `chapter.render` selects the method object;
            `chapter.render;` invokes it. Parentheses around the call delimit it before
            passing its result to `print`.

            Method headers state the authority a caller grants over the receiver. Plain
            `function` is shared and may observe repeatedly; `mutable function` may update
            repeatable state; `consuming function` may transfer state and is one-shot. The
            compiler checks the exact authority used by the body against that written
            contract: a body may need less authority, never more. Mutation is therefore
            visible at the declaration rather than inferred into its public contract.
      sections:
        - id: typed-fields-and-ordinary-methods-fields-express-invariants
          title: Fields express invariants
          blocks:
            - type: markdown
              markdown: |-
                A field type is more than storage documentation. It is a contract for every
                value written to that field:
            - type: example
              id: legacy-fence-015
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                class task
                  title string = ''
                  completed bool = false
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                No method or caller can replace `completed` with `'yes'`. The compiler checks
                assignments against the declared `bool` field.

                Chapter 10 develops type annotations more fully. For now, typed fields give a
                class a stable shape and make its basic invariant visible where the state is
                declared.
          sections: []
        - id: typed-fields-and-ordinary-methods-field-metadata
          title: Field metadata
          blocks:
            - type: markdown
              markdown: |-
                A field sometimes needs policy that is neither its Terrane name nor its type. An
                external document may spell the key differently, or a value may be safe to hold
                but unsafe to expose in logs. Put those facts on the field's one metadata
                clause:
            - type: example
              id: legacy-fence-016
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                class service-options
                  internal-name string = 'primary' metadata (external-name = 'serviceName')
                  credential string = '' metadata (secret = true)
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The clause follows the initializer. `external-name` takes a string and records
                the key used at a document boundary. `secret` takes a boolean and marks the
                field for redaction before a structured event reaches any sink. Metadata applies
                only to instance fields; repeating a metadata name or giving two fields the same
                external name is rejected.

                Defaults and optionality do not have separate metadata spellings. A canonical
                type default or an ordinary initializer is the field default:
            - type: example
              id: legacy-fence-017
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                retry-limit int = 3
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                An optional field continues to say so in its type:
            - type: example
              id: legacy-fence-018
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                note string|none = none
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Keeping those facts in the declarations that already define them prevents
                document decoding, reflection, and logging from developing three subtly
                different descriptions of one class.

                A class descriptor exposes the resolved field inventory:
            - type: example
              id: legacy-fence-019
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                descriptor = service-options
                print; descriptor.field-names[0]
                print; descriptor.field-external-names[0]
                print; descriptor.field-secret[1]
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The reflected lists are parallel and declaration ordered. They retain the
                Terrane field name and external name separately, and also expose whether each
                field is defaulted, optional, or secret. They describe semantic fields rather
                than generated Rust identifiers.
          sections: []
        - id: typed-fields-and-ordinary-methods-decoding-documents-into-classes
          title: Decoding documents into classes
          blocks:
            - type: markdown
              markdown: |-
                Field metadata also gives the compiler enough information to build an ordinary
                class value from safe JSON or YAML. This is always explicit. Mark each class in
                the decoded tree with `document-decodable`, then pass the concrete root
                descriptor and an unknown-field policy:
            - type: example
              id: legacy-fence-020
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                from /core/documents import document-decodable
                from /core/documents/json import decode-typed-json, default-json-options

                class endpoint implements document-decodable
                  host string = ''
                  port uint16 = 443

                class service-options implements document-decodable
                  service-name string = '' metadata (external-name = 'serviceName')
                  endpoint endpoint = instance endpoint;

                decoded = decode-typed-json; source, service-options, (default-json-options;), false
                if decoded.failed
                  for diagnostic in decoded.diagnostics
                    print; diagnostic.path, ': ', diagnostic.message
                else
                  print; decoded.value.endpoint.host
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The decoder walks scalars, nested opted-in classes, lists, homogeneous tuples,
                and string-keyed maps. It uses ordinary field initializers for absent defaults
                and accepts an absent `T|none` field. Every other missing field is a diagnostic.
                Integer destinations are range checked. Document numbers entering `float32` or
                `float64` use the same round-to-nearest, ties-to-even rule as ordinary floating
                destinations; a magnitude outside the destination's finite range diagnoses.

                The final boolean is deliberate policy. `false` rejects keys the class does not
                declare. `true` ignores them recursively. Parser options still apply first, so
                opting into typed conversion does not bypass JSON depth and byte bounds or YAML
                alias limits.

                A failed outcome retains a safe ordinarily initialized value for a uniform
                result shape, but that value is not partial success. Inspect `failed` and the
                typed `diagnostics` list. Each diagnostic records the document path, expected
                type, actual kind, reason, message, the decode call location, and the source
                declaration of the affected field. Errors in independent fields accumulate in
                deterministic order.

                Custom construction and resource-owning or inherited classes do not receive
                derived decoding. Implement `deserializable` manually when construction itself
                owns policy. For a derived class that only needs a final invariant check, also
                implement `document-validatable`:
            - type: example
              id: legacy-fence-021
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                from /core/documents import document-validatable

                function validate-document string|none;
                  if this.service-name == 'reserved'
                    return 'service name is reserved'
                  return none
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The method runs only after every field decoded successfully. A returned string
                becomes a validation diagnostic; `none` accepts the value. Validation never
                receives a partially decoded instance.
          sections: []
        - id: typed-fields-and-ordinary-methods-logging-object-shaped-values
          title: Logging object-shaped values
          blocks:
            - type: markdown
              markdown: |-
                Structured logging is one place where field metadata and interface behavior
                meet. Import `/core/logging`, choose a sink explicitly, and enrich an immutable
                logger with typed fields:
            - type: example
              id: legacy-fence-022
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                from /core/collections import list
                from /core/logging import log-field, log-text, field, secret-field, memory-sink, default-logger, with-field, info

                sink-result = memory-sink; 32, 'reject', 0, 1, false
                log = default-logger; sink-result.value
                log = with-field; log, (field; 'component', (log-text; 'importer'))

                fields list of log-field = list;
                fields.append; (secret-field; 'credential', (log-text; 'not-for-output'))
                outcome = info; log, 'starting import', fields
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                There is no ambient application logger in this model. The logger names its sink
                and carries its context as an ordinary value. `with-field` and `with-span`
                return enriched copies, so adding context for one operation does not contaminate
                an earlier logger or a sibling copy.

                Each field stores a `log-value` renderer rather than flattening the value
                immediately. Severity and hierarchical target filters run before that renderer.
                A secret field is not rendered at all unless the selected sink was explicitly
                created with permission to reveal secrets; otherwise the sink receives the
                structured string `"<redacted>"`. The compiler preserves the call sites of field
                construction and event emission so captured records can lead back to the source
                that supplied them.

                Class metadata connects to the same policy. A descriptor-driven adapter checks
                `field-secret` and uses `secret-field` for every matching class field. Logging
                does not invent a second secrecy annotation, and generated Rust field names
                never participate in the decision.

                Libraries reached through projected Rust dependencies may already emit through
                the Rust `log` or `tracing` facades. `install-dependency-bridge; log` connects
                those process-global callbacks to this logger's explicit sink. Install it
                deliberately near program startup. Foreign events keep their dependency target,
                module, file, and line and identify their origin as `dependency`; they are not
                given a convenient but false Terrane call site.
          sections: []
        - id: typed-fields-and-ordinary-methods-stored-fields-and-computed-members
          title: Stored fields and computed members
          blocks:
            - type: markdown
              markdown: |-
                An object may expose members that are not stored fields. For example, a string
                provides `length`, but callers do not own a hidden integer slot that they may
                overwrite:
            - type: example
              id: legacy-fence-023
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                title string = 'Draft chapter'
                title.length = 40                 # rejected: `length` is read-only
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The compiler reports `T0072` at `length`. The same rule applies to other
                computed or compiler-owned members: selecting a value does not imply that the
                selection is an assignment target.

                Source-declared fields remain writable when their visibility and type permit it:
            - type: example
              id: legacy-fence-024
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                chapter = instance task;
                chapter.title = 'Review examples'
                chapter.completed = true
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                This distinction keeps object surfaces honest. Assignment updates declared
                state; it cannot replace facts such as a string's length, a floating value's
                finiteness, or a caught error's message envelope. Use the operation that changes
                the underlying value instead.
          sections: []
    - id: initialization-with-construct
      title: Initialization with `construct`
      blocks:
        - type: markdown
          markdown: |-
            Default field values make zero-argument construction safe, but callers often
            need to supply initial state. `construct` is the conventional lifecycle method
            invoked by `instance`:
        - type: example
          id: legacy-fence-025
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task
              title string = ''
              completed bool = false

              function construct; title string
                this.title = title
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Construction can now pass the title:
        - type: example
          id: legacy-fence-026
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            chapter task = instance task; 'Draft chapter'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The operation proceeds conceptually in two parts:

            1. a fresh task begins with definitely initialized fields;
            2. its `construct` method receives the supplied arguments and establishes the
               requested state.

            `construct` follows ordinary instance-method parameter rules, including
            defaults, but its lifecycle role gives it intrinsic mutable receiver authority:
        - type: example
          id: legacy-fence-027
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task
              title string = ''
              category string = 'general'

              function construct; title string, category string = 'general'
                this.title = title
                this.category = category
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Both forms are then valid:
        - type: example
          id: legacy-fence-028
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            first = instance task; 'Draft chapter'
            second = instance task; 'Review examples', 'book'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The class name after `instance` is a class designator, not a return type and not
            an argument. The explicit spelling makes new semantic identity easy to see at
            the call site.
      sections:
        - id: initialization-with-construct-terrane-style-construct-a-valid-value
          title: "Terrane style: construct a valid value"
          blocks:
            - type: markdown
              markdown: |-
                Prefer constructors that leave the instance ready to use. Avoid a sequence in
                which callers must construct an empty object and then remember several unrelated
                assignments:
            - type: example
              id: legacy-fence-029
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                item = instance task;
                item.title = 'Draft chapter'
                item.category = 'book'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                When those values are required to make a meaningful task, put the rule in
                `construct`:
            - type: example
              id: legacy-fence-030
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                item = instance task; 'Draft chapter', 'book'
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                A short constructor is not merely convenient. It reduces the number of
                temporarily incomplete states that the rest of the program must understand.
          sections: []
    - id: cleanup-with-destruct
      title: Cleanup with `destruct`
      blocks:
        - type: markdown
          markdown: |-
            Some objects own work that must happen when their lifetime ends: closing a file,
            releasing a native handle, or committing a scoped resource. A class can declare
            a `destruct` method:
        - type: example
          id: legacy-fence-031
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class trace-scope
              name string = ''

              function construct; name string
                this.name = name
                print; 'enter ', this.name

              consuming function destruct;
                print; 'leave ', this.name
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `destruct` is an explicitly consuming deterministic cleanup hook. Terrane
            invokes it once for each independently owned source value when that value's
            lifecycle ends. User code should not normally call it directly. `construct` has
            intrinsic mutable lifecycle authority; unlike an ordinary state-changing method,
            it does not need a `mutable` prefix.

            That wording matters because ordinary assignment has value semantics. If
            assigning an object creates an independent logical value, each independent value
            has its own lifecycle and therefore its own cleanup. A `move`, introduced in
            Chapter 11, transfers an existing lifecycle rather than creating another one.

            When a subclass and its base both declare `destruct`, cleanup runs from the
            most-derived class toward the root base. Derived cleanup can still use inherited
            state, and base cleanup is not skipped merely because the method name was
            overridden.

            Do not add `destruct` to ordinary data objects for ceremony. It represents
            observable cleanup and should exist only when the model genuinely requires it.
      sections: []
    - id: encapsulation-and-visibility
      title: Encapsulation and visibility
      blocks:
        - type: markdown
          markdown: |-
            Members are public by default. This keeps small classes lightweight:
        - type: example
          id: legacy-fence-032
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task
              title string = ''

              function render string;
                return this.title
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            When a class owns an invariant, visibility can keep callers on the operations
            that preserve it. Terrane provides three visibility levels inside a class:

            - `public` is visible to all permitted callers;
            - `protected` is visible to the class and its descendants;
            - `private` is visible only to the declaring class.

            Consider a task collection:
        - type: example
          id: legacy-fence-033
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task-list
              private items list of task = list

              mutable function add; item task
                this.items = this.items.append; item

              function count int;
                return this.items.length
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Callers may add a task or ask for the count, but they cannot replace `items`
            directly. The class controls the operations through which its collection
            changes.

            Writing `public` is allowed when it helps document an API, even though public is
            the default:
        - type: example
          id: legacy-fence-034
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            public function count int;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Use visibility to protect a real boundary, not to make every declaration longer.
            A field does not become unsafe merely because it is public, and a getter that
            exposes exactly the same unrestricted mutation is not meaningful encapsulation.
      sections:
        - id: encapsulation-and-visibility-terrane-style-expose-the-rule-not-the-storage-ritual
          title: "Terrane style: expose the rule, not the storage ritual"
          blocks:
            - type: markdown
              markdown: |-
                Suppose callers should complete a task through one operation. Prefer:
            - type: example
              id: legacy-fence-035
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                item.mark-complete;
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                to spreading knowledge of its internal representation:
            - type: example
              id: legacy-fence-036
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                item.completed = true
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The first form gives future validation, timestamps, or reporting behavior one
                natural home. The class has earned some of its existence by naming a domain
                operation.

                Not every field needs to be private. A title that callers are genuinely free to
                read and replace may remain public. Encapsulation should communicate a design
                decision, not imitate a style guide from a language with different defaults.
          sections: []
    - id: extending-one-base-class
      title: Extending one base class
      blocks:
        - type: markdown
          markdown: |-
            A class may extend one concrete base class:
        - type: example
          id: legacy-fence-037
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class urgent-task extends task
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The subclass inherits the base class's fields and methods. It may add its own
            state and may replace inherited behavior:
        - type: example
          id: legacy-fence-038
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task
              title string = ''
              completed bool = false

              function render string;
                if this.completed
                  return '[done] '.concat; this.title
                return '[ ] '.concat; this.title

            class urgent-task extends task
              function render string;
                if this.completed
                  return '[done, urgent] '.concat; this.title
                return '[urgent] '.concat; this.title
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            An `urgent-task` can use the inherited `title` and `completed` fields. Calling
            its `render` method uses the subclass behavior.

            Single inheritance represents an **is-a relationship with inherited state**. An
            urgent task is a task, and code expecting a `task` can receive one:
        - type: example
          id: legacy-fence-039
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            urgent urgent-task = instance urgent-task;
            ordinary-view task = urgent
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            That conversion preserves the complete dynamic object. It does not cut away the
            subclass portion merely because the binding is typed as `task`. If an overridden
            method is called through `ordinary-view`, the preserved concrete value still
            determines the behavior.

            Terrane supports one base class rather than multiple class inheritance. When the
            need is shared behavior rather than one concrete is-a relationship, interfaces
            and traits usually state the design more precisely.
      sections:
        - id: extending-one-base-class-inheritance-is-not-just-code-reuse
          title: Inheritance is not just code reuse
          blocks:
            - type: markdown
              markdown: |-
                Do not introduce a base class solely because two classes happen to contain three
                similar lines today. Inheritance couples state, lifecycle, substitution, and
                method behavior.

                A useful test is:

                > Can every value of the proposed subclass honestly be used wherever the base
                > class contract is expected?

                If the answer is no, prefer an ordinary field, a helper function, or a trait for
                the reusable implementation. A hierarchy that exists only to avoid copying a
                small method is expensive documentation.
          sections: []
    - id: describing-shared-behavior-with-an-interface
      title: Describing shared behavior with an interface
      blocks:
        - type: markdown
          markdown: |-
            Sometimes callers do not care which concrete class they receive. They care that
            the value can perform a particular operation.

            An interface names that behavior contract:
        - type: example
          id: legacy-fence-040
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            interface task-view
              function render string;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A class declares that it implements the interface:
        - type: example
          id: legacy-fence-041
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task implements task-view
              title string = ''

              function render string;
                return this.title
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The compiler checks the complete required signature. A class that omits
            `render`, returns the wrong type, or accepts incompatible parameters does not
            implement `task-view` merely because it says so.

            Interfaces can be used in annotations:
        - type: example
          id: legacy-fence-042
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function show; item task-view
              print; (item.render;)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Both an ordinary task and an urgent task may cross that boundary:
        - type: example
          id: legacy-fence-043
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            show; (instance task;)
            show; (instance urgent-task;)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The function knows only the behavior promised by `task-view`. It cannot depend
            on unrelated fields that happen to exist on one implementation.

            This is the central distinction:

            - a class describes a concrete family of state and behavior;
            - an interface describes the behavior a boundary requires.

            An interface is a type. A trait, which we will meet next, is not.
      sections:
        - id: describing-shared-behavior-with-an-interface-interfaces-preserve-mutation-contracts
          title: Interfaces preserve mutation contracts
          blocks:
            - type: markdown
              markdown: |-
                An interface may include methods that mutate their receiver:
            - type: example
              id: legacy-fence-044
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                interface completable
                  mutable function mark-complete;
                  function is-complete bool;
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                The written mode is part of the interface requirement: it states how much
                authority a caller must provide at that boundary. A conforming implementation
                must have compatible parameters and results, and its exact receiver use may be
                no stronger than the requirement. A shared implementation can satisfy a mutable
                requirement because it needs less authority; a mutable implementation cannot
                satisfy a shared requirement. The compiler does not infer an interface contract
                from whichever class happens to implement it.
          sections: []
        - id: describing-shared-behavior-with-an-interface-prefer-the-smallest-useful-interface
          title: Prefer the smallest useful interface
          blocks:
            - type: markdown
              markdown: |-
                An interface should describe what its consumers need, not inventory an entire
                concrete class.

                If a report renderer only needs this:
            - type: example
              id: legacy-fence-045
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                interface task-view
                  function render string;
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                then adding setters, storage fields, construction details, and administrative
                methods makes the boundary weaker rather than stronger. Small interfaces admit
                more honest implementations and make dependencies easier to understand.
          sections: []
    - id: reusing-fields-and-methods-with-traits
      title: Reusing fields and methods with traits
      blocks:
        - type: markdown
          markdown: |-
            A trait supplies reusable implementation to classes:
        - type: example
          id: legacy-fence-046
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            trait categorized
              category string = 'general'

              function render-category string;
                return ' ('.concat; this.category, ')'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            A class uses the trait with `uses`:
        - type: example
          id: legacy-fence-047
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task uses categorized
              title string
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The class receives the trait's `category` field and `render-category` method.
            Its own methods can use them through `this`:
        - type: example
          id: legacy-fence-048
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function render string;
              return this.title.concat; (this.render-category;)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Trait fields follow the same default rules as class fields. A defaultable field
            may omit its initializer and contributes that canonical value to every using
            class. A nondefaultable field must be initialized by the trait or overridden
            with an initializer in the using class; the compiler validates the complete
            inherited field set before construction. An initializer inherited from a trait
            or base class is still evaluated in the source and object context where it was
            declared.

            A trait is implementation reuse, not a type relationship. This is invalid as a
            promise that a parameter accepts every class using `categorized`:
        - type: example
          id: legacy-fence-049
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function show-category; item categorized    # not a trait type boundary
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            If callers need a named type boundary, define an interface containing the
            required behavior. A trait may help classes implement that interface, but the
            two ideas remain distinct.

            Terrane and Rust use the word _trait_ for different jobs. A Terrane trait is
            source implementation composition, not a named conformance contract. A Rust
            trait is a named conformance contract, so an admitted Rust trait projects toward
            a Terrane **interface**, not a Terrane trait. The shared word does not imply
            shared semantics.

            A class may combine the object-model clauses in one header:
        - type: example
          id: legacy-fence-050
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class urgent-task extends task implements task-view uses categorized
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Read that from left to right:

            - it extends the concrete state and behavior of `task`;
            - it promises the `task-view` interface;
            - it incorporates the implementation from `categorized`.
      sections:
        - id: reusing-fields-and-methods-with-traits-trait-conflicts-are-explicit
          title: Trait conflicts are explicit
          blocks:
            - type: markdown
              markdown: |-
                Two traits may not silently replace one another's member merely because they are
                listed in a particular order. This is rejected:
            - type: example
              id: legacy-fence-051
              title: null
              language: terrane
              mode: illustrative
              target: null
              timeout-ms: null
              source: |2
                trait left-label
                  function marker string;
                    return 'left'

                trait right-label
                  function marker string;
                    return 'right'

                class ambiguous uses left-label, right-label    # rejected: member conflict
              response: null
              diagnostic: null
              markdown: null

            - type: markdown
              markdown: |-
                Terrane does not apply a “last one wins” rule. A reusable implementation should
                remain reviewable when traits are reordered, and a conflict should force the
                class author to settle the meaning deliberately.
          sections: []
        - id: reusing-fields-and-methods-with-traits-interface-or-trait
          title: Interface or trait?
          blocks:
            - type: markdown
              markdown: |-
                Ask what the declaration is for:
            - type: table
              id: null
              title: null
              show-header: true
              columns:
                - id: need
                  title: Need
                  cell: markdown
                - id: use
                  title: Use
                  cell: markdown
              rows:
                - need: Store state and define one concrete kind of value
                  use: class
                - need: Accept different classes through one named behavior contract
                  use: interface
                - need: Reuse fields or method bodies in several classes
                  use: trait
                - need: Extend the state and substitutable behavior of one concrete kind
                  use: class inheritance
            - type: markdown
              markdown: |-
                A trait can help satisfy an interface. A subclass can inherit interface
                conformance from its base. Neither fact collapses the distinctions in the table.
          sections: []
    - id: designing-an-object-that-earns-its-existence
      title: Designing an object that earns its existence
      blocks:
        - type: markdown
          markdown: |-
            Classes are useful, but they are not the default container for every handful of
            values. Before creating one, ask what responsibility becomes clearer.

            A class probably earns its existence when at least one of these is true:

            - several fields form one invariant that its methods preserve;
            - lifecycle behavior belongs to the value;
            - callers benefit from a stable operation rather than manipulating
              representation;
            - more than one concrete implementation must satisfy a shared interface;
            - the value is a real domain concept with behavior that changes alongside its
              state.

            A class is probably unnecessary when it only hides an ordinary collection behind
            one-line forwarding methods, or when a small function and a tuple already state
            the idea clearly.

            Compare these two designs for a list of titles.

            The first creates a class but adds no policy:
        - type: example
          id: legacy-fence-052
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class titles
              values list of string = list

              function append; value string
                this.values = this.values.append; value
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            An ordinary `list of string` may be clearer.

            The second owns a domain rule:
        - type: example
          id: legacy-fence-053
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task
              private completed bool = false

              mutable function mark-complete;
                this.completed = true

              function status string;
                if this.completed
                  return 'done'
                return 'open'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Here the methods name meaningful operations and keep the representation decision
            local.
      sections:
        - id: designing-an-object-that-earns-its-existence-terrane-style-begin-with-values-grow-toward-contracts
          title: "Terrane style: begin with values, grow toward contracts"
          blocks:
            - type: markdown
              markdown: |-
                You do not need to predict a complete object hierarchy before writing the first
                version of a program. Begin with ordinary values and functions. Introduce a
                class when state and behavior want one home. Introduce an interface when a real
                boundary needs several implementations. Introduce a trait when repeated
                implementation has become visible.

                That order avoids speculative architecture and tends to produce smaller
                contracts.
          sections: []
    - id: project-model-a-small-task-list
      title: "Project: model a small task list"
      blocks:
        - type: markdown
          markdown: |-
            We will now assemble the chapter's ideas into one program. The model has three
            goals:

            1. ordinary and urgent tasks should render differently;
            2. the list should accept either kind without knowing its concrete class;
            3. category behavior should be reusable without making category a base class.

            Start with the namespace, the collection import, and the shared rendering
            interface:
        - type: example
          id: legacy-fence-054
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            namespace task-list-project

            from /core/collections import list

            interface task-view
              function render string;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `task-view` is deliberately small. The task list needs to render each item; it
            does not need permission to rewrite every field.

            Next, define a trait for the reusable category field and its formatting
            behavior:
        - type: example
          id: legacy-fence-055
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            trait categorized
              category string = 'general'

              function render-category string;
                return ' ('.concat; this.category, ')'
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Now define the main task class:
        - type: example
          id: legacy-fence-056
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task implements task-view uses categorized
              title string = ''
              completed bool = false

              function construct; title string, category string = 'general'
                this.title = title
                this.category = category

              mutable function mark-complete;
                this.completed = true

              function render string;
                if this.completed
                  return '[done] '.concat; this.title, (this.render-category;)
                return '[ ] '.concat; this.title, (this.render-category;)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            This class has one concrete representation, promises the `task-view` boundary,
            and reuses the `categorized` implementation. `construct` establishes a useful
            task in one operation. `mark-complete` names the state transition. `render`
            fulfills the interface.

            An urgent task is still a task, but it changes how open work is presented:
        - type: example
          id: legacy-fence-057
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class urgent-task extends task
              function render string;
                if this.completed
                  return '[done, urgent] '.concat; this.title, (this.render-category;)
                return '[urgent] '.concat; this.title, (this.render-category;)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The subclass inherits the fields, constructor, trait-provided method, and
            interface conformance of `task`. It overrides only the behavior that differs.

            Finally, define the collection object:
        - type: example
          id: legacy-fence-058
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            class task-list
              private items list of task-view = list

              mutable function add; item task-view
                this.items = this.items.append; item

              function show;
                for item in this.items
                  print; (item.render;)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The private list stores interface-typed values. `task-list` does not need an
            `if` that asks which class each item belongs to. It invokes the operation
            guaranteed by `task-view`, and dynamic behavior selects the appropriate
            implementation.

            The assignment in `add` is intentional:
        - type: example
          id: legacy-fence-059
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            this.items = this.items.append; item
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            It makes the containing field update visible to the compiler and keeps the
            changed list in `items`.

            Here is `main`:
        - type: example
          id: legacy-fence-060
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function main;
              chapter = instance task; 'Draft chapter', 'writing'
              chapter.mark-complete;

              review = instance urgent-task; 'Review examples', 'book'

              tasks = instance task-list;
              tasks.add; chapter
              tasks.add; review
              tasks.show;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The complete program is:
        - type: example
          id: legacy-fence-061
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            namespace task-list-project

            from /core/collections import list

            interface task-view
              function render string;

            trait categorized
              category string = 'general'

              function render-category string;
                return ' ('.concat; this.category, ')'

            class task implements task-view uses categorized
              title string = ''
              completed bool = false

              function construct; title string, category string = 'general'
                this.title = title
                this.category = category

              mutable function mark-complete;
                this.completed = true

              function render string;
                if this.completed
                  return '[done] '.concat; this.title, (this.render-category;)
                return '[ ] '.concat; this.title, (this.render-category;)

            class urgent-task extends task
              function render string;
                if this.completed
                  return '[done, urgent] '.concat; this.title, (this.render-category;)
                return '[urgent] '.concat; this.title, (this.render-category;)

            class task-list
              private items list of task-view = list

              mutable function add; item task-view
                this.items = this.items.append; item

              function show;
                for item in this.items
                  print; (item.render;)

            function main;
              chapter = instance task; 'Draft chapter', 'writing'
              chapter.mark-complete;

              review = instance urgent-task; 'Review examples', 'book'

              tasks = instance task-list;
              tasks.add; chapter
              tasks.add; review
              tasks.show;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Run it with:
        - type: example
          id: legacy-fence-062
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane run task-list.trn
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            It prints:
        - type: example
          id: legacy-fence-063
          title: null
          language: text
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            [done] Draft chapter (writing)
            [urgent] Review examples (book)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Notice what each mechanism contributes:

            - `task` owns state and its state transition;
            - `urgent-task` is a concrete specialization of `task`;
            - `task-view` lets the collection accept both concrete classes;
            - `categorized` reuses a field and formatting method;
            - `task-list` hides collection storage behind the operations it wants to
              support.

            Also notice what the program does not contain. There is no manual tag saying
            which concrete task is stored, no switch that selects a rendering function, and
            no universal boxed “object value” in the source. The object contracts carry
            exactly the distinctions the program needs.
      sections:
