    - id: under-the-surface-the-object-model-is-a-semantic-abstraction
      title: "Under the surface: the object model is a semantic abstraction"
      blocks:
        - type: markdown
          markdown: |-
            The source program says that `urgent-task` extends `task`, implements
            `task-view`, and receives behavior from `categorized`. Those are observable
            language contracts. They do not prescribe one matching family of Rust runtime
            objects.

            The compiler might realize a closed group of classes as structs and an enum. It
            might turn an interface call into a direct call when the concrete class is
            known. It might use dynamic dispatch when the concrete alternatives must remain
            open. It might flatten inherited fields, specialize a method, or remove a
            descriptor that no runtime behavior can observe.

            All of those choices are permitted if they preserve the Terrane program's
            behavior.

            This is the companion to “everything is an object semantically”:

            > No particular runtime object representation follows from that fact.

            The relationship between Terrane's semantic object model and its runtime
            representation is intentionally not one-to-one. A member may cease to exist as a
            runtime lookup because the compiler has already proved which operation it means.
            An object may need no heap allocation. An interface may require no vtable in a
            program where every call target is statically known.

            The programmer describes the behavior the program must appear to have. The
            compiler produces Rust that satisfies that description. Chapter 13 will inspect
            that generated Rust directly; for now, the important rule is not to design
            Terrane source around a guessed backend layout.
      sections: []
    - id: exercises
      title: Exercises
      blocks:
        - type: markdown
          markdown: |-
            1. Add a `mutable function reopen` method to `task`. It should set `completed`
               back to `false`. Complete a task, print it, reopen it, and print it again.

            2. Add a `rank int` field to `urgent-task`. Give it a default value and include
               it in a method that reports whether one urgent task should be considered
               before another. Keep the exercise focused on behavior; do not expose private
               collection storage merely to sort it.

            3. Define a second class, `note`, that implements `task-view` without extending
               `task`. Give it one string field and a `render` implementation. Add both a
               `note` and a `task` to `task-list`. This tests whether the interface
               describes behavior rather than ancestry.

            4. Move `completed` behind `private` visibility. Add an `is-complete bool`
               method and adjust `urgent-task` so that it can still implement its rendering
               behavior. What visibility would be required if a subclass must read the
               stored field directly?

            5. Create a second trait that also declares `render-category`. Use it alongside
               `categorized` and read the compiler diagnostic. Then remove the conflict by
               deciding which single implementation the class should use; do not depend on
               trait order.

            6. Add a `consuming function destruct` method to a small experimental class that
               prints its name. Construct two independent values in `main` and observe
               cleanup order. Then assign one value to another name and consider why
               independently owned values each have their own lifecycle. Keep `destruct` out
               of the task-list design unless cleanup is actually part of that domain.
      sections: []
    - id: what-we-learned
      title: What we learned
      blocks:
        - type: markdown
          markdown: |-
            A class gives related state and behavior one concrete home.
            `instance class; arguments` constructs a fresh semantic instance, and
            `construct` establishes its initial state. Instance methods use `this`; field
            types keep the object's shape valid; an explicitly consuming `destruct`
            expresses deterministic cleanup when a value genuinely owns such work. Shared,
            mutable, and consuming method headers state receiver authority rather than
            hiding it in body inference.

            Visibility protects meaningful invariants. Single inheritance extends one
            concrete class and preserves the complete dynamic value. An interface is a named
            nominal behavior contract that different classes can adopt at a typed dispatch
            boundary. A Terrane trait composes reusable source implementation but is not
            itself a type—and is not the analogue of a Rust trait. Protocols remain unnamed
            structural operation shapes rather than another declaration kind.

            The distinctions are most useful when kept sharp:

            - use a class for a concrete stateful concept;
            - use inheritance for an honest is-a relationship;
            - use an interface for behavior required by a boundary;
            - use a trait for shared implementation;
            - use ordinary values and functions when none of those improves the design.

            In the next chapter, we will make the type contracts used here more deliberate.
            We will begin with inference, add annotations where they communicate intent, and
            strengthen the task-list program without turning every obvious value into a
            declaration ceremony.
      sections: []
