  title: Preface
  title-style: text
  summary: >-
    An approachable first program should have room to become a serious one.
  tags:
    - preface
    - language-design
    - native-code
    - learning
  blocks:
    - type: markdown
      markdown: |-
        There is a particular pleasure in making a small program work. An idea that
        existed only in your head becomes something you can run, inspect, and change. A
        few names, a calculation, a loop: enough to make the machine do something
        useful.

        It is a pleasure worth keeping as the program grows.

        Too often, growth comes with a change of terms. The language that made the first
        version easy becomes difficult to deploy or expensive to run. The route to
        native libraries and closer control lies elsewhere. Or the costs arrive at the
        beginning: before a program has done anything useful, its author must learn
        machinery whose purpose is not yet apparent.

        Terrane starts with a question: how much of that tradeoff is necessary?

        Its ambition is to be fast to write and fast to run. You begin with ordinary
        values, functions, collections, and loops. The compiler turns that source into
        Rust and uses the native toolchain to build an executable. The small program is
        not a demonstration in a simplified dialect. It takes the same route as the
        larger one you may eventually build.

        Source is not only written. It is read, reviewed, changed, and explained.
        Terrane values making those activities easier over saving a few keystrokes.
        Assignment should not create shared mutable identity by accident. A call should
        visibly be a call. An import should tell you which names it introduces. When
        ordinary operations make their intent clear, there is more attention left for
        the problem the program exists to solve.

        Larger problems still demand more of us. Types can make a boundary precise;
        explicit ownership can express who is responsible for a value; structured
        concurrency can give independent work a place to belong. These facilities should
        enter a design because they help explain it, not because every program must
        demonstrate them.

        A program can be easier to write without becoming harder to inspect. Terrane can
        spare you the work of writing a mechanism while letting you see the one the
        compiler chose. The generated Rust is available when you want to understand a
        decision, investigate a cost, or follow a failure. You do not need to understand
        every layer to use Terrane, but growing curiosity should have somewhere to go.

        None of this makes difficult software easy. A clear language cannot choose the
        right algorithm, discover a missing requirement, or make a bad measurement
        trustworthy. It can help you see what you have written and change it without
        losing your bearings. That is already a substantial contribution.

        Terrane is experimental, and this book is part of the work of finding out
        whether its ideas hold together. A design that looks convincing in a
        specification must also survive being explained and used. If a small project
        repeatedly fights the language, that is something worth learning about the
        language—not merely a failing of its reader.

        This book begins with small projects for that reason. We will give values names,
        make decisions, repeat work, and put functions together. Then we will ask more
        of the programs we have made. The aim is not to rush past the basics, but to
        discover how far carefully chosen basics can take us.

        Let us begin with one program.
