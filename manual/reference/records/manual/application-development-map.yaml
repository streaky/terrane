documentation:
  status: complete
  title: Application development map
  title-style: text
  summary: >-
    Routes experienced developers to the authoritative reference for building, testing, integrating, running, debugging, and
    profiling a normal application.
  tags: [manual, applications, navigation, packages]
  sections:
    - id: start
      title: Start a package
      blocks:
        - type: table
          id: application-routes
          title: Task-oriented routes
          show-header: true
          columns:
            - id: task
              title: Task
              cell: text
            - id: route
              title: Authoritative route
              cell: markdown
          rows:
            - task: Create a package and choose its artifact
              route: "[[tool.packages.package-manifest]]"
            - task: Split code across files and namespaces
              route: "[[tool.packages.package-manifest#namespaces-and-artifacts]] and [[lang.lexical-structure.keywords]]"
            - task: Define public classes and interfaces
              route: "[[lang.classes.fields]] and [[lang.classes.protocols]]"
            - task: Read command-line arguments
              route: "[[tool.packages.command-line]]"
            - task: Read and write files
              route: "[[std.filesystem]] and [[std.paths]]"
            - task: Parse YAML and JSON
              route: "[[std.documents.typed-decoding]]"
            - task: Report and propagate errors
              route: "[[app.error-boundaries]]"
            - task: Add a Rust dependency
              route: "[[tool.packages.rust-dependencies]]"
            - task: Add and run tests
              route: "[[tool.packages.testing]]"
            - task: Build and run an executable
              route: "[[tool.packages.command-line]] and [[tool.packages.package-manifest#namespaces-and-artifacts]]"
            - task: Produce a dynamic library
              route: "[[tool.packages.package-manifest#namespaces-and-artifacts]]"
            - task: Debug source and generated code
              route: "[[tool.debugging]]"
            - task: Profile optimized native execution
              route: "[[tool.profiling]]"

    - id: common-foundations
      title: Common application foundations
      blocks:
        - type: markdown
          markdown: |-
            Before crossing a host or dependency boundary, review
            [[lang.types.authority-in-practice]] and [[app.collection-string-idioms]]. They
            provide the declaration and call forms most likely to otherwise send an
            application author into compiler source or conformance fixtures.

            For exact compiler availability rather than intended language semantics, use
            [[tool.current-limitations]] and the generated symbol catalog linked from the
            repository entry point.
  see-also:
    - tool.packages.package-manifest
    - lang.types.authority-in-practice
    - app.collection-string-idioms
    - app.error-boundaries

