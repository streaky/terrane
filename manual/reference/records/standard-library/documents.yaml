notes:
  implementation: >-
    The compiler emits destination-specific Rust construction glue because the selected Terrane class has a statically specialized
    Rust representation.
  compatibility: null
  security: >-
    JSON/YAML parser limits and duplicate-key rejection run before typed conversion. Unknown fields require explicit policy.
  performance: >-
    Decoding constructs the known destination directly and does not allocate a universal boxed runtime value.

