documentation:
  status: complete
  title: Typed document decoding
  title-style: text
  summary: >-
    Decodes bounded JSON and YAML into explicitly opted-in class trees while accumulating typed, source-mapped diagnostics.
  tags:
    - documents
    - json
    - yaml
    - decoding
  sections:
    - id: opt-in
      title: Opt-in and supported shapes
      blocks:
        - type: rule
          id: rule.documents.typed-decoding-opt-in
          level: must
          since: null
          evidence:
            - typed-document-decoding
            - typed-document-requires-opt-in
            - typed-document-custom-construction
            - typed-document-unsupported-field
          markdown: |-
            `decode-typed-json` and `decode-typed-yaml` require source text, a concrete
            class descriptor implementing `document-decodable`, the matching parser options,
            and an explicit `allow-unknown` boolean.

            Derived decoding supports scalars, nested opted-in classes, lists, homogeneous
            tuples, and maps with string keys. Every nested value must be decodable.
            Resource-owning, inherited, custom-constructed, recursively sized, and otherwise
            unsupported classes must implement `deserializable` manually.
        - type: note
          id: note.documents.no-derived-encoding
          style: warning
          markdown: |-
            Compiler-derived mapping currently covers document input only. There is no
            matching derived class-to-document encoder. A class may implement `serializable`
            with an explicit `to-document` method, but that method is responsible for
            external field names, nested values, optional policy, finite numeric output, and
            any secrecy rule.
    - id: mapping
      title: Mapping and numeric rules
      blocks:
        - type: rule
          id: rule.documents.typed-decoding-mapping
          level: must
          since: null
          evidence:
            - typed-document-decoding
          markdown: |-
            External keys come from the class field descriptor. Missing fields retain their
            canonical type default or explicit initializer; absent `T|none` fields retain
            their initialized optional value. Fields without a default diagnose. Unknown
            fields are recursively rejected or ignored only by the explicit call policy.

            Integer conversions are exact and range checked. Decimal or integer input to a
            binary float rounds to the nearest finite destination value, ties-to-even, just
            as in an ordinary floating destination. Input outside the destination's finite
            range diagnoses.
    - id: diagnostics
      title: Outcomes, diagnostics, and validation
      blocks:
        - type: rule
          id: rule.documents.typed-decoding-diagnostics
          level: must
          since: null
          evidence:
            - typed-document-decoding
          markdown: |-
            A typed decode outcome carries the concrete initialized destination and a
            deterministic typed list of all diagnostics. `failed` is true exactly when that
            list is non-empty. A failure value is an ordinary initialization fallback, not
            partially decoded success.

            Diagnostics carry path, expected type, actual kind, reason, message, decode-call
            source, and field-declaration source. A class may also implement
            `document-validatable`; `validate-document` returns `string|none` after
            error-free field mapping. A returned string is a validation diagnostic.
