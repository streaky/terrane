documentation:
  status: complete
  title: Built-in collections
  title-style: text
  summary: >-
    Defines the built-in list, map, set, tuple, range, entry, and deterministic unordered collection types together with their
    current operations.
  tags:
    - standard-library
    - collections
    - list
    - map
    - set
    - tuple
    - range
    - iteration
    - unordered-map
    - unordered-set
    - entry
    - bytes
  sections:
    - id: collection-kinds
      title: Collection types and their differences
      blocks:
        - type: rule
          id: rule.collections.kinds
          level: must
          since: null
          evidence:
            - collections-value-semantics
            - tuple-type-boundaries
            - collection-identity-lifetime
          markdown: |-
            Terrane distinguishes collections by value shape, ordering contract, and
            permitted mutation. Choosing `unordered-map` or `unordered-set` changes the
            visible type and ordering guarantee; it is not a hidden implementation option on
            `map` or `set`.
        - type: table
          id: collection-kind-comparison
          title: Built-in collection types
          show-header: true
          columns:
            - id: type
              title: Type
              cell: code
            - id: contents
              title: Contents
              cell: text
            - id: order
              title: Ordering
              cell: text
            - id: shape
              title: Shape and mutation
              cell: text
          rows:
            - type: list of Item
              contents: Homogeneous values; duplicates are retained.
              order: Positional insertion order.
              shape: Variable length; supports append, indexed replacement, indexed removal, and clear.
            - type: tuple of Item
              contents: Homogeneous positional values; runtime length is not part of the type.
              order: Construction order.
              shape: Fixed length after construction; no append, replacement, removal, or clear.
            - type: map of Key, Value
              contents: One value per immutable scalar key.
              order: Key insertion order is observable.
              shape: Variable membership; supports lookup and insertion/replacement, but not key removal or clear.
            - type: unordered-map of Key, Value
              contents: One value per immutable scalar key.
              order: Deterministic but does not preserve insertion order.
              shape: Same current operations as map, with a weaker ordering guarantee visible in its type.
            - type: set of Item
              contents: Unique immutable scalar values.
              order: Value insertion order is observable.
              shape: Variable membership; supports contains, add, and remove, but not clear.
            - type: unordered-set of Item
              contents: Unique immutable scalar values.
              order: Deterministic but does not preserve insertion order.
              shape: Same current operations as set, with a weaker ordering guarantee visible in its type.
            - type: range
              contents: An integer progression defined by start, end, and non-zero step.
              order: Numeric progression in the authored step direction.
              shape: Immutable half-open or explicitly inclusive traversal value.
            - type: entry of Key, Value
              contents: One immutable scalar key paired with one value.
              order: Carries no independent ordering; map traversal determines entry order.
              shape: Fixed key/value pair used for construction, map views, and iteration.

        - type: markdown
          markdown: |-
            `iterator of Item` and `iteration-step of Item` are linear traversal protocol
            values, not stored collections. `bytes` is a distinct immutable byte-sequence
            value: it exposes `.length`, integer and range indexing, and `uint8` iteration,
            but it is not `list of uint8`. Strings are text values with explicit byte,
            scalar, and grapheme views rather than general collections.
    - id: construction-and-types
      title: Construction and applied types
      blocks:
        - type: rule
          id: rule.collections.construction
          level: must
          since: null
          evidence:
            - collections-value-semantics
            - collection-contextual-typing
            - collection-boundary-contextual-typing
            - nested-collection-contextual-typing
            - tuple-type-boundaries
          markdown: |-
            Import collection constructors from `/core/collections`. Ordinary invocation
            constructs values: `list; a, b`, `map; first=1`, `set; a, b`, `tuple; a, b`, and
            `entry; key, value`. A map whose keys are not construction-argument names
            accepts `entry` values. Duplicate set items retain one value at their first
            insertion position.

            Declared collection types use recursive constructor application: `list of Item`,
            `map of Key, Value`, `set of Item`, `tuple of Item`,
            `unordered-map of Key, Value`, `unordered-set of Item`, and
            `entry of Key, Value`. Map, set, and entry keys must be immutable scalar values.
            A bare constructor such as `list` is a value constructor, not a complete type.

            Empty lists, maps, sets, unordered maps, and unordered sets have a canonical
            default when their destination supplies the applied type. Tuples have no
            canonical field default. A heterogeneous collection literal requires an explicit
            finite-union destination; construction never widens elements to an untyped
            dynamic value.
    - id: lookup
      title: Lookup and checked absence
      blocks:
        - type: rule
          id: rule.collections.lookup
          level: must
          since: null
          evidence:
            - collection-lookup-errors
            - checked-map-int-refinement
          markdown: |-
            `items[index]` and `items.get.checked; index` read lists and tuples. Default
            indexing throws `index-error` when the integer is negative, unrepresentable, or
            outside the collection. The checked form returns `Item|none`.

            `mapping[key]` and `mapping.get.checked; key` read maps and unordered maps.
            Default lookup throws `missing-key`; the checked form returns `Value|none`.
            Absence is always requested through the `checked` child: the default operation
            never silently returns `none`.

            Index assignment and `.set` mutate their receiver and perform copy-on-write
            separation when another logical collection value retains the previous contents.
    - id: lists-and-tuples
      title: Lists and tuples
      blocks:
        - type: rule
          id: rule.collections.lists-and-tuples
          level: must
          since: null
          evidence:
            - collections-value-semantics
            - collection-identity-lifetime
            - list-append-bulk-mutation
            - tuple-type-boundaries
            - tuple-append-fixed
            - stable-list-sorting
          markdown: |-
            Lists expose `.length`, integer indexing, `.get.checked`, `.append; value`,
            `.set; index, value`, `.remove; index`, `.clear;`, `.sort;`, and
            `.sort.descending;`. Append, set, clear, and both sort forms mutate and return
            the resulting list. Remove transfers and returns the removed item; an invalid
            index throws `index-error`. Sorting is stable and admits only integer, floating,
            and string item descriptors; it rejects optional, union, boolean, object,
            collection, reference, resource, and comparator-callback forms.

            Tuples expose `.length`, integer indexing, and `.get.checked`. They are
            homogeneous and fixed-length after construction, so they have no append, set,
            remove, or clear operation. Runtime length is not part of `tuple of Item`;
            tuples of different lengths cross the same typed boundary when their item type
            agrees.
    - id: maps-and-entries
      title: Maps and entries
      blocks:
        - type: rule
          id: rule.collections.maps-and-entries
          level: must
          since: null
          evidence:
            - collections-value-semantics
            - entry-valued-maps
            - map-entry-destructuring
            - map-key-removal
          markdown: |-
            Maps and unordered maps expose `.length`, key lookup, `.get.checked`,
            `.set; key, value`, `.remove; key`, `.remove.checked; key`, `.keys;`,
            `.values;`, and `.entries;`. Default removal transfers and returns the stored
            value or throws `missing-key`; checked removal returns `Value|none`. A miss
            leaves storage unmodified. Set returns the resulting map. Keys, values, and
            entries return typed lists in the map's iteration order. An entry exposes cloned
            `.key` and `.value` properties.

            Iterating a map yields `entry of Key, Value`. A `for` loop may bind that entry
            as one value or destructure it directly as `for key, value in mapping`. The loop
            bindings are logical values; changing them does not mutate the map.
    - id: sets
      title: Sets
      blocks:
        - type: rule
          id: rule.collections.sets
          level: must
          since: null
          evidence:
            - collections-value-semantics
          markdown: |-
            Sets and unordered sets expose `.length`, `.contains; value`, `.add; value`, and
            `.remove; value`. Contains and remove return `bool`; add returns the resulting
            set. Adding an existing value leaves membership unchanged.
        - type: note
          id: note.collections.set-clear-boundary
          style: warning
          markdown: |-
            The current set and unordered-set surface has no clear operation.
    - id: ranges
      title: Ranges
      blocks:
        - type: rule
          id: rule.collections.ranges
          level: must
          since: null
          evidence:
            - collections-value-semantics
          markdown: |-
            `range; start, end, step?` constructs a half-open integer range;
            `range.through; start, end, step?` includes the authored end. Step defaults to
            `1` and must not be zero. A step directed away from the end yields an empty
            range rather than an error or unbounded iteration. Iteration visits indices in
            authored order.
    - id: ordering-iteration-and-lifetime
      title: Ordering, iteration, and lifetime
      blocks:
        - type: rule
          id: rule.collections.ordering-and-iteration
          level: must
          since: null
          evidence:
            - collections-value-semantics
            - map-entry-destructuring
            - collection-identity-lifetime
            - iterator-protocol
            - map-key-removal
            - stable-list-sorting
            - discarded-temporary-list-append
            - discarded-temporary-list-sort
          markdown: |-
            Lists and tuples iterate in value order; maps and sets iterate in insertion
            order. Removing an ordered-map key preserves the relative order of every
            remaining entry, and reinserting it places it at the end. Unordered maps and
            sets do not promise insertion order, but identical operation sequences are
            reproducible. New items append to the current traversal sequence, while removal
            may fill the removed position with the prior final item. Their order may
            therefore depend on prior removals and insertions, so content-equal values
            reached through different histories need not traverse identically. Milestone
            29.0 intentionally replaced the earlier stable-hash traversal with this
            append/swap-fill behavior so insertion and removal are both expected amortized
            constant time. Code must not depend on unordered output produced by an older
            compiler.

            List sorting is stable. Strings compare lexicographically by Unicode scalar
            sequence, and integers by mathematical value. Floating infinities retain numeric
            order, signed zeros compare equal, and all NaNs form one stable final bucket in
            both directions. Descending sort compares directly rather than reversing
            ascending output.

            `for` takes a value snapshot of a built-in collection. Mutating or replacing the
            source binding during the loop does not change the remaining traversal. The
            iterator is a linear state machine and is consumed when transferred into `for`.

            A statement-form mutable collection call requires a retained binding receiver.
            An `entry.value` or indexed element is a snapshot value: mutating it and
            discarding the result is rejected because no observable destination exists.
            Terrane does not implicitly write the value back; consume and store the result
            explicitly, for example `nested.set; index, (nested[index].append; value)`.

            Collections are identity-less values even when copy-on-write storage is shared.
            Replacement, removal, clear, and destruction have observable release ordering
            for contained values. See the collection language-contract and lowering pages
            for iterator protocol and detailed lifetime rules.
