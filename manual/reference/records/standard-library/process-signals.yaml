documentation:
  status: complete
  title: Process signal subscriptions
  title-style: text
  summary: >-
    Describes selected linear subscriptions to interrupt, terminate, hangup,
    and quit process signals.
  tags:
    - standard-library
    - process
    - signals
    - async
  sections:
    - id: subscriptions
      title: Selected subscriptions
      blocks:
        - type: rule
          id: rule.process-signals.subscriptions
          level: must
          since: null
          evidence:
            - process-signals-surface
            - process-signals-delivery
          markdown: |-
            `process-signals` accepts a non-empty set containing
            `process-signal::interrupt`, `::terminate`, `::hangup`, and/or `::quit`, then
            returns a linear single-consumer subscription. `next` asynchronously returns one
            selected event and `close` consumes the subscription. Importing the package
            requires the narrow `process-signals` capability.
    - id: delivery
      title: Delivery and lifecycle
      blocks:
        - type: rule
          id: rule.process-signals.delivery
          level: must
          since: null
          evidence:
            - process-signals-delivery
          markdown: |-
            An event contains its signal kind, exact coalesced count, deterministic
            sequence, monotonic `observed-at` timestamp, and overflow status. Each
            subscription retains at most one pending event per signal kind. Cancelling a
            pending `next` does not consume a retained event.

            The host handler performs only signal-safe counting and wakeup. Closing the last
            interested subscription restores the exact prior host disposition for that
            signal kind and joins the broker worker. Receiving a signal never implicitly
            cancels a task scope or exits the process.
