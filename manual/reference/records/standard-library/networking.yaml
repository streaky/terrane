documentation:
  status: complete
  title: Asynchronous networking operations
  title-style: text
  summary: >-
    Describes the asynchronous TCP, UDP, DNS, and TLS operations, their deadline and cancellation options, and their executor
    behavior.
  tags:
    - standard-library
    - networking
    - async
    - tcp
    - udp
    - dns
    - tls
  sections:
    - id: operations
      title: Operations and results
      blocks:
        - type: rule
          id: rule.networking.async-operations
          level: must
          since: null
          evidence:
            - networking-tcp-loopback
            - networking-udp-loopback
            - networking-values
          markdown: |-
            TCP connect, listener accept, stream read and write, UDP send and receive, and
            DNS lookup are asynchronous operations. Call them in an `async function` and
            consume the returned task with `await`. TLS client handshake, encrypted read and
            write, and shutdown use the same task contract.

            The existing result values remain explicit: callers inspect fields such as
            `failed`, `deadline-exceeded`, `message`, data, completion count, and peer
            address as appropriate to the operation. Ordinary TLS connection always performs
            certificate chain and hostname validation.
    - id: cancellation
      title: Deadlines and cancellation
      blocks:
        - type: rule
          id: rule.networking.deadline-cancellation
          level: must
          since: null
          evidence:
            - networking-values
            - cancelled-stream-operation
          markdown: |-
            `network-operation-options` carries a typed `/core/time` deadline and
            cancellation token. `none` means that no deadline is installed; it is not
            translated to an immediate timeout. A deadline or cancellation request is
            reported through the operation's established result contract; it does not detach
            the task or permit its scoped handle to be left unjoined.
    - id: scheduling
      title: Executor scheduling
      blocks:
        - type: rule
          id: rule.networking.executor-progress
          level: must
          since: null
          evidence:
            - networking-tcp-loopback
            - networking-readiness-outcomes
          markdown: |-
            Compiler-owned asynchronous socket operations suspend on readiness through the
            runtime selected by the package executor profile. TLS uses the same asynchronous
            transport. Host-name connection delegates DNS resolution, then races socket
            candidates on the selected runtime. Interfaces that remain unavoidably blocking,
            including the current standalone resolver, are delegated to the runtime's
            bounded blocking pool.

            A pending standard-input or socket operation therefore does not occupy an
            executor worker or prevent unrelated tasks from making progress. Socket deadline
            and cancellation results retain the same explicit source contract as other
            network failures.
