documentation:
  status: complete
  title: Structured logging
  title-style: text
  summary: >-
    Describes explicit loggers and sinks, structured lazy values, source provenance, deterministic memory records, filtering,
    and redaction.
  tags:
    - standard-library
    - logging
    - observability
    - structured-data
  sections:
    - id: construction
      title: Explicit loggers and deterministic sinks
      blocks:
        - type: rule
          id: rule.logging.construction
          level: must
          since: null
          evidence:
            - structured-logging
            - logging-bounds
            - logging-capability
          markdown: |-
            Import `/core/logging` under a profile that grants `logging`.
            `memory-sink; capacity, overflow, start-timestamp, timestamp-step, reveal-secrets`
            creates an explicitly bounded sink. Overflow is `drop-newest`, `drop-oldest`, or
            `reject`; invalid construction returns a failed `log-sink-result`.
            `discarded-count` reports how many writes either dropping policy discarded.

            `console-sink` emits the same stable structured encoding through the host
            console. `failing-sink` deliberately rejects writes; `drain-fallback` observes
            one minimal diagnostic per rejection. Fallback capture does not call the
            rejected sink and cannot recurse.

            `default-logger` and `named-logger` accept a concrete sink. The general
            `make-logger` additionally accepts `logger-options` with a minimum severity,
            hierarchical target prefix, target, maximum field count, and maximum encoded
            byte count. There is no ambient application logger.
    - id: events
      title: Structured events and values
      blocks:
        - type: rule
          id: rule.logging.events
          level: must
          since: null
          evidence:
            - structured-logging
            - logging-bounds
          markdown: |-
            `debug`, `info`, `warning`, `error`, and general `emit` retain the controlled
            timestamp, monotonic per-sink sequence, severity, target, message, ordered
            structured fields, emission call site, active span names, and Terrane origin.
            `field` and `secret-field` retain their own construction call sites.

            A field carries a `log-value` renderer. Built-in text, document, and
            throwable-chain adapters and user implementations render to a bounded
            `document-value`; there is no universal debug formatter. Severity and dotted
            target-prefix filters run before a renderer or sink is called. `with-field` and
            `with-span` return enriched copies and do not mutate the source logger.
    - id: redaction
      title: Redaction and deterministic capture
      blocks:
        - type: rule
          id: rule.logging.redaction
          level: must
          since: null
          evidence:
            - structured-logging
          markdown: |-
            A secret field is not rendered unless its selected sink was explicitly created
            with reveal permission. Otherwise only the structured string `"<redacted>"`
            crosses the sink boundary. Descriptor-driven adapters use class field metadata
            `secret = true`; logging defines no second secrecy annotation.

            `drain-memory` returns stable canonical event records and empties the sink.
            Controlled clock values and per-sink sequence numbers make identical emissions
            byte-identical across runs.
    - id: async-transport
      title: Typed asynchronous transport
      blocks:
        - type: rule
          id: rule.logging.async-transport
          level: must
          since: null
          evidence:
            - structured-logging
          markdown: |-
            `/core/logging/async` additionally requires `threads`. `send-event` accepts an
            existing `channel-sender of log-event` and returns whether that typed channel
            accepted the value. `consume-events` drains a `channel-receiver of log-event`
            into an explicit sink until closure, returning `false` on sink failure.
            Capacity, backpressure, overflow, closure, and cancellation remain the channel's
            documented policy; logging does not allocate another queue. `make-event`
            preserves its caller source.
    - id: dependency-bridge
      title: Projected dependency events
      blocks:
        - type: rule
          id: rule.logging.dependency-bridge
          level: must
          since: null
          evidence:
            - dependency-observability
          markdown: |-
            `install-dependency-bridge` explicitly connects the process-global Rust `log`
            and `tracing` facades to the supplied logger's concrete sink. Installation may
            fail when another global logger or subscriber is already installed; there is no
            implicit bridge or ambient Terrane logger. Platform support exposes its tracing
            layer separately so a host may compose an optional remote-reporting layer into
            the same subscriber. With no such integration, no additional layer or callback
            runs.

            Captured dependency events preserve their original severity, target, structured
            event fields, `log` key-value fields, active tracing span names and fields,
            module, file, and line. An unsupported field value is debug-rendered under
            `<field>.debug` rather than silently disappearing. Absolute Cargo source paths
            are normalized to stable crate-relative paths when possible. Their origin is
            `dependency`, and their source begins with `dependency://`; the bridge never
            manufactures a Terrane call site for foreign work.
