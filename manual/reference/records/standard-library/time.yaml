documentation:
  status: complete
  title: Exact time, deadlines, sleeps, and tickers
  title-style: text
  summary: >-
    Describes exact duration values, wall and monotonic clocks, absolute
    deadlines, wake-driven sleeps, and anchored ticker delivery.
  tags:
    - standard-library
    - time
    - async
  sections:
    - id: values
      title: Exact time values
      blocks:
        - type: rule
          id: rule.time.values
          level: must
          since: null
          evidence:
            - time-exact-values
            - time-negative-duration
          markdown: |-
            `duration` is an exact non-negative value. `seconds` contains the whole-second
            component, `nanoseconds` contains the canonical fractional component in
            `0..999999999`, and `total-nanoseconds` retains the arbitrary-precision total.
            Construct values with `duration::seconds`, `::milliseconds`, `::microseconds`,
            or `::nanoseconds`. Negative constants are rejected and dynamic negative inputs
            throw `invalid-duration`.

            `add` and `multiply` return exact durations. `subtract.checked` returns a
            duration when the result is non-negative and `none` otherwise. These operations
            do not narrow through a host timer width; a very large exact duration remains
            representable even when a particular wait must be registered in bounded host
            chunks.

            `clock::wall` returns a UTC `instant` with canonical Unix seconds and
            nanoseconds. Wall time is appropriate for timestamps exchanged outside the
            process, but it may move when the host clock is adjusted. `clock::monotonic`
            returns a `monotonic-instant` from the current runtime activation. Monotonic
            values never move backward within that activation and are the basis for elapsed
            time, deadlines, sleeps, and ticker schedules.

            `duration-until` subtracts two values in the same time domain and throws
            `invalid-duration` for a reversed interval or mismatched monotonic domains.
            Monotonic values are not portable timestamps and must not be persisted for use
            by another runtime activation.
    - id: deadlines
      title: Deadlines and sleeping
      blocks:
        - type: rule
          id: rule.time.deadlines
          level: must
          since: null
          evidence:
            - time-sleep-ticker
            - task-scope-typed-deadline
          markdown: |-
            `clock::deadline; elapsed` reads the monotonic clock once and captures an
            absolute target immediately. `deadline::at; target` retains an existing
            monotonic target after validating its runtime domain. `expires-at` exposes the
            target, `remaining` returns an exact duration or `none`, and `expired` reports
            whether the target has passed. Calling `remaining` repeatedly observes the same
            target; it does not restart a relative timeout.

            `clock::sleep; elapsed` constructs a linear task and captures its absolute
            target when the call expression is evaluated, not when a later `await` first
            polls it. This makes it suitable for an overall budget that continues to elapse
            while other work runs. `clock::sleep-until; target` constructs the corresponding
            task for an existing monotonic target. A target at or before the current
            observation completes without an additional delay.

            Pending sleeps register wake-driven host timers rather than repeatedly polling
            the clock. Cancelling the task, including when it loses a `select`, drops the
            pending timer registration before execution continues. Cancellation does not
            change the captured target or turn the task into a reusable timer.
    - id: tickers
      title: Anchored tickers
      blocks:
        - type: rule
          id: rule.time.tickers
          level: must
          since: null
          evidence:
            - time-sleep-ticker
            - time-zero-ticker
          markdown: |-
            `clock::interval; period` creates a linear ticker anchored at the call's
            monotonic observation. The period must be greater than zero; a known zero
            constant is rejected and a dynamic zero throws `invalid-duration`. The first
            scheduled expiration is one period after the anchor.

            `next` asynchronously returns a `tick` with:

            - `scheduled`: the latest scheduled instant represented by this delivery;
            - `observed`: the monotonic instant at which it was delivered;
            - `count`: the exact number of scheduled expirations coalesced into the
              delivery, always at least one.

            If the consumer is late by several periods, `next` returns one delivery rather
            than an immediate replay burst. Its `count` includes every expiration since the
            prior delivery, and `scheduled` identifies the most recent one not later than
            `observed`. The following expiration is calculated from the original anchor, not
            from observation time, so late consumers do not introduce cumulative schedule
            drift.

            `scheduled.duration-until; ref observed` measures delivery lateness without
            consulting adjustable wall time. Code should not assume an upper timing bound
            merely because the period is exact: executor scheduling and host load may delay
            observation.

            A ticker has one mutable consumer. `next` temporarily owns its pending wait,
            while `destruct` consumes the longer-lived ticker resource. Cancelling a pending
            `next` removes only that wait; the ticker remains available after loser cleanup.
    - id: coordination
      title: Coordinating timers with selection
      blocks:
        - type: rule
          id: rule.time.selection
          level: must
          since: null
          evidence:
            - time-sleep-ticker
            - select-task-outcomes
          markdown: |-
            Construct a sleep task before unrelated work when the timer represents an
            overall budget. Retain that linear task and consume it later in a `select`
            alongside a ticker wait, network operation, or other asynchronous task:
        - type: example
          id: legacy-fence-001
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            budget = clock::sleep; (duration::seconds; 30)
            heartbeats ticker = clock::interval; (duration::seconds; 1)

            select
                case pulse tick = await heartbeats.next;
                    print; pulse.count
                case await budget
                    print; 'budget expired'

            heartbeats.destruct;
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The call that creates `budget` fixes the deadline before selection. After one
            case wins, selection cancels and drains the losing wait. That cleanup removes
            the losing timer or ticker waiter, but it does not consume the ticker itself;
            its owner must still destruct it.
