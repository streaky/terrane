documentation:
  status: complete
  title: Filesystem access
  title-style: text
  summary: >-
    Acquires explicit filesystem authority and performs bounded byte reads, atomic writes, metadata queries, and handle-based
    I/O through result objects.
  tags: [standard-library, filesystem, capabilities, bytes, io]
  sections:
    - id: authority
      title: Authority and package capability
      blocks:
        - type: rule
          id: rule.filesystem.explicit-authority
          level: must
          since: null
          evidence: []
          markdown: |-
            A package must admit `filesystem` in `profile.capabilities` before it may import
            `/core/filesystem`. Calling `filesystem-capability` acquires the authority value
            passed as the first parameter to filesystem operations. Possessing a `path`
            alone grants no access.

            The authority is an ordinary value parameter. File and directory handles are
            resource-owning values: functions taking `file ref file-handle` borrow a live
            handle, while `file-close` consumes it.
    - id: whole-file-synopsis
      title: Bounded reads and atomic writes
      blocks:
        - type: markdown
          markdown: |-
            The following synopsis is checked against the compiler-owned `/core/filesystem`
            declarations by `tools/generate_manual_catalog.py`.
        - type: example
          id: legacy-fence-001
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function filesystem-capability filesystem;
            function filesystem-read-bounded file-data; capability filesystem, target path, limit int
            function filesystem-write-atomic filesystem-operation-result; capability filesystem, target path, data bytes
            function filesystem-rename filesystem-operation-result; capability filesystem, source path, destination path
            function filesystem-remove filesystem-operation-result; capability filesystem, target path
          response: null
          diagnostic: null
          markdown: null
        - type: table
          id: whole-file-results
          title: Whole-file operation contracts
          show-header: true
          columns:
            - id: operation
              title: Operation
              cell: code
            - id: result
              title: Result
              cell: code
            - id: failure
              title: Failure behavior
              cell: text
            - id: ownership
              title: Ownership
              cell: text
          rows:
            - operation: filesystem-read-bounded
              result: file-data
              failure: Sets failed and message; does not throw.
              ownership: Borrows no input; returns owned bytes.
            - operation: filesystem-write-atomic
              result: filesystem-operation-result
              failure: Sets failed and message; does not throw.
              ownership: Reads the byte value; retains no caller value.
            - operation: filesystem-rename
              result: filesystem-operation-result
              failure: Sets failed and message; does not throw.
              ownership: Reads both path values.
            - operation: filesystem-remove
              result: filesystem-operation-result
              failure: Sets failed and message; does not throw.
              ownership: Reads the path value.

        - type: note
          id: bounded-read-semantics
          style: information
          markdown: |-
            `filesystem-read-bounded` returns bytes in `file-data.data`. `completed` is the
            number of bytes returned. The current whole-file operation sets `end = true`
            after the host operation, so reaching the bound is not separately
            distinguishable from EOF through `end`. Applications that must reject an input
            at or above the bound compare `completed >= limit`; choose a limit above the
            largest accepted file when exact-bound files must be admitted.

            The operation never decodes text. Decode `data` explicitly with an encoding and
            catch `decode-error`; see [[std.text-bytes-codecs]].
        - type: note
          id: atomic-write-parent
          style: warning
          markdown: |-
            `filesystem-write-atomic` does not promise to create missing parent directories.
            The target's parent must already exist. Success means the destination was
            replaced atomically according to the host operation; inspect `failed` and
            `message` before treating the write as complete.
    - id: handles
      title: Handle-based I/O
      blocks:
        - type: example
          id: legacy-fence-002
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            function open-file file-handle; capability filesystem, target path, readable bool, writable bool, create bool = false, truncate bool = false
            function file-read file-data; capability filesystem, file ref file-handle, limit int
            function file-write file-data; capability filesystem, file ref file-handle, data bytes, offset int = 0
            function file-flush filesystem-operation-result; capability filesystem, file ref file-handle
            function file-sync-data filesystem-operation-result; capability filesystem, file ref file-handle
            function file-sync-all filesystem-operation-result; capability filesystem, file ref file-handle
            function file-close filesystem-operation-result; capability filesystem, file file-handle
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            `file-read.end` distinguishes stream exhaustion for an open handle.
            `file-write.completed` is the number of input bytes written. Flush and sync
            operations borrow the handle; close consumes it. Every operation reports host
            failure through result fields rather than a throwable.
    - id: example
      title: Read bounded UTF-8 and write atomically
      blocks:
        - type: example
          id: bounded-text-copy
          title: Copy a bounded UTF-8 file
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            namespace reference-examples/filesystem-copy

            from /core/encodings import utf8
            from /core/errors import decode-error
            from /core/filesystem import filesystem-capability, filesystem-read-bounded, filesystem-write-atomic
            from /core/filesystem/paths import path

            function copy-text bool; source string, destination string
              authority = filesystem-capability;
              loaded = filesystem-read-bounded; authority, (instance path; source), 1048577
              if loaded.failed or loaded.completed >= 1048577
                return false
              try
                text = loaded.data.decode; utf8
                saved = filesystem-write-atomic; authority, (instance path; destination), (text.encode; utf8)
                return not saved.failed
              catch decode-error
                return false
          response: null
          diagnostic: null
          markdown: >-
            The read limit is one byte above the accepted one-megabyte payload so
            `completed >= limit` reliably identifies oversized input.
    - id: filesystem
      title: "Capability-Gated Filesystem Access"
      blocks:
        - type: markdown
          markdown: |-
            Filesystem facilities are provided by `/core/filesystem`. Every operation that
            accesses the host filesystem, including every filesystem-handle method, requires
            the unforgeable authority obtained through `filesystem-capability`. This applies
            to metadata and symlink-metadata queries, existence checks, native path
            resolution, link reading, bounded reads, atomic replacement, rename, removal,
            file handles, and directory-relative traversal. Lexical path operations are
            separate and require no filesystem authority.

            File and directory handles are resource-owning linear values: ownership is
            transferred rather than duplicated. Releasing the underlying host resource is
            idempotent, using the same resource-release discipline as streams.
            Resource-owning collection types are rejected. File handles provide
            descriptor-backed `flush`, `sync-data`, and `sync-all` operations. When a file
            write completes only partially, its result reports the completed offset so that
            writing can resume at the correct position.

            Whole-file reads require an explicit bound. If the content exceeds that bound,
            the read fails rather than returning truncated data. Atomic replacement creates
            a sibling temporary file and renames it over the destination without following
            the destination’s final symbolic link. Rename and removal are separate
            capability-gated operations.

            Metadata and symlink metadata have different final-component behavior. Ordinary
            metadata follows the final symbolic link, while symlink metadata inspects the
            link itself. Portable metadata includes kind, size, and read-only state,
            together with platform permission details and failure details. Existence checks
            preserve lookup failures instead of converting every failure to `false`.
            `filesystem-canonical` performs capability-mediated native resolution and may
            fail; `filesystem-realpath` is an alias with the same implementation.

            A resource-owning directory handle anchors relative traversal. The final
            component used to open the anchor is not followed, and operations beneath the
            handle also use no-follow behavior. Intermediate components in the
            caller-supplied anchor path use ordinary host resolution. Beneath traversal
            rejects attempts to escape the anchor, and crossing into another filesystem
            requires explicit permission. These rules govern handle-relative host traversal,
            not unrestricted lexical path construction.
