documentation:
  status: complete
  title: Typed channels
  title-style: text
  summary: >-
    Describes bounded typed channel construction, sender and receiver tasks, overflow policies, close state, cancellation,
    and linear ownership.
  tags:
    - standard-library
    - concurrency
    - async
    - channels
  sections:
    - id: construction
      title: Construction and endpoint types
      blocks:
        - type: rule
          id: rule.channels.construction
          level: must
          since: null
          evidence:
            - typed-channels
            - channel-invalid-capacity
            - channel-invalid-overflow-policy
          markdown: |-
            Import `channel` and a policy from `/core/concurrency`, then call
            `channel; Item, capacity, policy`. `Item` is a concrete type descriptor and
            `capacity` is a compile-time constant integer. A zero-capacity `channel-block`
            is a rendezvous; fail-send and either drop policy require positive capacity. The
            result exposes independently owned `sender` and `receiver` endpoints specialized
            to that item type.

            The policies are `channel-block`, `channel-fail-send`, `channel-drop-newest`,
            and `channel-drop-oldest`. Buffered channel storage never exceeds the declared
            capacity.
    - id: operations
      title: Sending and receiving
      blocks:
        - type: rule
          id: rule.channels.operations
          level: must
          since: null
          evidence:
            - typed-channels
            - channel-item-type-mismatch
          markdown: |-
            `sender.send; item` creates a local task. Awaiting it returns a
            `channel-send-outcome of Item` whose `accepted`, `closed`, and `dropped` fields
            distinguish delivery, peer closure, fail-send, and either drop policy.
            `rejected-value` returns an item refused by fail-send or closure;
            `dropped-value` returns the submitted item under drop-newest or the evicted
            buffered item under drop-oldest. Sending a value of another type is a source
            error.

            `receiver.receive;` creates a local task. Awaiting it returns a
            `channel-receive-outcome` with `available`, `closed`, and optional `value`.
            Sender close permits buffered values to drain before the receiver observes
            closure.
    - id: overflow
      title: Overflow behavior
      blocks:
        - type: rule
          id: rule.channels.overflow
          level: must
          since: null
          evidence:
            - typed-channels
          markdown: |-
            Block waits for buffer capacity, or for a receiver to accept the exact value on
            a zero-capacity rendezvous. Fail-send reports an unaccepted, open, undropped
            item and returns it through `rejected-value`. Drop-newest reports and returns
            the submitted item through `dropped-value`. Drop-oldest accepts the submitted
            item and returns the evicted buffered item through `dropped-value`.
    - id: lifecycle
      title: Close, cancellation, and ownership
      blocks:
        - type: rule
          id: rule.channels.lifecycle
          level: must
          since: null
          evidence:
            - typed-channels
            - loop-local-channel-resources
            - channel-sender-use-after-close
            - channel-duplicate-pair
            - channel-endpoint-taken-twice
            - channel-receiver-use-after-close
            - channel-duplicate-endpoint
          markdown: |-
            Sender and receiver endpoints are linear. `close` consumes an endpoint;
            duplicate ownership and later use are source errors. Closing the receiver wakes
            blocked sends with `closed = true` and returns a `list of Item` containing every
            value already accepted into its buffer. Closing it is therefore explicit data
            recovery, not silent disposal. Dropping either endpoint performs emergency close
            and may destroy retained values because no caller remains to receive them.

            Cancellation or deadline expiry drops a pending operation and unregisters its
            waiter. Once a zero-capacity receiver accepts a staged rendezvous value, the
            matching send is complete. If completion and cancellation are both ready when
            that sender task resumes, its accepted completion wins rather than being
            relabeled cancelled; the cancellation request remains independently observable.

            A channel pair or endpoint declared inside a loop body is freshly initialized on
            every iteration. Consuming that iteration's value does not carry moved state
            into the next declaration. An endpoint originating outside the loop remains
            consumed across its back-edge until explicitly rebound.
        - type: note
          id: note.channels.linear-fan-in-boundary
          style: warning
          markdown: |-
            A built-in channel has one independently owned sender and one independently
            owned receiver. Endpoints are not clonable, and the current surface has no
            broadcast or receive-many operation. Consequently this channel directly
            expresses one producer/consumer ownership path, not arbitrary handler or worker
            fan-in. A multi-producer design needs an additional typed transport contract;
            duplicating a linear sender is a source error.
