documentation:
  status: complete
  title: Diagnostic catalog
  title-style: text
  summary: >-
    Explains diagnostic families, classification, and correction, with a generated compiler-backed code inventory for exact
    lookup.
  tags: [tooling, diagnostics, errors, limitations, search]
  sections:
    - id: generated-index
      title: Generated code inventory
      blocks:
        - type: markdown
          markdown: |-
            `generated/diagnostics.yaml` is the machine-readable index of every stable
            diagnostic code found in the compiler sources. Each entry records the code,
            emitted message templates, and compiler source locations.
            `tools/generate_manual_catalog.py --check` verifies that it matches the selected
            compiler checkout.

            The generated inventory answers whether a code exists and where its invariant is
            enforced. Authored sections on this page add rejected and corrected examples and
            classify a diagnostic as settled semantics or a temporary implementation
            limitation. If a generated entry has no authored guide yet, treat its message
            and source location as lookup data—not as a new language rule.
    - id: families
      title: Diagnostic families
      blocks:
        - type: table
          id: diagnostic-families
          title: Stable code families
          show-header: true
          columns:
            - id: prefix
              title: Prefix
              cell: code
            - id: area
              title: Area
              cell: text
            - id: interpretation
              title: Interpretation
              cell: text
          rows:
            - prefix: L
              area: Lexing
              interpretation: Source character, indentation, literal, or trivia invariant.
            - prefix: S
              area: Syntax and package structure
              interpretation: Parsing, name resolution, manifest, import, or source-layout invariant.
            - prefix: T
              area: Types and semantics
              interpretation: Type, ownership, call, member, control-flow, or projection-use invariant.
            - prefix: W
              area: Advisories
              interpretation: Non-blocking source guidance.

    - id: t0105
      title: T0105 — invalid or unavailable static member
      blocks:
        - type: table
          id: diagnostic-t0105
          title: T0105 contract
          show-header: true
          columns:
            - id: field
              title: Field
              cell: text
            - id: value
              title: Value
              cell: markdown
          rows:
            - field: Invariant
              value:
                A static member must exist on the selected class and, for projected Rust, must have an admitted representation
                and contract.
            - field: Classification
              value: Source or temporary implementation error, depending on the declined member reason.
            - field: Related references
              value: "[[tool.packages.rust-dependencies#integration-boundaries]]"

        - type: example
          id: t0105-rejected
          title: Rejected projected enum variant
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            namespace reference-examples/projected-enum-member-rejected

            from /deps/terrane-payload-enum-witness import Event

            function event Event;
              return Event::Pair; 1, 2
          response: null
          diagnostic: T0105
          markdown: null

        - type: example
          id: t0105-corrected
          title: Use an admitted projected variant
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |-
            namespace reference-examples/projected-enum-member

            from /deps/terrane-payload-enum-witness import Event

            function event Event;
              return Event::Text; 'message'
          response: null
          diagnostic: null
          markdown: |-
            The projected Rust enum exposes its public unit and supported single-payload
            variants on the projected owner. A named, multi-field, borrowed, open-generic,
            or unrepresentable variant remains an explicit declined member rather than
            silently acquiring lossy adaptation.
  see-also:
    - tool.current-limitations
    - tool.packages.rust-dependencies

provenance:
