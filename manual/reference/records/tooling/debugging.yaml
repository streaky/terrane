documentation:
  status: complete
  title: Native source debugging
  title-style: text
  summary: >-
    Builds debug-profile Terrane executables with versioned, build-bound provenance and translates source debugger operations
    to one selected LLDB DAP backend.
  tags:
    - tooling
    - debugging
    - lldb
    - dap
    - provenance
  sections:
    - id: commands
      title: Commands and support boundary
      blocks:
        - type: rule
          id: rule.debugging.commands
          level: must
          since: null
          evidence: []
          markdown: |-
            `terrane debug [--embed-sources] [--embed-generated-sources] <file-or-manifest> [-- arguments]`
            builds with the named `terrane-debug-v1` profile shared by Cargo emission and
            provenance: full debug information, optimization disabled, compiler-default
            inlining at that optimization level, and stripping disabled.
            `terrane debug --release` is rejected. Authored and generated source snapshots
            are independently excluded unless their corresponding embedding flag is given.
            Its inspection commands are `frames`, `frame N`, `source [RADIUS]`, `locals`,
            `value NAME`, `generated [RADIUS]`, `native`, `registers`, and `lldb COMMAND`.
            Source/generated context is bounded to radius 20; focused values are depth-,
            cycle-, and count-bounded. Generated source rendering falls back to an exact
            explicitly embedded snapshot when its build-tree file is unavailable.
            `terrane debug-adapter --stdio` serves the same translation engine as a Debug
            Adapter Protocol endpoint. Protocol frames are the only adapter stdout content;
            backend and adapter diagnostics use stderr or framed output events.

            The selected implementation is `lldb-dap`. Linux x86-64 with LLDB 22 is
            exercised end to end. Launch is supported there. Attach is experimental and
            forwarded only where the selected LLDB and host process policy permit it. Other
            operating systems, architectures, LLDB versions, ABI recipes, optimized modules,
            and stripped modules report native fidelity rather than claiming equivalent
            source support.
        - type: note
          id: note.debugging.experimental-boundary
          style: warning
          markdown: |-
            The CLI, DAP command set, and provenance schema are experimental in 0.1. Request
            ingress is serialized and cancellation is not advertised. Direct debugging of an
            isolated `terrane test` case awaits a separate contract for debugger process
            ownership, case selection, context, timeout, temporary-directory lifetime, and
            reporting. Conditional breakpoints, logpoints, restart, Terrane-language
            expression evaluation, and time-travel debugging are not supported. Native LLDB
            commands remain an explicit escape hatch and are not Terrane expressions.
    - id: provenance
      title: Exact-build provenance
      blocks:
        - type: rule
          id: rule.debugging.provenance
          level: must
          since: null
          evidence: []
          markdown: |-
            Every debug build writes deterministic schema `1.3` provenance beside the
            generated Rust and executable. It records compiler/toolchain/exact Rust compiler
            release/sysroot/target/toolchain-bound ABI recipe/named artifact profile
            identity; manifest and projection-lock hashes when present; every logical source
            hash; optional explicitly requested source snapshots; final generated-file
            hashes and byte/line associations; stable function, scope, binding, object, and
            field identities; inlining and stripping state; the executable hash; and
            source/build relocation roots.

            Source translation is enabled only when the compiler/schema, selected target and
            toolchain-bound ABI recipe, every named profile property, sidecar, native
            module, generated files, and current source hashes agree. A DAP client may
            supply explicit source/build relocation roots only when copied or archived
            artifacts retain identical bytes. The adapter forwards that recorded-to-
            relocated mapping to LLDB as well as applying it to provenance. Identity and
            relocation remain independent. After launch or attach, `terrane/fidelity`
            reports mode `source` or `native`, target, ABI recipe, artifact profile, exact
            Rust compiler release, inlining state, and whether source translation is active.
            Missing, stale, malformed, mismatched, optimized, stripped, or unsupported
            metadata disables Terrane translation with a diagnostic while leaving raw native
            debugging available.
    - id: breakpoints-stepping
      title: Breakpoints and stepping
      blocks:
        - type: rule
          id: rule.debugging.breakpoints
          level: must
          since: null
          evidence: []
          markdown: |-
            Source breakpoints resolve through compiler-owned sequence points in final
            formatted Rust. Relative paths resolve from the debugger invocation directory
            before the package root. One Terrane location may produce multiple native
            locations; each remains represented in one grouped backend update. A
            non-executable requested line may adjust only forward to the nearest declared
            sequence point in the same exact lexical scope. Otherwise it remains pending and
            unverified with an explanation. Verification reports the requested and resolved
            Terrane locations and the generated location.
        - type: rule
          id: rule.debugging.stepping
          level: must
          since: null
          evidence: []
          markdown: |-
            Continue, step-in, step-over, and step-out delegate process control to LLDB.
            `next` targets another authored point in the selected frame or its caller,
            including loop re-entry; `stepOut` requires an exact frame-depth decrease. The
            breakpoint at the current native location is suspended while leaving it. Every
            other user breakpoint remains active. Up to 512 temporary source targets are
            installed and removed in batched LLDB requests; larger sets fall back without
            truncation to at most 64 native steps. Reaching the bound exposes the native
            stop and limitation. Generated Rust, native frames, registers, memory, and raw
            LLDB commands remain explicit escape hatches.
    - id: frames-values
      title: Frames, values, and privacy
      blocks:
        - type: rule
          id: rule.debugging.frames-values
          level: must
          since: null
          evidence: []
          markdown: |-
            Mapped frames use session-local indices, Terrane namespace/function names,
            logical source locations, and explicit selection for subsequent source,
            generated, local, register, and focused-value inspection. Unmapped backend
            frames stay available as native frames. Variable names are selected from
            compiler bindings by the exact stop, visibility range, lexical-scope ancestry,
            and innermost shadow rather than by demangling guesses.

            Preserved fixed scalars use LLDB values. Adaptive integers are decoded exactly
            across small, wide, and arbitrary-precision tiers only when the provenance
            selects the supported 64-bit Linux ABI recipe; otherwise the raw backend scalar
            remains authoritative. Strings and bytes use bounded read-memory summaries.
            Object and collection values retain lazy backend child references; focused
            expansion remains depth-, cycle-, and count-bounded. Every variable page is
            capped at 100 entries plus an explicit continuation marker and each displayed
            value at 4096 bytes. Optimized-out, unavailable, and truncated states remain
            explicit rather than fabricated. A distinct moved-value state is not claimed
            because current LLDB data does not prove source ownership transitions.
        - type: rule
          id: rule.debugging.privacy
          level: must
          since: null
          evidence: []
          markdown: |-
            Compiler object metadata carries field secrecy into debugger provenance.
            Ordinary variable expansion replaces secret field values with `<secret>` and
            removes their child, memory, and evaluation references before sending a frontend
            response. Explicit raw backend/native inspection is a separate opt-in escape
            hatch and may reveal physical memory.
    - id: lifecycle
      title: DAP and process lifecycle
      blocks:
        - type: rule
          id: rule.debugging.lifecycle
          level: must
          since: null
          evidence: []
          markdown: |-
            Requests and responses remain correlated by DAP sequence IDs, including backend
            responses that arrive while another request is expected. Delayed launch and
            attach results are retained and validated after configuration. `initialize`
            receives exactly one immediate `initialized` event. Disconnect terminates a
            launched debuggee by default and detaches from an attached process by default;
            clients may explicitly choose the DAP `terminateDebuggee` policy. Variable
            handles are invalidated on resume. Request ingress is serialized, so
            cancellation is not advertised. Debuggee exit status is returned by the
            interactive CLI. Debuggee stdout and stderr are framed DAP output events and
            cannot corrupt adapter protocol stdout. Terrane imports `lldb_lookup.py` only
            from the Rust sysroot recorded in provenance, before client initialization
            commands; its absence does not prevent debugging.
  see-also:
    - tool.source-intelligence
    - tool.packages.command-line

