documentation:
  status: complete
  title: Projection namespace overlays
  title-style: text
  summary: >-
    Explains how one directly declared Rust dependency may contribute a feature-gated module to another dependency's Terrane
    namespace without changing Rust ownership or introducing package-specific compiler behavior.
  tags:
    - compiler-internals
    - dependencies
    - projection
    - namespace-overlays
    - provenance
  sections:
    - id: declaration-discovery
      title: Declaration and discovery
      blocks:
        - type: rule
          id: rule.internals.projection.overlays-come-from-direct-metadata
          level: must
          since: null
          evidence:
            - projection-namespace-overlays
          markdown: |-
            Overlay declarations come only from
            `package.metadata.terrane.namespace-overlays` on a directly declared Rust
            dependency. Each declaration names one module in that provider, a different
            directly declared target package, and the provider feature that owns the module.
            The feature must be explicitly enabled; a disabled feature contributes no
            overlay.

            Cargo's resolved direct-dependency graph determines both provider and target
            identities. A transitive dependency cannot inject names into a package selected
            by the application, and an application cannot use an overlay to create an
            undeclared dependency surface.
    - id: namespace-composition
      title: Namespace composition and provenance
      blocks:
        - type: rule
          id: rule.internals.projection.overlays-preserve-rust-ownership
          level: must
          since: null
          evidence:
            - projection-namespace-overlays
          markdown: |-
            The projector selects public items from the provider module and presents them
            beneath the target's existing `/deps/<crate>` namespace. Only Terrane name
            resolution changes. Every item retains its actual Rust path, provider package,
            resolved version, callable contract, and dependency provenance in the projection
            artifact.

            Direct target items and overlaid provider items therefore form one Terrane
            import surface while generated Rust continues to invoke their distinct recorded
            owners. Diagnostics, editor information, hover, and durable projection history
            must expose that provenance rather than pretending the target package implements
            the overlaid operation.
    - id: validation
      title: Validation and collision safety
      blocks:
        - type: rule
          id: rule.internals.projection.overlays-reject-invalid-composition
          level: must
          since: null
          evidence:
            - projection-namespace-overlays
          markdown: |-
            Reject an overlay whose provider or target is not direct, whose target is the
            provider itself, whose feature is disabled, whose module path is empty or
            absent, or whose package identity is ambiguous. Reject duplicate and overlapping
            source-to-target declarations before projecting their items.

            After projection, reject any target namespace containing duplicate item names,
            whether the collision is between direct and overlaid items or between two
            providers. Declaration order never selects a winner, and an overlay cannot
            shadow an upstream operation silently.
    - id: identity-and-genericity
      title: Cache identity and genericity
      blocks:
        - type: rule
          id: rule.internals.projection.overlays-are-generic-inputs
          level: must
          since: null
          evidence:
            - projection-namespace-overlays
          markdown: |-
            Normalized overlay declarations participate in exact projection cache identity.
            Changing the provider, target, module, or selected feature selects a different
            projection record even when the Cargo lock is otherwise unchanged. The reviewed
            projection artifact retains the resulting composed namespace and exact provider
            paths.

            Overlay handling is generic Cargo-metadata and namespace-composition machinery.
            Projection, semantics, and lowering never dispatch on a dependency name,
            framework, application, or retired adapter registry. An ecosystem package
            receives no compiler-specific branch by participating in an overlay.
