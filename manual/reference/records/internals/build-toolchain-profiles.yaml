documentation:
  status: complete
  title: Build toolchain profiles
  title-style: text
  summary: >-
    Explains how generated native builds pin Rust and Unicode inputs instead of inheriting accidental host changes.
  tags:
    - compiler-internals
    - toolchain
    - unicode
    - reproducibility
  sections:
    - id: selected-inputs
      title: Compiler-selected inputs
      blocks:
        - type: rule
          id: rule.internals.build.selected-inputs
          level: must
          since: null
          evidence:
            - byte-index-and-slice
          markdown: |-
            The default build profile selects the compiler's exact stable Rust release. A
            package may explicitly request the system Rust toolchain, but that changes only
            which compatible Rust installation Cargo invokes.

            Each Terrane version selects one stable Rust release. The compiler workspace
            `rust-toolchain.toml` pins it and the workspace `rust-version`, generated
            manifest `rust-version`, and generated `rust-toolchain.toml` all name that same
            release. Direct generated lowering and vendored support therefore share one Rust
            compatibility target.

            Unicode behavior is a separate compiler-owned part of the toolchain profile.
            Version one selects Unicode 16.0.0 for full case folding, normalization, Unicode
            word segmentation, and extended grapheme segmentation. Pinned and system Rust
            builds use the same Unicode profile.
    - id: generated-artifacts
      title: Generated artifacts
      blocks:
        - type: description
          id: description.internals.build.generated-artifacts
          since: null
          evidence:
            - byte-index-and-slice
          markdown: |-
            Every generated program manifest records `unicode-data-version = "16.0.0"` under
            `[package.metadata.terrane]`. Generated support manifests use exact dependency
            versions whose embedded tables all implement that profile.

            String and collection support each expose their selected Unicode version and
            assert the versions embedded by their table providers. The compiler test suite
            mechanically compares both support versions with the compiler profile constant.
            Updating any one provider or component alone therefore fails the build rather
            than silently producing mixed Unicode semantics.
    - id: native-artifact-kind
      title: Native artifact kind
      blocks:
        - type: description
          id: description.internals.build.native-artifact-kind
          since: null
          evidence: []
          markdown: |-
            A package selects `artifact = "executable"` by default or
            `artifact = "dynamic-library"` for a host-loaded native extension. Both use the
            ordinary Terrane semantic and Rust-lowering pipeline. The dynamic-library form
            writes the generated entrypoint as `src/lib.rs`, asks Cargo for a `cdylib`, and
            makes `build` return the platform dynamic-library path. `run` and `debug` reject
            it because the package requires an external host.

            Terrane declarations do not yet export host-visible symbols automatically. A
            maintained authored Rust module supplies the host entrypoint and may call
            ordinary lowered Terrane functions within the generated crate.

            Generated-only packages continue to forbid unsafe Rust. When a package
            deliberately includes maintained authored Rust modules, the crate lint becomes
            `deny` instead. A reviewed module may then explicitly allow the narrow unsafe
            ABI boundary it owns without weakening compiler-generated modules.
    - id: workspace-artifact-size
      title: Workspace artifact size
      blocks:
        - type: description
          id: description.internals.build.workspace-artifact-size
          since: null
          evidence: []
          markdown: |-
            Workspace `dev` and `test` profiles retain incremental compilation while
            selecting line-table-only debug information. Rust backtraces, source locations,
            breakpoints, and stepping remain available without emitting full local-variable
            DWARF for every dependency and test artifact. A debugging task that needs
            complete native local-variable inspection may override the profile deliberately;
            full debuginfo is not the persistent workspace default. The generated
            conformance workspace declares the same profile explicitly because its separate
            Cargo manifest does not inherit workspace-root profile settings.

            Changing the profile does not delete older Cargo artifacts. Existing
            `target/debug` entries remain usable until a separately chosen stale- artifact
            policy removes them, while newly compiled artifacts use the smaller profile.
            Generated Terrane programs retain their ordinary project-local cache today. A
            future shared generated-target pool must use exact toolchain, target, profile,
            rustflag, support, and dependency identities plus bounded eviction; a merely
            similar build is never a valid cache hit.
    - id: maintenance
      title: Maintenance rule
      blocks:
        - type: rule
          id: rule.internals.build.maintenance
          level: must
          since: null
          evidence: []
          markdown: |-
            A Unicode upgrade is one toolchain-profile change. Update the compiler constant,
            every affected support dependency, generated manifest metadata, conformance
            witnesses, and language/manual claims together. Never allow a semver-compatible
            dependency update to select a new table version on its own.
