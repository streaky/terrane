documentation:
  status: complete
  title: Conversion analysis and lowering
  title-style: text
  summary: >-
    Records static coercion resolution, single evaluation, and callback ABI lowering.
  tags:
    - compiler
    - semantics
    - lowering
    - coercion
  sections:
    - id: resolution
      title: Static resolution
      blocks:
        - type: markdown
          markdown: |-
            Semantic analysis resolves the receiver type, concrete destination descriptor,
            and policy before lowering. A two-argument bare `coerce` is the caller-supplied
            form and validates one synchronous function with the exact source parameter and
            destination result. Policy children never enter that path.
    - id: lowering
      title: Evaluation and throwable ABI
      blocks:
        - type: markdown
          markdown: |-
            Lowering materializes the callback as the same callable value used by an
            ordinary function-value call, evaluates the receiver once as its statically
            known source type, and invokes the callback once. A declared throwing callback
            uses the normal generated raised-result propagation path rather than a
            conversion-specific wrapper.
  see-also:
    - lang.numerics.conversion
    - internals.optimization.proof-guided-lowering

