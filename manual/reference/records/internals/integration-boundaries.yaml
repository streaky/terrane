documentation:
  status: complete
  title: Application-owned integration boundaries
  summary: >-
    Explains the direct-first dependency policy, package-local authored Rust modules, namespace
    overlays, gap tracking, verification, and removal after the shared adapter crate's retirement.
  tags:
    - compiler-internals
    - dependencies
    - projection
    - authored-rust
  sections:
    - id: direct-first
      title: Start with projected dependencies
      blocks:
        - type: rule
          id: rule.internals.integration-boundaries.direct-first
          level: must
          since: null
          evidence:
            - projected-sqlx-query-chain
            - projected-pdf-html-bytes
            - projected-websocket-protocol
          markdown: |-
            Use the direct `/deps/<package>` surface whenever generic projection admits the
            operation. Keep routing, schemas, rendering policy, workflows, and domain types
            in Terrane. A missing convenience function is not a projection gap when the
            application can compose the behavior from admitted upstream operations.

            The former shared `terrane-integration-adapters` crate and its registry have
            been deleted. Do not recreate a central convenience layer or a compatibility
            alias for an operation that projects directly. SQLx query construction, binding,
            execution, fetching, row access, errors, and connection closure are direct, as
            are the evidenced PDF and Axum paths.
        - type: description
          id: description.internals.integration-boundaries.recognize-gap
          since: null
          evidence:
            - authored-rust-module
          markdown: |-
            Reduce a failure to the smallest concrete Rust declaration and Terrane call
            before adding Rust. Inspect the complete projection diagnostic and exact
            resolved graph. A real boundary may involve an unnameable lifetime-bearing
            intermediate, an unsupported host registration macro, or a concrete ABI
            operation. Do not infer a gap from a generated-Rust error without first
            separating an unavailable declaration, ambiguous selection, ownership failure,
            missing capability, and ordinary application policy.
    - id: local-module
      title: Use a package-local module for an irreducible boundary
      blocks:
        - type: rule
          id: rule.internals.integration-boundaries.local-module
          level: must
          since: null
          evidence:
            - authored-rust-module
          markdown: |-
            When direct projection cannot express a required operation, place the narrowest
            maintained Rust module in the application and declare it through
            `[rust-modules]`. Applications do not need a Terrane commit, central registry
            entry, or shared adapter dependency. The module and projected dependencies
            inhabit one generated Cargo graph; this does not introduce a C ABI or a second
            runtime boundary.
        - type: example
          id: example.internals.integration-boundaries.local-module-manifest
          title: Declare one maintained module
          language: toml
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            [profile]
            name = "application"
            capabilities = ["build"]

            [rust-dependencies.example-library]
            version = "=1.2.3"
            effects = ["build"]

            [rust-modules]
            dependency_boundary = "rust/dependency_boundary.rs"
          response: null
          diagnostic: null
          markdown: null
        - type: description
          id: description.internals.integration-boundaries.typed-surface
          since: null
          evidence:
            - authored-rust-module
          markdown: |-
            Put the raw call behind the narrowest practical typed Terrane function or
            method. That declaration owns parameter and result types, ownership, effects,
            failures, capabilities, and reflection. Keep unnameable generic or borrowed
            intermediates inside Rust and return only a supported representation. Preserve
            upstream evaluation, cancellation, cleanup, and resource-transfer semantics;
            never add cloning, boxing, serialization, detached work, or dynamic dispatch
            merely to make the boundary compile.

            Safe `rust` remains the default. An unavoidable unsafe host or ABI boundary
            belongs in the maintained module with its invariant documented. Authored modules
            change the generated crate's unsafe lint from `forbid` to `deny` only so that
            the reviewed module can opt into its narrow boundary.
    - id: overlays
      title: Namespace overlays remain generic metadata
      blocks:
        - type: description
          id: description.internals.integration-boundaries.overlays
          since: null
          evidence:
            - projection-namespace-overlays
          markdown: |-
            `package.metadata.terrane.namespace-overlays` is a generic Cargo metadata
            mechanism, not a shared adapter service. An enabled directly declared provider
            may present one module beneath another directly declared dependency namespace
            while generated Rust, diagnostics, and provenance retain the provider's exact
            owner.

            The compiler rejects undeclared targets, self overlays, ambiguous packages,
            empty modules, overlapping declarations, and collisions with upstream members.
            Use an overlay only when a real provider package needs this presentation; a
            package-local module normally needs no reusable overlay.
    - id: tracking
      title: Track unresolved capabilities outside a registry crate
      blocks:
        - type: rule
          id: rule.internals.integration-boundaries.track-capability
          level: must
          since: null
          evidence:
            - projected-demanded-member-cycle
            - godot-generated-api-projection
            - consume-nonclone-foreign-list-iteration
            - index-nonclone-foreign-list-item
          markdown: |-
            Record a reusable unresolved capability in the owning compiler plan, manual
            record, or issue with a stable key and observable removal criterion. Accounting
            must not be coupled to a runtime dependency or projected package.

            `collections/consume-non-clone-foreign-items` identifies consuming iteration
            needed to process every non-`Clone` foreign item in a persistent collection and
            belongs to the separate stream/iterator design.
            `projection/mutually-referential-namespace-sources` identifies demanded
            projected signatures that still require a cyclic source graph.
            `native-interop/rust-proc-macro-extension-entry` identifies Godot's remaining
            GDExtension entrypoint and class-registration boundary. The former
            `projection/godot-generated-reexport-surface` gap is closed by
            generated/reexported API projection and its pinned Godot evidence.

            The compiler plan's direct-first integration cutover section owns the affected
            version ranges and exact observable removal criteria for all three open keys.
    - id: verification
      title: Verify the real boundary
      blocks:
        - type: description
          id: description.internals.integration-boundaries.verification
          since: null
          evidence:
            - authored-rust-module
            - projected-sqlx-query-chain
          markdown: |-
            Compile against the exact dependency versions, features, target, and
            capabilities. Exercise the typed Terrane boundary and every runtime behavior
            that motivated it, including real failure, cancellation, cleanup, and closure
            where applicable. A generic compiler fix needs both a non-framework structural
            witness and the real dependency call.

            Review generated Rust for direct deterministic calls and conversions. Do not
            edit generated output, suppress a native compiler error, broaden features
            speculatively, or accept avoidable allocation, copying, boxing, dispatch, or
            repeated source evaluation.
    - id: removal
      title: Remove local boundaries cleanly
      blocks:
        - type: rule
          id: rule.internals.integration-boundaries.clean-removal
          level: must
          since: null
          evidence:
            - authored-rust-module
          markdown: |-
            When generic projection admits the operation, migrate every caller to the direct
            dependency surface and delete the local Rust operation, typed wrapper, obsolete
            conversions, manifest entry, feature, and dependency. Keep no compatibility
            alias. Remove a `[rust-modules]` entry only after no other host boundary in that
            file remains.

            Update conformance, projection locks, current-surface documentation, capability
            tracking, and application documentation in the same work unit. A deleted ledger
            does not prove that a capability gap closed; only its stated direct behavior
            does.
