documentation:
  status: complete
  title: Nested conformance timing
  title-style: text
  summary: >-
    Describes how the full-suite timing collector records individual conformance manifests instead of attributing the whole
    corpus to one Rust test.
  sections:
    - title: Collection protocol
      body: >-
        `docs/measure-test-times.py` creates a temporary file and exports its path as `TERRANE_TEST_TIMING_FILE` to a Cargo
        test process. Each outer libtest binary uses deterministic bounded parallelism, defaulting to available parallelism
        capped at eight workers and reducible with `TERRANE_SCORECARD_JOBS`. The collector reconstructs active per-test durations
        from libtest's alphabetical queue and timestamped completion events. Within the corpus test, the driver measures concurrent
        per-manifest setup, checking, and lowering work. Each completed case appends a locked, versioned tab-separated record
        containing its relative path, status, and active elapsed seconds; scoreboard identity does not depend on completion
        order. Dependency-free accepted cases share one generated-crate build, which receives its own synthetic timing record
        instead of being estimated per case. A deferred case that never reaches that build is recorded as ignored rather than
        falsely failed; a drop guard still records a real active case failure. Normal test runs without the environment variable
        perform no timing-file I/O.
    - title: Scoreboard identity
      body: >-
        Nested records use the `conformance cases [terrane_compiler]` target and the manifest's corpus-relative directory
        as the stable test name. If at least one nested record is present, the collector omits and removes the enclosing `every_manifest_drives_a_conformance_case`
        entry. The shared dependency-free build uses the stable name `generated-rust/batched-dependency-free-build`. Ordinary
        libtest timings, manifest timings, and that build timing otherwise share the same bounded history and run summary.
        Changing the collector's timing mode retains aggregate run records but begins a fresh per-test comparison history
        so serial and parallel durations are not compared as regressions.
    - title: Generated-crate isolation
      body: >-
        Every sorted accepted manifest receives its own deterministic binary name and source path. Compiler-only preparation
        uses a bounded worker pool and returns results to corpus order before mutating the shared generated workspace. Dependency-free
        binaries are then declared in one generated Cargo manifest and built together, allowing Cargo to schedule their independent
        rustc and linker work in parallel. Cases with projected Rust dependencies retain separate serialized manifests and
        builds because their dependency graphs may conflict. The driver removes fixture-specific Cargo configuration before
        the shared dependency-free build, while all builds retain one Cargo target directory for dependency reuse. The driver
        executes each exact case-specific artifact; no case can reuse another case's executable when Cargo decides that a
        target is fresh. Package fixtures are staged outside the corpus. When a package carries a reviewed `terrane-projection.lock`,
        the driver compares the staged post-compilation history with the source fixture after excluding only machine-derived
        cache identity and content hash fields. A format migration or any semantic projection change fails the case instead
        of silently rewriting the reviewed fixture.
    - title: Focused execution and cache locality
      body: >-
        Set `TERRANE_CONFORMANCE_FILTER` to one case-name or to comma-separated corpus-path fragments when running `every_manifest_drives_a_conformance_case`.
        Filtering happens before corpus staging, so only matching manifests are compiled and executed while the harness retains
        its shared generated-Cargo target. An empty match fails rather than reporting a vacuous pass. The preparation pool
        defaults to available parallelism capped at eight workers; set `TERRANE_CONFORMANCE_JOBS=1..8` to lower the bound
        for a constrained machine or a focused diagnostic run. Do not invoke `terrane run` directly inside
        a tracked conformance case directory for focused checking. The ordinary CLI correctly creates its project-local `.trn/cache/target`,
        but doing that across many fixtures duplicates the same dependency graph under every case. CLI integration tests that
        exercise this project-local behavior stage the source in a temporary directory; the tracked corpus must remain free
        of `.trn` build caches. The generated conformance workspace defines line-table-only `dev` and
        `test` profiles with incremental compilation enabled. Its shared Cargo target therefore retains reusable dependencies
        and binaries without a full local-variable debug-information copy for every generated case.
    - title: Reviewed lowering artifacts
      body: >-
        Every accepted conformance case keeps a `lower.rs` golden. Its reviewed rendering begins with two deterministic manifest
        comments, then retains program-owned lowering including generated reflection and error-site tables. The runtime manifest
        names selected compiler `src/runtime` files in concatenation order, and the vendored-support manifest names exact
        support-crate identifiers referenced by the standalone program. Runtime implementations remain in the standalone Rust
        used by `terrane rust`, canonical Rust validation, generated-crate compilation, and execution; they are never copied
        into `lower.rs`. Set `TERRANE_UPDATE_GOLDENS` together with `TERRANE_CONFORMANCE_FILTER` for a
        focused regeneration. A corpus-wide regeneration requires the explicit value `TERRANE_UPDATE_GOLDENS=all`. The driver
        reports only files whose contents changed. `docs/summarize-golden-churn.py <git range>` emits YAML containing each
        distinct changed-line hunk once, its affected paths, and its file count.
    - title: Measurement boundary
      body: >-
        A case measurement includes manifest and source loading, semantic analysis, lowering, and program execution for run
        cases. The synthetic dependency-free generated-crate row reports its complete shared build wall time; isolated dependency
        builds remain attributed to their cases. Build-cache warmup can make an early compiling case slower, so timings are
        comparative development evidence rather than benchmark results. Do not run competing Cargo work while collecting the
        full workspace.
  examples: []
  errors: []
  notes:
    - The timing file is a private compiler-test protocol, not a Terrane language or runtime API.
    - The collector deletes its temporary timing file after every run.
