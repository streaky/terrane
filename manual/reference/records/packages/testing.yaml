documentation:
  status: complete
  title: Native testing
  title-style: text
  summary: >-
    Discovers ordinary Terrane test functions, compiles a native registry, and executes every selected case in an isolated
    process.
  tags:
    - packages
    - testing
    - command-line
    - isolation
  sections:
    - id: discovery
      title: Discovering tests
      blocks:
        - type: rule
          id: rule.testing.discovery
          level: must
          since: null
          evidence:
            - native_test_command_reports_isolated_cases_deterministically
          markdown: |-
            `terrane test <package>` discovers top-level, parameterless `test-*` functions
            returning `none` below `tests/unit`, `tests/integration`, and
            `tests/end-to-end`. Functions remain ordinary Terrane declarations and may be
            synchronous, asynchronous, or throwing. Discovery order is tier,
            package-relative source path, source order, and function name.

            `[testing]` may override each relative root. `[testing.profile]` explicitly
            selects a test profile name, capability allowlist, and panic policy; omitted
            settings inherit the ordinary package profile. Tests acquire no capability
            absent from those declarations.
    - id: execution
      title: Running isolated cases
      blocks:
        - type: rule
          id: rule.testing.isolation
          level: must
          since: null
          evidence:
            - native_test_timeout_terminates_the_isolated_process
            - end_to_end_tests_receive_the_built_application_artifact
          markdown: |-
            The compiler semantically analyzes production sources and every populated test
            root before selection, then lowers and backend-validates one native dispatch
            registry only for each tier containing a selected case. Consequently, filters
            never hide frontend errors, while a backend-only failure in an unselected tier
            is reported when that tier is selected. `--list` and an empty selection do not
            lower or build runners. The CLI runs each selected case in a fresh working
            directory and process with a deterministic seed, controlled environment and
            arguments, incrementally bounded stdout/stderr, and an enforced typed deadline.
            A crash, exit, or timeout is confined to that case. End-to-end cases receive the
            actual built application as `string|none` through `application-artifact`.
            Capability-gated `/core/testing/process` provides clonable value-style
            `process-fixture` builders whose independent snapshots carry arguments,
            environment, standard input, and deadline into `run-process`. Results expose
            independent stdout and stderr truncation flags.
    - id: framework
      title: Assertions and reports
      blocks:
        - type: rule
          id: rule.testing.framework
          level: must
          since: null
          evidence:
            - native_test_command_reports_isolated_cases_deterministically
          markdown: |-
            `/core/testing` provides boolean assertions, concrete scalar and byte
            equality/inequality, matching optional presence checks, floating near-equality,
            expected-descriptor throwable assertions, explicit failure and skip, typed
            deadline and controlled-argument accessors, source-framed structured causes, and
            bounded useful value rendering. Reading runner-supplied identity, tier, seed,
            directory, deadline, arguments, artifact, and controlled-time context is
            intentionally ungated because it grants no external authority; operations such
            as process spawning retain their normal capability gate through
            `/core/testing/process`. `fail-values` lets custom assertions keep comparisons
            in their concrete types while rendering operands through `test-value`. `--list`,
            repeatable `--tier`, and one mutually exclusive substring `--filter`, exact
            `--exact`, `--glob`, or `--regex` selector first perform semantic discovery;
            only tiers with selected cases are lowered, built, and executed. `--jobs`,
            `--timeout`, repeatable `--argument`, `--fail-fast`, and `--show-output` control
            execution. Bare timeout values are seconds; `ms` and `s` suffixes are accepted.
            `--report <path>` writes schema `1.2.0` JSON with effective tiers, numeric
            timeout milliseconds, per-tier compilation status and diagnostics, stable case
            identities, structured outcomes and causes, source spans, precise durations, and
            byte-exact incrementally bounded output with independent truncation flags.
  see-also:
    - tool.packages.command-line

