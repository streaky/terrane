documentation:
  status: complete
  title: Command-line execution
  title-style: text
  summary: >-
    Runs package-backed programs and source files, and manages deterministic hashes and manifest entries for native Terrane
    library packages.
  tags:
    - packages
    - command-line
    - scripts
    - shebang
    - execution
    - dependencies
  sections:
    - id: commands
      title: Running a source file
      blocks:
        - type: rule
          id: rule.command-line.implicit-run
          level: must
          since: null
          evidence:
            - executable-shebang-script
          markdown: |-
            `terrane run <path>` runs a manifest or individual `.trn` source through the
            ordinary semantic, lowering, generated-Cargo, cache, and native execution
            pipeline. When the first CLI argument is an existing file or ends in `.trn`,
            `terrane <path>` is the same run operation. Remaining arguments are forwarded to
            the program; the implicit form accepts but does not require a leading `--`.
    - id: generated-package-state
      title: Generated package state and version control
      blocks:
        - type: note
          id: note.command-line.ignore-generated-state
          style: information
          markdown: |-
            Terrane stores generated source, native build artifacts, and reusable package
            state in `.trn/` directories. This state is derived from the package and should
            not be committed to version control.

            Add this pattern to the repository's root `.gitignore` before the first `check`,
            `build`, `run`, or `test`:
        - type: example
          id: legacy-fence-003
          title: null
          language: gitignore
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            **/.trn/
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The recursive pattern also covers Terrane packages nested inside a larger
            repository or workspace. Generated files may still be inspected locally when
            investigating a build; ignoring them prevents editors and Git clients from
            treating the cache as authored work.
    - id: package-management
      title: Hashing and installing Terrane libraries
      blocks:
        - type: markdown
          markdown: |-
            `terrane package hash` calculates the complete deterministic source hash
            accepted by `[terrane-dependencies]`:
        - type: example
          id: legacy-fence-001
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane package hash ../document-model
            terrane package hash --git https://example.invalid/document-model.git --tag v1.2.3
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            The remote form clones and verifies an exact Git tag before hashing its source
            tree. It does not accept a branch or abbreviate the resulting 64-digit SHA-256
            value.

            Run `package install` from an application directory containing `package.toml`:
        - type: example
          id: legacy-fence-002
          title: null
          language: console
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            terrane package install ../document-model
            terrane package install --git https://example.invalid/document-model.git --tag v1.2.3
            terrane package install ../document-model --name model
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Installation validates `artifact = "library"`, obtains the library package
            identity, and adds one `[terrane-dependencies.<name>]` table. The package
            identity is the default name; `--name` selects another table key. Existing keys
            are rejected rather than replaced.

            A local install records only its relative `path`, leaving development edits
            immediately visible. A remote install records `git`, `tag`, and the required
            full hash. Installation fails when the current directory has no `package.toml`;
            it never searches parent directories for a different application manifest.
    - id: scripts
      title: Executing a shebang script
      blocks:
        - type: rule
          id: rule.command-line.shebang
          level: must
          since: null
          evidence:
            - executable-shebang-script
            - manifest-shebang-missing-namespace
            - shebang-script-without-main
          markdown: |-
            A direct single-file source beginning at byte zero with `#!` is an executable
            script. The shebang is ordinary comment trivia. The source may omit `namespace`,
            in which case the compiler supplies an implementation-owned identity outside the
            authored namespace grammar, making source collision impossible. A
            manifest-discovered source receives no such exemption and must declare its
            mapped namespace.

            Script execution does not remove Terrane's entrypoint contract. An executable
            script must declare one parameterless top-level `main`.
        - type: example
          id: executable-terrane-script
          title: Run a source file directly
          language: terrane
          mode: run
          target: thing.trn
          timeout-ms: null
          source: |-
            #!/usr/bin/env terrane
            function main;
              print; >hello
          response:
            kind: stdout
            language: text
            display: on-run
            content: |-
              hello
          diagnostic: null
          markdown: |-
            With `terrane` on `PATH`, run `chmod +x thing.trn` once and then execute
            `./thing.trn`.
