documentation:
  status: complete
  title: Collections, identity, and iteration
  title-style: text
  summary: >-
    Defines bytes indexing, collection lifetime and identity behavior, and the structural protocol used by built-in and source-defined
    iterators.
  tags:
    - collections
    - bytes
    - ranges
    - iteration
    - identity
    - lifetime
  sections:
    - id: byte-indexing
      title: Byte indexing and slicing
      blocks:
        - type: rule
          id: rule.collections.byte-indexing
          level: must
          since: null
          evidence:
            - byte-index-and-slice
            - byte-index-type
          markdown: |-
            An integer index selects one `uint8` from `bytes`. A range index selects a new
            `bytes` value by visiting the range's indices in order, including its authored
            step and half-open or inclusive end.

            A negative, unrepresentable, or out-of-bounds selected index throws
            `index-error`; its message retains the authored adaptive integer, including a
            negative index. An empty range at a valid boundary returns empty bytes. Neither
            operation decodes or validates the selected octets as text.
    - id: source-iteration
      title: Source-defined iteration
      blocks:
        - type: rule
          id: rule.collections.source-iteration
          level: must
          since: null
          evidence:
            - source-defined-iterator
            - package-source-iterator
            - source-iterator-next-contract
            - source-iterator-missing-next
            - source-iterator-next-parameters
            - source-iterator-mutating-constructor
            - source-iterator-item-type
            - source-iterator-reuse
            - source-iterator-none-item-type
            - builtin-iterator-reuse
            - iteration-end-is-not-none
            - iterator-protocol
          markdown: |-
            An object is structurally iterable when it has a non-throwing, non-async,
            zero-argument `iterator` method that does not mutate its receiver. The result is
            either `iterator of Item` or an object whose non-throwing, non-async,
            zero-argument `next` method returns `iteration-step of Item`.

            Construct an item step with `iteration-step; value` and exhaustion with
            `iteration-step.end;`. End is a dedicated semantic state, not a typed `none`
            step, and is compatible only where an `iteration-step of Item` destination
            supplies the item type. `none` therefore remains a valid yielded item. After
            returning `end`, an iterator must return `end` again without consulting its
            source. Iterator objects are linear state machines: transferring either a
            built-in or source-defined named iterator into `for` makes that binding
            unavailable. `for` invokes authored protocol methods directly, including across
            package namespaces. Missing, effectful, parameterized, or wrongly typed protocol
            methods produce targeted source diagnostics.
    - id: compiler-produced-read-only-lists
      title: Compiler-produced read-only lists
      blocks:
        - type: rule
          id: rule.collections.compiler-produced-read-only-lists
          level: must
          since: null
          evidence:
            - string-result-list-iteration
          markdown: |-
            Compiler-produced `list of string` and `list of text-range` results are ordered,
            read-only collections. Both expose `length` and may be consumed by `for`:
            `string.split` yields strings and `string.find.all` yields text ranges in source
            order. Split results additionally support indexing.
    - id: lifetime-and-identity
      title: Lifetime and identity
      blocks:
        - type: rule
          id: rule.collections.lifetime-and-identity
          level: must
          since: null
          evidence:
            - collection-identity-lifetime
            - map-key-removal
          markdown: |-
            Replacement releases a displaced logical item before returning once no remaining
            owner retains it. Copy-on-write separation preserves the unmutated collection
            and a read of each logical value observes its own contents without creating
            source identity. List and map removal transfer the removed item to the caller,
            so the item's lifetime ends when that returned value is released. A failed
            checked or default map removal does not separate shared backing storage.
            Successful mutation separates once, while unique storage mutates directly.
            `.clear` is intentionally a list-only member; list clearing and ordered
            collection destruction release remaining items in iteration order.

            Collections have no identity of their own, including when their backing storage
            is shared or their elements are references. Reference values retain their
            referent identities through collection storage: weak and shared references
            compare true with `is` exactly when they denote the same referent.

            A value's `type` descriptor exposes `inherently-identity-bearing`. It reports
            the language contract, not backing representation: reference types report true;
            ordinary class values and collections report false.
