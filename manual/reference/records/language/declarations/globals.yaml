  title: "Program global initialization graph"
  title-style: text
  summary: >-
    Program-global initialization uses an explicit dependency graph. Dependency cycles are diagnosed at compile time.
  tags:
    - "names"
    - "globals"
    - "global-initialization"
  sections:
    - id: global-initialization
      title: "Program-Global Initialization"
      blocks:
        - type: markdown
          markdown: |-
            Program globals form an explicit initialization dependency graph. A global
            initializer depends on every program-global binding it reads directly or through
            a called function.

            A dependency cycle in this graph is invalid and is diagnosed during compilation
            before lowering. Cyclic globals are not assigned an arbitrary initialization
            order.

            Initialization ordering does not by itself make mutable global state safe to
            share. A mutable global used across threads must satisfy the shared-thread-safe
            protocol. State that belongs to one thread should use the standard thread-local
            object rather than a separate global grammar.
