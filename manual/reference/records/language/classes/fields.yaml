documentation:
  status: complete
  title: Class fields and metadata
  title-style: text
  summary: >-
    Defines class field initialization, external names, secrecy policy, and descriptor reflection over one coherent field
    metadata model.
  tags:
    - classes
    - fields
    - metadata
    - reflection
  sections:
    - id: initialization
      title: Initializing fields
      blocks:
        - type: rule
          id: rule.classes.field-defaults
          level: must
          since: null
          evidence:
            - implicit-class-field-defaults
            - trait-field-defaults
            - cross-unit-inherited-initializer
            - nondefaultable-class-field
            - nondefaultable-trait-field
            - nondefaultable-tuple-field
          markdown: |-
            A typed class or trait field may omit its initializer when its declared type has
            a canonical default. Boolean fields receive `false`, numeric fields receive
            typed zero, strings and bytes receive empty values, `T|none` receives `none`,
            and list, map, set, unordered-map, and unordered-set fields receive empty
            collections.

            Plain `none`, tuples, source objects, references, callables, resources, and
            other runtime contracts are nondefaultable. Every effective class field must
            have a canonical or explicit default. A trait may provide an initializer, or the
            using class may override the field with one. Inherited initializers retain their
            declaring source and object context. Omission never infers a type, invokes an
            arbitrary constructor, or puts hidden `none` into `T`.
    - id: declaration
      title: Declaring field metadata
      blocks:
        - type: rule
          id: rule.classes.field-metadata
          level: must
          since: null
          evidence:
            - class-field-metadata
            - duplicate-class-field-metadata
            - conflicting-external-field-name
            - malformed-class-field-metadata
          markdown: |-
            An instance field may carry one trailing `metadata (...)` clause. Version one
            defines string `external-name` and boolean `secret`. A metadata name cannot
            repeat, static and non-field declarations cannot carry field metadata, and
            effective external names must be unique within a class.

            A canonical type default or ordinary initializer is the effective field default,
            including when contributed by a trait or inherited from a base. `T|none` remains
            the source spelling for optionality. The resolved field descriptor derives
            `defaulted` and `optional`; facilities must not introduce parallel default or
            optional metadata.
    - id: reflection
      title: Reflecting resolved fields
      blocks:
        - type: rule
          id: rule.classes.field-metadata-reflection
          level: must
          since: null
          evidence:
            - class-field-metadata
            - implicit-class-field-defaults
          markdown: |-
            A class descriptor exposes `field-count` and parallel, declaration-ordered
            `field-names`, `field-external-names`, `field-defaulted`, `field-optional`, and
            `field-secret` lists. Inherited replacement is resolved before observation.
            Names are Terrane semantic names rather than generated Rust identifiers.
    - id: classes
      title: "Classes and Construction"
      blocks:
        - type: markdown
          markdown: |-
            A class defines typed state and methods. Construction is explicit:
            `instance class; arguments` creates an instance semantically and invokes its
            conventional `construct` method. Calling a class directly does not construct an
            object.

            Within an instance method, `this` denotes the current instance. `self` denotes
            the effective late-bound class and can be used in `instance self;`. Separately
            constructed objects are independent: mutating one instance’s state, including a
            defaulted collection field, does not mutate another instance.

            A typed class or trait field may omit its initializer only when its declared
            type has a canonical default:

            - `bool` defaults to `false`.
            - A numeric type defaults to zero of that declared type.
            - `string` defaults to `''`.
            - `bytes` defaults to empty bytes.
            - `T|none` defaults to `none`.
            - `list`, `map`, `set`, `unordered-map`, and `unordered-set` default to an empty
              collection of the declared type.

            Omitting an initializer requests the canonical value for the declared type. It
            does not infer the field’s type, invoke an arbitrary constructor, or make a
            plain `T` optional. Plain `none`, tuples, source objects, references, callables,
            resources, and other runtime contracts are not defaultable and require an
            explicit initializer.

            These rules apply to the complete effective field set, including fields declared
            by the class, inherited fields, and fields contributed by traits. A trait may
            supply an initializer, and the class using that trait may override the field.
            Every nondefaultable effective field must have an explicit initializer. Explicit
            initializers are interpreted in the source and object context of the declaration
            that supplies them.

            Instance fields may have one trailing metadata clause:
        - type: example
          id: legacy-fence-001
          title: null
          language: terrane
          mode: illustrative
          target: null
          timeout-ms: null
          source: |2
            field T = value metadata (external-name = 'wireName', secret = true)
          response: null
          diagnostic: null
          markdown: null

        - type: markdown
          markdown: |-
            Field metadata is not valid on static fields. `external-name` must be a string,
            `secret` must be a boolean, metadata names cannot repeat, and effective external
            names must be unique within a class.

            Class reflection exposes the parallel, declaration-ordered lists `field-names`,
            `field-external-names`, `field-defaulted`, `field-optional`, and `field-secret`,
            together with `field-count`. The resolved field determines these properties: an
            explicit or canonical default, including one contributed by a base class or
            trait, determines `defaulted`; a declared `T|none` determines `optional`.
            Document mapping and redaction use the same field metadata.
