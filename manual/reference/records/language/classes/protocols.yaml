documentation:
  status: complete
  title: Protocols, interfaces, and traits
  title-style: text
  summary: >-
    Distinguishes unnamed structural operation shapes, named nominal dispatch contracts, and reusable source implementation.
  tags: [classes, protocols, interfaces, traits, truth, iteration]
  sections:
    - id: roles
      title: Three distinct object mechanisms
      blocks:
        - type: markdown
          markdown: |-
            A **protocol** is an unnamed structural operation shape. It is satisfied by the
            required members on a canonical descriptor without a declaration, nominal
            identity, or dispatch object.

            An **interface** is a named nominal contract and type object. A class adopts it
            explicitly with `implements`; the compiler checks its required signatures and
            uses it as a typed dispatch boundary.

            A **trait** is reusable Terrane source implementation. `uses` composes its
            fields and methods into a class with explicit conflict handling. It is not a
            type or a subtyping relation. In particular, Terrane traits do not play Rust
            traits' role: a projected Rust trait maps toward a Terrane interface because
            both are named conformance contracts.

            Compiler descriptor operations implement lookup and reflection internally. They
            are not a fourth public source construct.
    - id: satisfaction
      title: Descriptor-based protocol satisfaction
      blocks:
        - type: markdown
          markdown: |-
            Structural protocols are satisfied by the required member shape on the canonical
            source descriptor. Iteration and truth use the same recursive protocol-member
            query, including members inherited from a base or supplied by trait or interface
            composition.
    - id: invocation-authority
      title: Operation authority in structural and nominal contracts
      blocks:
        - type: markdown
          markdown: |-
            Invocation mode is part of an operation shape. Plain `function` is shared,
            `mutable function` grants repeatable update authority, and `consuming function`
            grants one-shot transfer authority. An interface requirement writes that
            boundary explicitly; the compiler does not infer it from one implementing class.

            An implementation may use less authority than its destination, never more:
            shared satisfies shared, mutable, or consuming; mutable satisfies mutable or
            consuming; consuming satisfies only consuming. Structural protocol checks apply
            the same mode-aware shape comparison without introducing a nominal protocol
            identity.
    - id: truth
      title: Truth protocol
      blocks:
        - type: markdown
          markdown: |-
            A class instance may be an `if` or `while` condition when its descriptor defines
            a non-static `truth` method. The method must be synchronous, non-throwing,
            shared, parameterless, and return `bool`. A malformed or missing method is
            rejected at the condition.
        - type: example
          id: truth-protocol
          title: Use a class as a condition
          language: terrane
          mode: run
          target: null
          timeout-ms: null
          source: |-
            namespace reference-examples/truth-protocol

            class gate
              function truth bool;
                return true

            function main;
              value = instance gate;
              if value
                print; 'open'
          response:
            kind: stdout
            language: text
            display: on-run
            content: |-
              open
          diagnostic: null
          markdown: null
