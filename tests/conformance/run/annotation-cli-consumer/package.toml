package = "annotation-cli-consumer"

[namespaces]
annotation-cli-consumer = "src/app"
annotation-cli = "src/cli-schema"

[consumers.cli]
command = ".trn/consumers/cli"
args = ["--summary", "Configured command summary"]
declarations = ["/annotation-cli-consumer::greet", "/annotation-cli-consumer::greet::name", "/annotation-cli-consumer::greet::limit"]
