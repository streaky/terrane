package = "projected-macro-reexport"

[profile]
name = "projected-macro-reexport"
capabilities = ["build"]

[namespaces]
app = "src"

[rust-modules]
direct_macro = "rust/direct_macro.rs"

[rust-dependencies.terrane-generate-api-witness]
version = "=0.1.0"
effects = ["build"]

[rust-dependencies.terrane-reexport-facade-witness]
version = "=0.1.0"
effects = ["build"]

[rust-dependencies.terrane-reexport-owner-witness]
version = "=0.1.0"
effects = ["build"]
