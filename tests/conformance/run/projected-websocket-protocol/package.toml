package = "projected-websocket-protocol"
executor = "threaded"

[profile]
name = "projected-websocket-protocol"
capabilities = ["build", "networking", "threads"]

[namespaces]
app = "src"

[rust-dependencies.axum]
version = "=0.8.9"
features = ["ws"]
effects = ["build", "networking"]

[rust-dependencies.axum-core]
version = "=0.5.6"
effects = ["build"]

[rust-dependencies.bytes]
version = "=1.12.1"
effects = ["build"]

[rust-dependencies.tokio]
version = "=1.53.0"
features = ["net"]
effects = ["build", "networking", "threads"]

[rust-dependencies.tower-service]
version = "=0.3.3"
effects = ["build"]

[rust-dependencies.terrane-integration-adapters]
version = "=0.1.0"
features = ["axum-08"]
effects = ["build", "networking", "threads"]

[rust-dependencies.terrane-websocket-peer-witness]
version = "=0.1.0"
effects = ["build", "networking", "threads"]
