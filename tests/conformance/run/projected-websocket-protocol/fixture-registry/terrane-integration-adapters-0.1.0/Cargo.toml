[package]
name = "terrane-integration-adapters"
version = "0.1.0"
edition = "2024"
publish = false

[[package.metadata.terrane.namespace-overlays]]
module = "axum_08"
target-package = "axum"
feature = "axum-08"

[features]
default = []
axum-08 = ["dep:axum", "dep:tokio"]

[dependencies]
axum = { version = "=0.8.9", features = ["ws"], optional = true }
tokio = { version = "=1.53.0", features = ["net"], optional = true }
