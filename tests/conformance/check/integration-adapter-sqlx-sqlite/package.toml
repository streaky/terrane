package = "integration-adapter-sqlx-sqlite"
executor = "threaded"

[profile]
name = "adapter-check"
capabilities = ["build", "filesystem"]

[namespaces]
app = "src"

[rust-dependencies.sqlx-sqlite]
package = "sqlx-sqlite"
version = "=0.8.6"
features = ["bundled"]
effects = ["build", "filesystem"]

[rust-dependencies.sqlx-core]
version = "=0.8.6"
effects = ["build"]

[rust-dependencies.futures-core]
version = "=0.3.31"
effects = ["build"]

[rust-dependencies.terrane-integration-adapters]
package = "terrane-integration-adapters"
version = "=0.1.0"
features = ["sqlx-sqlite"]
effects = ["build", "filesystem"]
