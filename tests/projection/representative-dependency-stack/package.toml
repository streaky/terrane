package = "representative-dependency-stack"

[profile]
capabilities = ["build"]

[namespaces]
"projection-probe/app" = "src/app"
"projection-probe/service" = "src/service"
"projection-probe/streams" = "src/streams"

[rust-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"], effects = ["build"] }
tower = { version = "=0.5.3", default-features = false, features = ["limit", "timeout", "util"], effects = ["build"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["limit", "request-id", "timeout", "trace"], effects = ["build"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"], effects = ["build"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], effects = ["build"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["json", "postgres", "runtime-tokio-rustls"], effects = ["build"] }
utoipa = { version = "=5.5.0", features = ["axum_extras", "chrono", "uuid"], effects = ["build"] }
utoipa-swagger-ui = { version = "=9.0.2", default-features = false, features = ["axum", "vendored"], effects = ["build"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"], effects = ["build"] }
tracing = { version = "=0.1.44", effects = ["build"] }
sentry = { version = "=0.46.2", default-features = false, features = ["reqwest", "rustls"], effects = ["build"] }
