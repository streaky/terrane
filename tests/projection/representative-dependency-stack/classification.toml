[[decision]]
unit = "A8"
outcome = "deferred"
witness = "sqlx::Row::try_get"
reason = "the concrete accessor is lifetime-parameterized over the row borrow and database decode associated types, which the bounded A4 oracle cannot express; the exact application boundary is cheaper and safer as an owned narrow facade"

[[decision]]
unit = "A9"
outcome = "deferred"
witness = "sqlx::query(...).bind(...).execute(...)"
reason = "the only demanding exact witness terminates in an async operation; admitting its non-escaping temporary chain before Phase B would create an unexecutable success path, while an owned narrow facade is available"

