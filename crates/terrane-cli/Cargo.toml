[package]
name = "terrane-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "terrane"
path = "src/main.rs"

[features]
default = ["iterator-list-builders"]
iterator-list-builders = []

[dependencies]
terrane-compiler = { path = "../terrane-compiler" }
serde_json = "1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
num-bigint = "0.4"
signal-hook = "0.3"
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
toml = "0.8"

[lints]
workspace = true
