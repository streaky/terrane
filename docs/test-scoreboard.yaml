format: 1
title: Terrane test timing scoreboard
metadata:
  description: Bounded-parallel wall-clock measurements from stable Rust libtest plus compiler-owned nested
    case timings. Libtest durations are inferred from its deterministic alphabetical queue and completion
    events. Dependency-free generated-crate compilation has its own shared timing row instead of being
    estimated per case; durations include small runner and output overhead and are intended for relative
    development feedback.
  timing_mode: cargo test with bounded --test-threads; scheduler-inferred active durations plus nested
    timing records
  history_limit: 8
