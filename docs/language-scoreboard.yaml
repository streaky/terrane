format: 1
title: Terrane language scoreboard
metadata:
  as_of: '2026-09-10'
  description: Curated feature-level view of implemented, active, potential, deferred, and intentionally excluded
    Terrane language work.
  completion_rule: Completion measures the named feature only. Done is 100; planned, potential, deferred, and excluded
    are 0; partial entries use a conservative editorial estimate backed by their notes.
  authority:
  - docs/compiler-plan.md
  - docs/surface-today.md
  - docs/language-spec-and-compiler-architecture-draft.md
  - docs/language-spec-concise.md
  - manual/reference/manual.yaml
  generator: docs/generate-language-scoreboard.py
  output: docs/language-scoreboard.html
statuses:
  done:
    label: Done
    description: Implemented end to end with executable evidence.
  partial:
    label: Partial
    description: A coherent subset works, but the named capability remains incomplete.
  planned:
    label: Planned
    description: Settled remaining work assigned to an active compiler milestone.
  potential:
    label: Potential
    description: Open design or prototype point with no committed milestone.
  deferred:
    label: Deferred
    description: Explicitly outside version one; no incompatible private syntax.
  excluded:
    label: Excluded
    description: Intentionally absent from the stated scope or replaced by a different contract.
reference_states:
  documented: The named existing manual/reference record covers the feature.
  partial: The named existing record covers only part of the feature.
  planned: The path is the intended future home; the record does not exist yet.
  not-applicable: Compiler-internal behavior that does not need a language reference record.
categories:
- id: syntax
  label: Syntax and source structure
  description: Lexing, layout, grammar, declarations, and control syntax.
- id: names
  label: Names, namespaces, and packages
  description: Name identity, scopes, imports, manifests, and build selection.
- id: types
  label: Types and type relations
  description: Core types, descriptors, unions, refinement, and compatibility.
- id: numerics
  label: Numerics and conversion
  description: Integer and floating semantics, arithmetic, and coercion.
- id: callables
  label: Functions, control, and errors
  description: Calls, callable values, control flow, effects, and structured failure.
- id: text-data
  label: Text, bytes, and collections
  description: Text processing, encodings, collection behavior, and iteration.
- id: objects
  label: Objects, ownership, and lifetime
  description: Classes, protocols, traits, references, movement, and lifecycle.
- id: async
  label: Async and concurrency
  description: Tasks, cancellation, streams, channels, and synchronized state.
- id: stdlib
  label: Standard library and system facilities
  description: Core packages for files, documents, networking, observability, and utilities.
- id: interop
  label: Interop, tooling, and delivery
  description: Rust projection, native boundaries, diagnostics, editor tooling, and releases.
- id: future
  label: Potential and deferred language
  description: Unsettled studies and explicitly post-version-one capabilities.
